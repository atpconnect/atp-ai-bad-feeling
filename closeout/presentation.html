<!DOCTYPE html>
<html lang="en">
<head>

<title>The Throne Room, ATP September 17, 2026 (pre-seeded)</title>
<style>
  :root {
    /* Everything sizes off --fs so presentation mode is one number, not a restyle.
       --s is nudged live with + and - because the only way to know what reads from
       the back of a particular room is to stand in it. */
    --base-fs: 15px;
    --s: 1;
    --fs: calc(var(--base-fs) * var(--s));
    --maxw: 940px;
    /* Set per screen from THEMES. The defaults here are the method-screen palette. */
    --brand: #2C6FBF;
    --page: #f5f7f8;
    --warnbg: #fdf6ee;
    --warn: #B4610C;
    --ink: #14181a;
    --ink-2: #4a5257;
    --ink-3: #697276;
    --line: #e3e7e9;
    --fill: #f5f7f8;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page); color: var(--ink);
    transition: background 320ms ease, color 200ms ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: var(--fs); line-height: 1.5;
  }
  /* Presentation mode is one number. Everything sizes off --fs, so doubling --s
     doubles the whole deck rather than restyling it screen by screen. */
  :root.presenting { --s: 2; --maxw: 1760px; }
  :root.presenting .shell { padding: 12px 16px 20px; }
  :root.presenting .stage { padding: 20px 26px 18px; }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.55); }
  :root.presenting .lede { margin-bottom: calc(var(--fs) * 0.7); }
  :root.presenting .rule { margin: 10px 0 16px; }
  :root.presenting .takeaway { margin-top: calc(var(--fs) * 0.7); }
  /* Headline big, detail a step down. On a projector the headline is what carries the
     room and the detail is what the phone is for. */
  /* The projector shows headlines. The phone shows the detail.

     This is not a compromise, it is the measurement: five headlines each followed by
     two lines of detail needs 1458px of a 993px screen at readable type, so something
     has to go, and it should be the thing nobody reads off a wall in a bar. Headlines
     plus the takeaway is a slide. Headlines plus 400 characters of detail is a document
     being projected at people. Press D to reveal the detail on any screen. */
  :root.presenting ol.points .d { display: none; }
  :root.presenting.details ol.points .d { display: block; font-size: calc(var(--fs) * .72); }
  :root.presenting ol.points .t { font-size: calc(var(--fs) * 1.05); }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.42); }
  :root.presenting .follow { margin-top: 8px; padding-top: 8px; }
  :root.presenting .follow .t { font-size: calc(var(--fs) * .55); }
  /* Big enough to scan from the back of the room, which is the only size that counts.
     A QR only the front two rows can reach is decoration. */
  :root.presenting .followqr { width: calc(var(--fs) * 4.6); }
  :root.presenting .follow .t { font-size: calc(var(--fs) * .62); }
  .shell { max-width: var(--maxw); margin: 0 auto; padding: 28px 24px 64px; }
  .stage { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 34px 38px 30px;
           box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 14px 44px rgba(0,0,0,.12); }

  .rail { display: flex; gap: 4px; margin-bottom: 22px; }
  .rail span { flex: 1; height: 3px; background: var(--line); cursor: pointer; }
  .rail span.done { background: var(--ink-3); }
  .rail span.now { background: var(--brand); }

  .topline { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .wordmark { color: var(--brand); font-weight: 800; letter-spacing: .18em; font-size: calc(var(--fs) * .8); }
  .divider-v { width: 1px; height: 12px; background: var(--line); }
  .kicker { font-size: calc(var(--fs) * .8); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
  .count { margin-left: auto; font-size: calc(var(--fs) * .8); color: var(--ink-3); font-variant-numeric: tabular-nums; }

  h1 { font-size: calc(var(--fs) * 1.6); line-height: 1.25; margin: 4px 0 0; font-weight: 650; }
  .rule { width: 48px; height: 2px; background: var(--brand); margin: 12px 0 24px; }
  p { margin: 0 0 12px; }
  .lede { font-size: calc(var(--fs) * 1.07); margin-bottom: 20px; }

  ol.points { list-style: none; margin: 0; padding: 0; }
  ol.points li { display: flex; gap: 14px; margin-bottom: 15px; }
  ol.points .n { color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; min-width: calc(var(--fs) * 1.35); }
  ol.points .t { font-weight: 600; }
  ol.points .d { color: var(--ink-2); }

  .pill { display: inline-block; font-size: calc(var(--fs) * .7); letter-spacing: .07em; font-weight: 700;
          color: var(--brand); border: 1px solid var(--brand); border-radius: 3px;
          padding: 1px 6px; vertical-align: 2px; margin-left: 4px; }
  .pill.warn { color: var(--warn); border-color: var(--warn); }

  .flag { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
          color: var(--ink-2); padding: 11px 14px; border-radius: 4px; margin-bottom: 18px; font-size: calc(var(--fs) * .93); }
  .flag b { color: var(--warn); }

  .callout { border: 1px solid var(--line); border-left: 3px solid var(--brand); background: var(--fill);
             padding: 12px 14px; border-radius: 4px; margin-top: 20px; }
  .callout .h { font-weight: 650; margin-bottom: 4px; }
  .callout .b { color: var(--ink-2); }
  .qr { display: block; width: 132px; height: 132px; margin: 12px 0 2px; image-rendering: pixelated; }

  .takeaway { border-left: 3px solid var(--brand); background: var(--fill); padding: 10px 14px; margin-top: 24px; }
  .takeaway .h { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-bottom: 3px; }
  .takeaway .b { font-weight: 600; }

  .nav { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  button { font: inherit; font-size: calc(var(--fs) * .87); padding: 6px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--fill); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  .nav .right { margin-left: auto; font-size: calc(var(--fs) * .8); color: var(--ink-3); }

  .voices { display: flex; align-items: center; gap: 6px; margin-top: 14px;
            padding-top: 14px; border-top: 1px solid var(--line); }
  .voices .lab { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-right: 4px; }
  .voices button { font-size: calc(var(--fs) * .8); padding: 4px 10px; }
  .voices button.on { background: var(--brand); color: var(--bg); border-color: var(--brand); }
  /* Demo builds carry this on every screen, not just the first. A page of invented
     people and invented numbers sitting at a public URL has to say so wherever the
     reader happens to land, including on a deep link straight into station four. */
  /* Selecting a narrator on a screen that never changes voice used to do nothing at
     all, with the only explanation in small grey type at the far edge of the voice
     bar. The deck opens on one of those screens, so the first thing anyone tried
     looked broken. Say it where they are looking. */
  .voicenote { border-left: 3px solid var(--brand); background: var(--fill);
               padding: 9px 13px; border-radius: 4px; margin-bottom: 18px;
               font-size: calc(var(--fs) * .85); color: var(--ink-2); }
  .voicenote b { color: var(--ink); }

  .demobar { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
             color: var(--ink-2); padding: 9px 13px; border-radius: 4px;
             margin-bottom: 16px; font-size: calc(var(--fs) * .8); }
  .demobar b { color: var(--warn); }

  .follow { display: flex; align-items: center; gap: 12px; margin-top: 12px;
            padding-top: 12px; border-top: 1px solid var(--line); }
  .followqr { width: 62px; aspect-ratio: 1 / 1; flex: none; display: block;
              background: #fff; padding: 4px; border-radius: 3px; }
  .follow .t { font-size: calc(var(--fs) * .8); color: var(--ink-3); line-height: 1.45; }
  .follow .t b { color: var(--ink-2); }
  .follow .u { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: calc(var(--fs) * .72); color: var(--ink-3); word-break: break-all; }

  .voices .hint { margin-left: auto; font-size: calc(var(--fs) * .77); color: var(--ink-3); }

  #printAll { display: none; }
  @media print {
    body { background: #fff; --page: #fff; }
    .rail, .nav, .stage { display: none !important; }
    .shell { max-width: none; padding: 0; }
    #printAll { display: block; }
    #printAll .page { page-break-after: always; padding: 0 0 24px; }
    #printAll .page:last-child { page-break-after: auto; }
  }
</style>

<script>
// VOICES is [[key, label], ...] in display order.

const DECKS = {
 "straight": [
  {
   "id": "method",
   "kicker": "How this was made",
   "title": "Five rooms, one picture, ten minutes",
   "takeaway": "The AI did the reading. Everything that had one correct answer was done by code.",
   "body": "<p class=\"lede\">Five stations ran in parallel. Nobody was in more than one of them. This deck existed before the last one finished talking.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Every station was recorded to its own meeting, hosted by one person</span><br><span class=\"d\">Not by the pilot running the room. One account owned all five, so no session depended on a presenter remembering to press a button correctly.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Ending the meeting is what starts the transcript</span><br><span class=\"d\">Teams generates a transcript 2.5 to 5 minutes after a meeting is ended, not left. Five staggered endings, then one to three minutes for the model to read every word said in this building and answer. That is the budget you just watched us spend, and every number in it was measured in rehearsal.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model was given the transcripts and a written brief, and asked for data</span><br><span class=\"d\">Not for a deck. It returns structured content, which is checked against a schema before anything is rendered. Wrong shape, wrong station name, too many bullets: rejected, and the previous deck stands.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The slides you are looking at were generated by code, not by the model</span><br><span class=\"d\">Order, branding, navigation, this screen, the QR code: all deterministic. The model only wrote the parts that needed judgment about what was said.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Two models ran at once, and it was not a race</span><br><span class=\"d\">A fast standby answered the same question in parallel. The good model got the whole deadline to itself and the standby was only used if it missed. Measured on the night's transcripts: 81 seconds against 167. A race would have handed you the weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy was built <b>before the stations ran</b>, from the question lists and the answers we expected to hear. It is the floor, not the deck: if every recording in the building had failed, this is what you would be looking at, and it would say so on every screen. Written by the primary model. Generated 2026-09-11 13:50.</div></div>"
  },
  {
   "id": "reliability",
   "kicker": "The transferable part",
   "title": "Why this worked when your AI program did not",
   "takeaway": "Give the model the judgment call. Never give it anything you could check by machine instead.",
   "body": "<p class=\"lede\">Nothing here needed a better model. It needed the unglamorous things around the model to be decided in advance, and every one of them is a thing your program can do on Monday.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Deterministic wherever determinism is available</span><br><span class=\"d\">The model wrote the words. Code decided the running order, the branding, which stations are flagged, the navigation, the QR, and this sentence. A model that cannot choose the running order cannot get the running order wrong. Shrink what it is allowed to decide and you shrink what a human has to check at 7:50pm.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Never ask a model a question you can already answer</span><br><span class=\"d\">Which stations produced a real recording is a fact sitting on a disk. The deck reads it from there and throws away whatever the model says about it. That closed a real hole: a model that relabelled a failed station as a real one silently deleted the warning built to catch exactly that.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Constrain the output until it can be validated</span><br><span class=\"d\">It returns JSON against a fixed schema, not slides. Unknown station, missing station, too many bullets: rejected, and the deck already on disk stands untouched. You cannot check free text. You can check a schema.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Write the evals before the night, and test the disasters</span><br><span class=\"d\">137 automated checks across 24 rehearsals of this evening, including no transcript at all, prose instead of JSON, a crashed CLI, a transcript arriving late, and a narrator quietly dropping the numbers. The happy path is the least useful thing you can test.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Score the things you would otherwise argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"
  },
  {
   "id": "sky-city",
   "kicker": "Sky City",
   "title": "Infrastructure and integration with third-party tools",
   "takeaway": "Read the exit clause as carefully as the price, because the price is the easy part.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This room's agenda centered on the gap between vendor sales cycles and vendor production reality: what demos don't show, what contracts quietly redefine once real traffic hits, and what it costs to leave once you're in. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Demo environment, production environment</span><br><span class=\"d\">The agenda asked what a sales demo doesn't show: a clean data slice, one tenant, no real load. The framing was that the gap surfaces the first week of real traffic, somewhere the demo never covered.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">A rate limit is not always a rate limit</span><br><span class=\"d\">Questions probed contract terms that read one way and behave another in production, like a shared rate limit written as if it were dedicated capacity, revealed only once other customers are also having a busy Monday.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Vendors change things without asking</span><br><span class=\"d\">A recurring question was what happens when a vendor swaps a model or API version on its own schedule with no pinning option on the tier purchased, leaving nobody watching for the quality shift.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The 2am call goes to the customer, not the vendor</span><br><span class=\"d\">The station asked who owns an integration outage at 2am, built around the premise that SLAs typically cover the vendor's own uptime, not the workflow a customer built on top of it.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">What it costs to walk away</span><br><span class=\"d\">Closing questions were about exit cost: whether an abstraction layer was built to keep switching options open, and what a clean break from a vendor would cost today in time, dollars, or both.</span></span></li></ol>"
  },
  {
   "id": "swamp-planet",
   "kicker": "Swamp Planet",
   "title": "Technical debt and data quality",
   "takeaway": "Profile the data before you promise anything to anyone.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station's questions worked backward from one premise: every AI project is a data cleanup project wearing a different name, and the agenda was about naming what's actually underneath. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">The schema on paper and the schema in production</span><br><span class=\"d\">The opening question asked what teams discover about their data the moment an AI system tries to use it, built around documented schemas and real contents having quietly diverged years earlier while downstream teams built workarounds nobody flagged.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Cleanup ate the budget nobody planned for it</span><br><span class=\"d\">The agenda cited a specific split, seventy to eighty percent of an AI project's effort going to data cleanup never scoped into the original budget, and asked how common that ratio actually is.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Ownerless data</span><br><span class=\"d\">A question asked teams to name who owns their worst data today, built around the likelihood it traces to a merger or acquisition and that the one person who understood it has since left.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">What breaks downstream when nobody's watching</span><br><span class=\"d\">The station asked what broke, and how long it took anyone to notice, when a workaround changed something a report or process downstream quietly depended on.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Confidently wrong in front of a customer</span><br><span class=\"d\">One question asked whether an AI system had ever given a customer a confidently wrong answer because of bad underlying data, and whether that did more damage than an outage simply because nobody caught it in time.</span></span></li></ol>"
  },
  {
   "id": "ice-planet",
   "kicker": "Ice Planet",
   "title": "Use cases, costs, and scope creep",
   "takeaway": "A stalled project still costs money every month nobody reviews the line item.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station's questions were about the space between a pilot that's not cancelled and a pilot that's not shipped, and what accumulates in every month a project sits in exactly that gap. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Started in double digits, live in low single digits</span><br><span class=\"d\">The opening question asked how many AI use cases a company has started versus how many are running in production today, built around an expected gap wide enough to be the whole story of the station.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Nobody owns it once the pilot ends</span><br><span class=\"d\">A central question was why a use case stalls, framed around the handoff moment: no named owner with budget authority once the team that built the pilot moves on.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Nobody wants to call it finished</span><br><span class=\"d\">The agenda asked who decides a stalled pilot is actually done, with the likely answer being nobody, because closing it out loud means admitting it didn't work.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Scope grows after the budget is set</span><br><span class=\"d\">A question asked how far scope moved between approval and today, built around one workflow quietly picking up a compliance review, a second business unit, and an executive's pet feature before anyone revisits the budget.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The blocker is rarely technical</span><br><span class=\"d\">The closing question asked whether the real blocker is technical, organizational, or political, with the expectation that the model usually works fine and the missing piece is the process to put it in front of a real user.</span></span></li></ol>"
  },
  {
   "id": "snow-monster-cave",
   "kicker": "Snow Monster Cave",
   "title": "Dev",
   "takeaway": "The model integration isn't what eats the time; the eval set, the on-call plan, and the ownership question are.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station's questions were about what changes inside the build itself when the feature is AI: how testing works when output isn't deterministic, who's on call, and who's holding the pager after the builder moves on. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Nondeterministic output breaks the normal test suite</span><br><span class=\"d\">The opening question asked what's genuinely different about testing and review for an AI feature, built around a smaller hand-checked eval set replacing CI, one that's slower and gets skipped under deadline pressure.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Passed every test, broke in production anyway</span><br><span class=\"d\">A question asked for an example of a change that passed the whole eval set and still shifted tone or accuracy at real volume, catchable only by a user complaint rather than a dashboard.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The pager finds whoever built it</span><br><span class=\"d\">The station asked who's on call when an AI feature misbehaves at 2am, framed around the likelihood it's informally the one or two engineers who built it, since the service never got a real rotation.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Ownership collides when two teams share a prompt</span><br><span class=\"d\">A question asked what broke when two teams each assumed they owned the same AI behavior, built around a shared prompt template where one team's fix silently changed the other's output.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">You can't roll back a vendor's weights</span><br><span class=\"d\">The closing question asked how you roll back a system that's partly your code, partly a prompt, and partly a model version you don't control, noting that pinning and reverting is sometimes only a partial fix.</span></span></li></ol>"
  },
  {
   "id": "asteroid-field",
   "kicker": "Asteroid Field",
   "title": "Compliance, legal, and security",
   "takeaway": "Bring legal and security into the design conversation, not the review at the end.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station's questions worked through the review everyone dreads and goes through anyway: what legal and security actually catch, and what it costs to route around them instead. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Where did the training data come from</span><br><span class=\"d\">The opening question asked what legal asked about an AI system that couldn't be answered, centered on data provenance and whether the output could be explained to a regulator in plain language.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">A requirement can kill a use case outright</span><br><span class=\"d\">A question asked whether compliance or security has ever ended an AI use case, framed around a decision that has to be explainable meeting a model that can't explain itself.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Nobody wants to be the signature</span><br><span class=\"d\">The station asked who actually signs off that an AI decision or vendor is safe enough for a customer, with the expectation that the vacuum where nobody wants to own that call stalls more work than any technical limit.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Security review wasn't built for a system that changes without a release</span><br><span class=\"d\">A question asked what happened when an AI vendor went through a normal security review, built around the process either passing something it shouldn't have or stalling against a system whose behavior moves outside a release cycle.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">No regulatory position is worse than a strict one</span><br><span class=\"d\">The closing question asked whether the company's regulator had taken a formal position on AI yet, built around the idea that having nothing to design against is worse than a strict rule.</span></span></li></ol>"

   "title": "What nobody in one room could see",
   "takeaway": "Every station arrived at the same room from a different hallway: a place where somebody had a bad feeling about this and green-lit it anyway, because turning back wasn't actually on the table. The fix was never a smarter model. It was a name on the ownership line before the deadline, not after the outage.",
   "body": "<p class=\"lede\">Nobody has said any of this yet. These are the patterns we expect to connect the five stations, written in advance. The real ones get written on the night, from what the rooms actually say.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">The ownership question shows up everywhere</span><br><span class=\"d\">Every station's agenda circled back to the same missing name: who owns the vendor relationship at 2am, who owns data after the one person who understood it leaves, who owns a stalled pilot, who's on call after a feature's builder moves on, who signs off that a system is safe. Five rooms, the same blank line.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The real cost shows up after the budget is set</span><br><span class=\"d\">Sky City's contract terms, Swamp Planet's cleanup effort, Ice Planet's scope creep, and Asteroid Field's after-the-fact controls all point to the same shape: the number that mattered wasn't in the original estimate, and it surfaced only once the project was already running.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">What passed the test didn't survive contact with production</span><br><span class=\"d\">Sky City's sales demo, Swamp Planet's clean data subset, and Snow Monster Cave's eval set all describe the same failure: something looked fine under controlled conditions and moved once real volume, real tenants, or real data hit it.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The system underneath keeps moving without asking</span><br><span class=\"d\">Sky City's unpinned model swaps, Snow Monster Cave's un-rollback-able vendor weights, and Asteroid Field's security review built for a world where behavior only changes at a release, all describe dependency on something that changes on somebody else's schedule.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Every station arrived at the same room from a different hallway: a place where somebody had a bad feeling about this and green-lit it anyway, because turning back wasn't actually on the table. The fix was never a smarter model. It was a name on the ownership line before the deadline, not after the outage.</div><div class=\"b\">Everything behind this deck, including the station transcripts and the tool that built it, is at <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>. Take it and run this at your own company.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHDmT4Bn2uYL2ua1mclrM5O/oW1em5m81jZfMDN5rW1ea5u/YWbyWtu8NjN5rW2A/98GAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzJ/8uLaBV2Ymr7XNF7TNazOTv2Fm8gUzk9fa5lfNTP6GtvmCtuHf1zb8ng0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZP/mQmQn8y9rmtZnJa2    "title": "What that discipline caught, in this deck, this week",
   "takeaway": "Every one of these was found by running the thing. Not one was found by reading it.",
   "body": "<p class=\"lede\">This is an AI program too, so it had a bad feeling about itself. Six defects, all of them from rehearsal, none of them from review.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A bug that would have failed live, in this room, tonight</span><br><span class=\"d\">The prompt was passed as a shell argument. Linux caps a single argument at 128KB and five real transcripts come to 285KB, so it worked in every small test and would have died the moment it saw the real thing, with everyone sitting here.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model could quietly promote a failed station to a real one</span><br><span class=\"d\">Which deleted the on-screen warning that exists to prevent precisely that. Not fixed with a better prompt. Fixed by never asking.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A 26-character overrun threw away an entire run</span><br><span class=\"d\">Validation could not tell the difference between output that was wrong and output that was merely too long. Now it can: one rejects, the other gets trimmed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Two models running in parallel were running in sequence</span><br><span class=\"d\">And producing perfect output the whole time. Caught only because a test asserted on elapsed time rather than on the result.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The QR codes rendered as perfectly sized blank squares</span><br><span class=\"d\">Right dimensions, right position, nothing inside. No assertion about the markup would have caught it, so the test now scans the code back with a barcode reader.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">A narrator that changed 9% of the words and passed every check</span><br><span class=\"d\">Correcting one failure produced its exact opposite. The first Yoda inverted nearly every sentence into something you had to read twice. The fix came back 91% identical to the plain text: it validated perfectly and was pointless on stage. Vader landed at 58% of fields rewritten and is now at 100%. Three worked examples per character fixed both, showing one real sentence too weak, right, and too far. The answer to fear is never the obviously wrong one. It is the one that looks exactly right.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Take the whole thing</div><div class=\"b\">The principles above, each with the code that implements it and the defect it caught, plus how to run this format yourself: read RUN-THIS-YOURSELF.md. The runbooks, the tool, the brief and every transcript are public too. Scan any screen, or go to <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHDmT4Bn2uYL2ua1mclrM5O/oW1em5m81jZfMDN5rW1ea5u/YWbyWtu8NjN5rW const VOICES = [["straight", "Straight"]];
const UNVOICED = ["method", "reliability", "receipts"];
const THEMES = {"sky-city": {"bg": "radial-gradient(1200px 520px at 12% 8%, #FFE7C7 0%, rgba(255,231,199,0) 62%), radial-gradient(900px 420px at 88% 22%, #FFD1B0 0%, rgba(255,209,176,0) 60%), radial-gradient(1000px 500px at 50% 100%, #F7B98A 0%, rgba(247,185,138,0) 65%), linear-gradient(170deg, #FFF3E2 0%, #FBD9BC 55%, #EFA97A 100%)", "surface": "#FFFBF5", "fill": "#FBF1E4", "line": "#EBDCC8", "ink": "#2A1A0C", "ink2": "#5C4531", "ink3": "#7A6047", "accent": "#9A4F08", "warn": "#8F4B08", "warnbg": "#FDF1E1"}, "swamp-planet": {"bg": "radial-gradient(900px 480px at 20% 10%, #2C4020 0%, rgba(44,64,32,0) 60%), radial-gradient(760px 420px at 82% 78%, #1B3018 0%, rgba(27,48,24,0) 62%), linear-gradient(165deg, #16210F 0%, #1B2A13 50%, #0E170A 100%)", "surface": "#1E2C15", "fill": "#26361B", "line": "#3A4E2C", "ink": "#EDF3E4", "ink2": "#C3D2B2", "ink3": "#9DB088", "accent": "#A8D06A", "warn": "#E8B45C", "warnbg": "#33280F"}, "ice-planet": {"bg": "radial-gradient(1100px 480px at 24% 6%, #FFFFFF 0%, rgba(255,255,255,0) 60%), radial-gradient(900px 500px at 78% 82%, #BFDCEC 0%, rgba(191,220,236,0) 62%), linear-gradient(175deg, #F2F9FD 0%, #DCEBF5 55%, #C2DAEA 100%)", "surface": "#FFFFFF", "fill": "#F0F7FB", "line": "#D6E5EF", "ink": "#0E2430", "ink2": "#3A5665", "ink3": "#5B7787", "accent": "#0F5B78", "warn": "#8F4B08", "warnbg": "#FDF1E1"}, "snow-monster-cave": {"bg": "radial-gradient(820px 420px at 78% 12%, #3A1E1B 0%, rgba(58,30,27,0) 62%), radial-gradient(900px 500px at 14% 88%, #2A1412 0%, rgba(42,20,18,0) 60%), linear-gradient(170deg, #1A1110 0%, #241514 55%, #0F0908 100%)", "surface": "#241615", "fill": "#2E1C1A", "line": "#452926", "ink": "#F6E9E7", "ink2": "#D6B8B4", "ink3": "#B08F8B", "accent": "#F0736B", "warn": "#F0A35C", "warnbg": "#3A2412"}, "asteroid-field": {"bg": "radial-gradient(2px 2px at 18% 22%, #7C8B95 0%, rgba(124,139,149,0) 100%), radial-gradient(3px 3px at 62% 14%, #6B7A85 0%, rgba(107,122,133,0) 100%), radial-gradient(2px 2px at 84% 62%, #7C8B95 0%, rgba(124,139,149,0) 100%), radial-gradient(900px 520px at 70% 20%, #1D242A 0%, rgba(29,36,42,0) 64%), linear-gradient(168deg, #0C0F12 0%, #141A1F 55%, #080A0C 100%)", "surface": "#171B1E", "fill": "#1F262B", "line": "#333D44", "ink": "#E9EDF0", "ink2": "#B8C2C9", "ink3": "#93A0A8", "accent": "#7FB4D4", "warn": "#E8B45C", "warnbg": "#2A2412"}};
const DEFAULT_THEME = {"bg": "#f5f7f8", "surface": "#ffffff", "fill": "#f5f7f8", "line": "#e3e7e9", "ink": "#14181a", "ink2": "#4a5257", "ink3": "#697276", "accent": "#2C6FBF", "warn": "#B4610C", "warnbg": "#fdf6ee"};
const QRS = {"method": "", "reliability": "", "sky-city": "", "swamp-planet": "", "ice-planet": "", "snow-monster-cave": "", "asteroid-field": "", "patterns": "", "receipts": ""};            // screen id -> inline SVG, one per screen, not per voice
const FOLLOW_URL = "https://atpconnect.github.io/atp-ai-bad-feeling/closeout/presentation.html";
const DEMO_NOTICE = "";
let i = 0;
let voice = "straight";
const el = id => document.getElementById(id);
const screens = () => DECKS[voice] || DECKS.straight;

// Themes are applied by setting the CSS variables, so one object drives the whole
// look of a screen and nothing about the layout knows which station it is on.
const VARS = {surface: "--bg", fill: "--fill", line: "--line", ink: "--ink",
              ink2: "--ink-2", ink3: "--ink-3", accent: "--brand", warn: "--warn",
              warnbg: "--warnbg", bg: "--page"};
function themeFor(id) { return THEMES[id] || DEFAULT_THEME; }
function applyTheme(id) {
  const t = themeFor(id), st = document.documentElement.style;
  for (const k in VARS) st.setProperty(VARS[k], t[k]);
}
function themeVars(id) {  // inline form, for the print view where each page differs
  const t = themeFor(id);
  return Object.keys(VARS).map(k => VARS[k] + ":" + t[k]).join(";");
}

const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };

let scale = parseFloat(load("atp-scale", "")) || 0;
let presenting = load("atp-presenting", "0") === "1";

function applyMode() {
  document.documentElement.classList.toggle("presenting", presenting);
  // A saved nudge only means anything for the mode it was set in.
  document.documentElement.style.setProperty("--s", scale || (presenting ? 2 : 1));
  store("atp-presenting", presenting ? "1" : "0");
  autofit();
}

// Shrink until the screen fits the screen. A projector cannot scroll, and the takeaway
// is the last thing on every slide, so anything that overflows takes the line for the
// room with it. Skipped the moment the presenter nudges the size by hand: at that point
// they are standing in the room and know better than this does.
function autofit() {
  if (!presenting || scale) return;
  const root = document.documentElement;
  let s = 2;
  root.style.setProperty("--s", s);
  while (s > 1.15 && root.scrollHeight > window.innerHeight) {
    s = Math.round((s - 0.05) * 100) / 100;
    root.style.setProperty("--s", s);
  }
}
function nudge(delta) {
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--s")) || 1;
  scale = Math.min(5, Math.max(0.6, Math.round((cur + delta) * 20) / 20));
  store("atp-scale", scale);
  applyMode();
}

function setVoice(v) {
  if (!DECKS[v]) return;
  voice = v;
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.classList.toggle("on", b.dataset.voice === v));
  render();
}

function render() {
  const SCREENS = screens();
  const s = SCREENS[i];
  applyTheme(s.id);
  if (DEMO_NOTICE) { el("demobar").hidden = false; el("demobar").innerHTML = DEMO_NOTICE; }
  el("kicker").textContent = s.kicker.toUpperCase();
  el("count").textContent = (i + 1) + " / " + SCREENS.length;
  el("title").textContent = s.title;
  el("body").innerHTML = s.body;
  el("takeaway").textContent = s.takeaway;

  const rail = el("rail");
  rail.innerHTML = "";
  SCREENS.forEach((sc, n) => {
    const seg = document.createElement("span");
    seg.title = (n + 1) + ". " + sc.title;
    seg.className = n === i ? "now" : n < i ? "done" : "";
    seg.onclick = () => { i = n; render(); };
    rail.appendChild(seg);
  });

  if (FOLLOW_URL) {
    el("follow").hidden = false;
    el("followQr").innerHTML = QRS[s.id] || "";
    el("followUrl").textContent = FOLLOW_URL + "#" + s.id;
  }
  // The address bar always points at the screen on show, so the presenter's own URL
  // is shareable mid-talk and a scanned deep link lands on the right slide.
  try { history.replaceState(null, "", "#" + s.id); } catch (e) {}
  autofit();

  el("prev").disabled = i === 0;
  el("next").disabled = i === SCREENS.length - 1;
  const unvoiced = UNVOICED.indexOf(s.id) !== -1;
  const label = (VOICES.find(v => v[0] === voice) || ["", ""])[1];
  el("voiceHint").textContent =
    unvoiced ? "this screen is ours, so it stays straight"
             : "keys 1-" + VOICES.length + ", V to cycle, P to project, D for detail";

  // Say plainly why nothing changed, on the screen where nothing changed.
  const note = el("voicenote");
  if (unvoiced && voice !== "straight") {
    note.hidden = false;
    note.innerHTML = "<b>" + label + " is not narrating this screen.</b> The screens about " +
      "how this was built are ours, not the model's, so they stay in one voice. " +
      "Move to any station screen and " + label + " takes over.";
  } else {
    note.hidden = true;
  }
  // Dim the buttons here too, so the control looks as inert as it is.
  document.querySelectorAll("#voiceButtons button").forEach(b => {
    b.style.opacity = unvoiced && b.dataset.voice !== "straight" ? "0.45" : "";
  });
  window.scrollTo(0, 0);
}
el("prev").onclick = () => { i = Math.max(0, i - 1); render(); };
el("next").onclick = () => { i = Math.min(screens().length - 1, i + 1); render(); };

if (VOICES.length > 1) {
  el("voices").hidden = false;
  el("voiceButtons").innerHTML = VOICES.map(([k, label]) =>
    '<button data-voice="' + k + '">' + label + '</button>').join(" ");
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.onclick = () => setVoice(b.dataset.voice));
}

document.onkeydown = ev => {
  if (ev.key.toLowerCase() === "p") { presenting = !presenting; scale = 0; applyMode(); return; }
  if (ev.key.toLowerCase() === "d") {
    document.documentElement.classList.toggle("details");
    scale = 0; applyMode(); return;
  }
  if (ev.key === "+" || ev.key === "=") { nudge(0.1); return; }
  if (ev.key === "-" || ev.key === "_") { nudge(-0.1); return; }
  if (ev.key === "ArrowRight" || ev.key === " " || ev.key === "PageDown") el("next").click();
  if (ev.key === "ArrowLeft" || ev.key === "PageUp") el("prev").click();
  if (ev.key === "Home") { i = 0; render(); }
  if (ev.key === "End") { i = screens().length - 1; render(); }
  // Voice switching is meant to happen live, mid-sentence, without losing your place.
  if (VOICES.length > 1) {
    if (ev.key.toLowerCase() === "v") {
      const n = VOICES.findIndex(v => v[0] === voice);
      setVoice(VOICES[(n + 1) % VOICES.length][0]);
    }
    const d = parseInt(ev.key, 10);
    if (d >= 1 && d <= VOICES.length) setVoice(VOICES[d - 1][0]);
  }
};
function buildPrint() {
  const SCREENS = screens();
  el("printAll").innerHTML = SCREENS.map((s, n) =>
    '<div class="page" style="' + themeVars(s.id) + '">' +
    '<div class="topline"><span class="wordmark">ATP</span>' +
    '<span class="divider-v"></span><span class="kicker">' + s.kicker.toUpperCase() + '</span>' +
    '<span class="count">' + (n + 1) + ' / ' + SCREENS.length + '</span></div>' +
    '<h1>' + s.title + '</h1><div class="rule"></div>' + s.body +
    '<div class="takeaway"><div class="h">THE LINE FOR THE ROOM</div><div class="b">' +
    s.takeaway + '</div></div></div>').join("");
}
window.onbeforeprint = buildPrint;
if (location.hash === "#print") buildPrint();

// Deep link: land on the screen the QR pointed at.
function fromHash() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const n = screens().findIndex(s => s.id === id);
  if (n >= 0) i = n;
}
fromHash();
window.addEventListener("hashchange", () => { fromHash(); render(); });
window.addEventListener("resize", autofit);

applyMode();
render();
</script>
</body>
</html>
