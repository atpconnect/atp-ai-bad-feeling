<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Throne Room, ATP September 17, 2026 (demo)</title>
<style>
  :root {
    /* Everything sizes off --fs so presentation mode is one number, not a restyle.
       --s is nudged live with + and - because the only way to know what reads from
       the back of a particular room is to stand in it. */
    --base-fs: 15px;
    --s: 1;
    --fs: calc(var(--base-fs) * var(--s));
    --maxw: 940px;
    /* Set per screen from THEMES. The defaults here are the method-screen palette. */
    --brand: #2C6FBF;
    --page: #f5f7f8;
    --warnbg: #fdf6ee;
    --warn: #B4610C;
    --ink: #14181a;
    --ink-2: #4a5257;
    --ink-3: #697276;
    --line: #e3e7e9;
    --fill: #f5f7f8;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page); color: var(--ink);
    transition: background 320ms ease, color 200ms ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: var(--fs); line-height: 1.5;
  }
  /* Presentation mode is one number. Everything sizes off --fs, so doubling --s
     doubles the whole deck rather than restyling it screen by screen. */
  :root.presenting { --s: 2; --maxw: 1760px; }
  :root.presenting .shell { padding: 12px 16px 20px; }
  :root.presenting .stage { padding: 20px 26px 18px; }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.55); }
  :root.presenting .lede { margin-bottom: calc(var(--fs) * 0.7); }
  :root.presenting .rule { margin: 10px 0 16px; }
  :root.presenting .takeaway { margin-top: calc(var(--fs) * 0.7); }
  /* Headline big, detail a step down. On a projector the headline is what carries the
     room and the detail is what the phone is for. */
  /* The projector shows headlines. The phone shows the detail.

     This is not a compromise, it is the measurement: five headlines each followed by
     two lines of detail needs 1458px of a 993px screen at readable type, so something
     has to go, and it should be the thing nobody reads off a wall in a bar. Headlines
     plus the takeaway is a slide. Headlines plus 400 characters of detail is a document
     being projected at people. Press D to reveal the detail on any screen. */
  :root.presenting ol.points .d { display: none; }
  :root.presenting.details ol.points .d { display: block; font-size: calc(var(--fs) * .72); }
  :root.presenting ol.points .t { font-size: calc(var(--fs) * 1.05); }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.42); }
  :root.presenting .follow { margin-top: 8px; padding-top: 8px; }
  :root.presenting .follow .t { font-size: calc(var(--fs) * .55); }
  /* Big enough to scan from the back of the room, which is the only size that counts.
     A QR only the front two rows can reach is decoration. */
  :root.presenting .followqr { width: calc(var(--fs) * 4.6); }
  :root.presenting .follow .t { font-size: calc(var(--fs) * .62); }
  .shell { max-width: var(--maxw); margin: 0 auto; padding: 28px 24px 64px; }
  .stage { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 34px 38px 30px;
           box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 14px 44px rgba(0,0,0,.12); }

  .rail { display: flex; gap: 4px; margin-bottom: 22px; }
  .rail span { flex: 1; height: 3px; background: var(--line); cursor: pointer; }
  .rail span.done { background: var(--ink-3); }
  .rail span.now { background: var(--brand); }

  .topline { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .wordmark { color: var(--brand); font-weight: 800; letter-spacing: .18em; font-size: calc(var(--fs) * .8); }
  .divider-v { width: 1px; height: 12px; background: var(--line); }
  .kicker { font-size: calc(var(--fs) * .8); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
  .count { margin-left: auto; font-size: calc(var(--fs) * .8); color: var(--ink-3); font-variant-numeric: tabular-nums; }

  h1 { font-size: calc(var(--fs) * 1.6); line-height: 1.25; margin: 4px 0 0; font-weight: 650; }
  .rule { width: 48px; height: 2px; background: var(--brand); margin: 12px 0 24px; }
  p { margin: 0 0 12px; }
  .lede { font-size: calc(var(--fs) * 1.07); margin-bottom: 20px; }

  ol.points { list-style: none; margin: 0; padding: 0; }
  ol.points li { display: flex; gap: 14px; margin-bottom: 15px; }
  ol.points .n { color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; min-width: calc(var(--fs) * 1.35); }
  ol.points .t { font-weight: 600; }
  ol.points .d { color: var(--ink-2); }

  .pill { display: inline-block; font-size: calc(var(--fs) * .7); letter-spacing: .07em; font-weight: 700;
          color: var(--brand); border: 1px solid var(--brand); border-radius: 3px;
          padding: 1px 6px; vertical-align: 2px; margin-left: 4px; }
  .pill.warn { color: var(--warn); border-color: var(--warn); }

  .flag { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
          color: var(--ink-2); padding: 11px 14px; border-radius: 4px; margin-bottom: 18px; font-size: calc(var(--fs) * .93); }
  .flag b { color: var(--warn); }

  .callout { border: 1px solid var(--line); border-left: 3px solid var(--brand); background: var(--fill);
             padding: 12px 14px; border-radius: 4px; margin-top: 20px; }
  .callout .h { font-weight: 650; margin-bottom: 4px; }
  .callout .b { color: var(--ink-2); }
  .qr { display: block; width: 132px; height: 132px; margin: 12px 0 2px; image-rendering: pixelated; }

  .takeaway { border-left: 3px solid var(--brand); background: var(--fill); padding: 10px 14px; margin-top: 24px; }
  .takeaway .h { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-bottom: 3px; }
  .takeaway .b { font-weight: 600; }

  .nav { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  button { font: inherit; font-size: calc(var(--fs) * .87); padding: 6px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--fill); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  .nav .right { margin-left: auto; font-size: calc(var(--fs) * .8); color: var(--ink-3); }

  .voices { display: flex; align-items: center; gap: 6px; margin-top: 14px;
            padding-top: 14px; border-top: 1px solid var(--line); }
  .voices .lab { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-right: 4px; }
  .voices button { font-size: calc(var(--fs) * .8); padding: 4px 10px; }
  .voices button.on { background: var(--brand); color: var(--bg); border-color: var(--brand); }
  /* Demo builds carry this on every screen, not just the first. A page of invented
     people and invented numbers sitting at a public URL has to say so wherever the
     reader happens to land, including on a deep link straight into station four. */
  /* Selecting a narrator on a screen that never changes voice used to do nothing at
     all, with the only explanation in small grey type at the far edge of the voice
     bar. The deck opens on one of those screens, so the first thing anyone tried
     looked broken. Say it where they are looking. */
  .voicenote { border-left: 3px solid var(--brand); background: var(--fill);
               padding: 9px 13px; border-radius: 4px; margin-bottom: 18px;
               font-size: calc(var(--fs) * .85); color: var(--ink-2); }
  .voicenote b { color: var(--ink); }

  .demobar { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
             color: var(--ink-2); padding: 9px 13px; border-radius: 4px;
             margin-bottom: 16px; font-size: calc(var(--fs) * .8); }
  .demobar b { color: var(--warn); }

  .follow { display: flex; align-items: center; gap: 12px; margin-top: 12px;
            padding-top: 12px; border-top: 1px solid var(--line); }
  .followqr { width: 62px; aspect-ratio: 1 / 1; flex: none; display: block;
              background: #fff; padding: 4px; border-radius: 3px; }
  .follow .t { font-size: calc(var(--fs) * .8); color: var(--ink-3); line-height: 1.45; }
  .follow .t b { color: var(--ink-2); }
  .follow .u { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: calc(var(--fs) * .72); color: var(--ink-3); word-break: break-all; }

  .voices .hint { margin-left: auto; font-size: calc(var(--fs) * .77); color: var(--ink-3); }

  #printAll { display: none; }
  @media print {
    body { background: #fff; --page: #fff; }
    .rail, .nav, .stage { display: none !important; }
    .shell { max-width: none; padding: 0; }
    #printAll { display: block; }
    #printAll .page { page-break-after: always; padding: 0 0 24px; }
    #printAll .page:last-child { page-break-after: auto; }
  }
</style>
</head>

<div class="shell">
  <div class="stage">
    <div class="rail" id="rail"></div>

      <span class="wordmark">ATP</span>

      <div class="h">THE LINE FOR THE ROOM</div>

    <div class="nav">
      <button id="prev">Previous</button>

  <div id="printAll"></div>
</div>
<script>
// VOICES is [[key, label], ...] in display order.
// UNVOICED lists the screen ids that never change voice: they are ours, not the model's.
const DECKS = {
 "straight": [
  {
   "id": "method",
   "kicker": "How this was made",
   "title": "Five rooms, one picture, ten minutes",
   "takeaway": "The AI did the reading. Everything that had one correct answer was done by code.",
   "body": "<p class=\"lede\">Five stations ran in parallel. Nobody was in more than one of them. This deck existed before the last one finished talking.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Every station was recorded to its own meeting, hosted by one person</span><br><span class=\"d\">Not by the leader running the room. One account owned all five, so no session depended on a presenter remembering to press a button correctly.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Ending the meeting is what starts the transcript</span><br><span class=\"d\">Teams generates a transcript 2.5 to 5 minutes after a meeting is ended, not left. Five staggered endings, then one to three minutes for the model to read every word said in this building and answer. That is the budget you just watched us spend, and every number in it was measured in rehearsal.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model was given the transcripts and a written brief, and asked for data</span><br><span class=\"d\">Not for a deck. It returns structured content, which is checked against a schema before anything is rendered. Wrong shape, wrong station name, too many bullets: rejected, and the previous deck stands.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The slides you are looking at were generated by code, not by the model</span><br><span class=\"d\">Order, branding, navigation, this screen, the QR code: all deterministic. The model only wrote the parts that needed judgment about what was said.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Two models ran at once, and it was not a race</span><br><span class=\"d\">A fast standby answered the same question in parallel. The good model got the whole deadline to itself and the standby was only used if it missed. Measured on the night's transcripts: 81 seconds against 167. A race would have handed you the weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy is a <b>demo</b>, built from invented transcripts so the format can be clicked through before the event. The timings and the machinery are real; the people, companies and numbers are not. Written by sonnet, from mock transcripts. Generated 2026-09-10 11:21.</div></div>"
  },
  {
   "id": "reliability",
   "kicker": "The transferable part",
   "title": "Why this worked when your AI program did not",
   "takeaway": "Give the model the judgment call. Never give it anything you could check by machine instead.",
   "body": "<p class=\"lede\">Nothing here needed a better model. It needed the unglamorous things around the model to be decided in advance, and every one of them is a thing your program can do on Monday.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Deterministic wherever determinism is available</span><br><span class=\"d\">The model wrote the words. Code decided the running order, the branding, which stations are flagged, the navigation, the QR, and this sentence. A model that cannot choose the running order cannot get the running order wrong. Shrink what it is allowed to decide and you shrink what a human has to check at 7:50pm.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Never ask a model a question you can already answer</span><br><span class=\"d\">Which stations produced a real recording is a fact sitting on a disk. The deck reads it from there and throws away whatever the model says about it. That closed a real hole: a model that relabelled a failed station as a real one silently deleted the warning built to catch exactly that.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Constrain the output until it can be validated</span><br><span class=\"d\">It returns JSON against a fixed schema, not slides. Unknown station, missing station, too many bullets: rejected, and the deck already on disk stands untouched. You cannot check free text. You can check a schema.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Write the evals before the night, and test the disasters</span><br><span class=\"d\">137 automated checks across 24 rehearsals of this evening, including no transcript at all, prose instead of JSON, a crashed CLI, a transcript arriving late, and a narrator quietly dropping the numbers. The happy path is the least useful thing you can test.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Score the things you would otherwise argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"
  },
  {
   "id": "sky-city",
   "kicker": "Sky City",
   "title": "Infrastructure and integration with third-party tools",
   "takeaway": "Whatever you sign next time, model version pinning, dedicated rate limits, and free documented data export are non negotiable, not upgrades reserved for the enterprise tier.",
   "body": "<p class=\"lede\">This room spent its time on the gap between what vendors demo and what production actually demands, then on who eats the cost when that gap breaks something at 2am. <span class=\"pill warn\">MOCK TRANSCRIPT</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Demos ran on eight invoices, production runs on four hundred thousand a month</span><br><span class=\"d\">Kevin Osei's document extraction vendor demoed against eight sample invoices. Their actual volume is roughly four hundred thousand documents a month, about a third of them scanned faxes, a format the demo never touched. Angela Ruiz had the same shape of problem from the other direction: her vendor's demo was single tenant, and turning on row level permissions for their multi tenant setup pushed latency from about two hundred milliseconds to nearly four seconds.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The contract said sixty requests a second, the pool was shared with everyone</span><br><span class=\"d\">Kevin's contract promised sixty requests a second. What it didn't say was that number is a shared pool across every customer in the region, so on a Monday morning they were actually getting about eleven. Marcus Dell's team hit a different wall in auth: vendor tokens expired hourly with no refresh flow, so they built a cron job that logs in as a service account and scrapes a bearer token. It's in production now, the kind of older code that still checks out, though Marcus said he isn't proud of it.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A model update on a Thursday dropped accuracy from ninety four percent to seventy one</span><br><span class=\"d\">Angela's vendor pushed a new model version with no notice, and extraction accuracy on one document type fell from about ninety four percent to seventy one. They found out when a customer called, not from the vendor. Version pinning existed, just not at their price tier, it's an enterprise feature at four times the cost. Marcus had the mirror image problem: pinned to an old version, then given thirty days notice it was being deprecated anyway.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Half the room built an abstraction layer, half didn't, and it shows</span><br><span class=\"d\">Angela's team spent five months building a vendor abstraction layer and swapped providers in three weeks last quarter when they needed to. Marcus's team skipped it and is now locked into a proprietary export format, quoted forty thousand dollars to get their own documents back out. Kevin's team is nine months from signing to production, Angela's took fourteen, against a sales promise of six weeks. Marcus is twenty two months in and still not live, and is quietly piloting a second vendor in parallel.</span></span></li></ol>"
  },
  {
   "id": "swamp-planet",
   "kicker": "Swamp Planet",
   "title": "Technical debt and data quality",
   "takeaway": "Profile the actual values in every column you plan to use, not the schema someone wrote down, and find out who owns each source before assuming the model will fix it.",
   "body": "<p class=\"lede\">This room found out that the data the AI project needed didn't look anything like the data anyone had described on paper. <span class=\"pill warn\">MOCK TRANSCRIPT</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">customer_status was supposed to have four values, it has thirty one</span><br><span class=\"d\">Tasha Green's team found their documented schema was fiction: a column called customer_status was supposed to hold four values and actually holds thirty one, including an empty string with a trailing space that accounts for about eight percent of all rows, and nobody can say what it means.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">One 2019 acquisition, two customer tables, merged twice</span><br><span class=\"d\">Ron Petrakis's team found two customer tables from a 2019 acquisition that were supposed to be merged into one. They were merged, both of them, twice. That left about a hundred and ninety thousand duplicate customers, and because the dedupe logic matched on email, anyone who changed jobs since is now two different people in the system.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Ninety percent of the AI project turned out to be a data project, budgeted at zero</span><br><span class=\"d\">Tasha put the split at ninety percent data work to ten percent model work, and the budget for that ninety percent was zero, because the original pitch deck had a slide calling their data an asset. Ron's team saw seventy percent, pulled out of the model's own budget, so the model got what was left. Dev Saraf's team traced every data problem back to a system whose one knowledgeable owner left in 2021, leaving behind a stale wiki page and a four person Slack channel.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">A temporary filter dropping four percent of rows is now load bearing</span><br><span class=\"d\">Ron's pipeline has quietly dropped any record where the state field isn't exactly two characters for eighteen months, about four percent of rows. It was meant to be temporary. It's now load bearing, because downstream reports have been tuned to the filtered volume ever since.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The garbage will do, until it quotes four hundred customers a same day delivery</span><br><span class=\"d\">Dev's system quoted a delivery date off a lead time field that had silently defaulted to zero for an entire product category, telling roughly four hundred customers their order would arrive the same day. The system worked exactly as designed. The data underneath it was garbage, and the output looked completely normal for six weeks before anyone noticed, quieter and more expensive than any outage would have been.</span></span></li></ol>"
  },
  {
   "id": "ice-planet",
   "kicker": "Ice Planet",
   "title": "Development-stage use cases stuck in limbo",
   "takeaway": "There's no try left in this backlog, someone needs a name, a budget line, and a signature accepting the risk, or the pilot stays a pilot forever.",
   "body": "<p class=\"lede\">This room did the arithmetic nobody else wanted to do: how many AI projects get started against how many ever reach a patient, a nurse, or a customer. <span class=\"pill warn\">MOCK TRANSCRIPT</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Nineteen started, two in production, one barely alive</span><br><span class=\"d\">Sam Forrester's organization has started nineteen AI use cases and has two in production, one of which is an internal help desk chatbot he described as barely alive. Nadia Kohl's team has eleven in flight and zero in production after two years, and nobody has cancelled a single one of them.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model works, nobody scoped who runs it or ships it</span><br><span class=\"d\">Sam said the most common stall is that nobody owns the thing once data science hands it over: the platform team's roadmap is already full, and there's no budget line to operate it, so it sits in a repo. Tim Olutayo's team hits the same wall at the last mile, the model itself is fine, but getting it in front of a nurse inside the software she already uses requires an integration nobody scoped and a vendor who doesn't want to build it.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A pilot that's been ninety percent done for fourteen months</span><br><span class=\"d\">Nadia said the honest answer to who decides a pilot is finished is nobody, because closing one means writing down that it didn't work, and the person who sponsored it is now a VP. Sam has a project that has reported ninety percent done on every status update for fourteen straight months.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Eleven thousand a month in idle spend isn't the real cost</span><br><span class=\"d\">Tim's team added up cloud spend on idle endpoints for stalled projects last quarter at Finance's request: about eleven thousand dollars a month. He said the real cost is that they can't get approval for anything new, because the last six projects are still technically open. Nadia called it exactly right: the graveyard is what's blocking the next thing.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Do or do not: the blocker was never really technical</span><br><span class=\"d\">Sam put the blocker as organizational about ninety percent of the time. Tim called his political: the model works, but nobody wants to be the person who signs off on letting it touch a patient record. Both agreed on what would actually unstick their backlog: a named production owner with budget, and one executive willing to accept the risk in writing.</span></span></li></ol>"
  },
  {
   "id": "snow-monster-cave",
   "kicker": "Snow Monster Cave",
   "title": "Unexpected costs and security vulnerabilities",
   "takeaway": "Logging and egress visibility have to come before any new capability, because you can't govern what you can't see, and this room bought capability first for two years.",

   "body": "<p class=\"lede\">This is an AI program too, so it had a bad feeling about itself. Six defects, all of them from rehearsal, none of them from review.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A bug that would have failed live, in this room, tonight</span><br><span class=\"d\">The prompt was passed as a shell argument. Linux caps a single argument at 128KB and five real transcripts come to 285KB, so it worked in every small test and would have died the moment it saw the real thing, with everyone sitting here.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model could quietly promote a failed station to a real one</span><br><span class=\"d\">Which deleted the on-screen warning that exists to prevent precisely that. Not fixed with a better prompt. Fixed by never asking.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A 26-character overrun threw away an entire run</span><br><span class=\"d\">Validation could not tell the difference between output that was wrong and output that was merely too long. Now it can: one rejects, the other gets trimmed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Two models running in parallel were running in sequence</span><br><span class=\"d\">And producing perfect output the whole time. Caught only because a test asserted on elapsed time rather than on the result.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The QR codes rendered as perfectly sized blank squares</span><br><span class=\"d\">Right dimensions, right position, nothing inside. No assertion about the markup would have caught it, so the test now scans the code back with a barcode reader.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">A narrator that changed 9% of the words and passed every check</span><br><span class=\"d\">Correcting one failure produced its exact opposite. The first Yoda inverted    "body": "<p class=\"lede\">Five stations ran in parallel. Nobody was in more than one of them. This deck existed before the last one finished talking.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Every station was recorded to its own meeting, hosted by one person</span><br><span class=\"d\">Not by the leader running the room. One account owned all five, so no session depended on a presenter remembering to press a button correctly.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Ending the meeting is what starts the transcript</span><br><span class=\"d\">Teams generates a transcript 2.5 to 5 minutes after a meeting is ended, not left. Five staggered endings, then one to three minutes for the model to read every word said in this building and answer. That is the budget you just watched us spend, and every number in it was measured in rehearsal.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model was given the transcripts and a written brief, and asked for data</span><br><span class=\"d\">Not for a deck. It returns structured content, which is checked against a schema before anything is rendered. Wrong shape, wrong station name, too many bullets: rejected, and the previous deck stands.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The slides you are looking at were generated by code, not by the model</span><br><span class=\"d\">Order, branding, navigation, this screen, the QR code: all deterministic. The model only wrote the parts that needed judgment about what was said.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Two models ran at once, and it was not a race</span><br><span class=\"d\">A fast standby answered the same question in parallel. The good model got the whole deadline to itself and the standby was only used if it missed. Measured on the night's transcripts: 81 seconds against 167. A race would have handed you the weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy is a <b>demo</b>, built from invented transcripts so the format can be clicked through before the event. The timings and the machinery are real; the people, companies and numbers are not. Written by sonnet, from mock transcripts. Generated 2026-09-10 11:21.</div></div>"

   "body": "<p class=\"lede\">Nothing here needed a better model. It needed the unglamorous things around the model to be decided in advance, and every one of them is a thing your program can do on Monday.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Deterministic wherever determinism is available</span><br><span class=\"d\">The model wrote the words. Code decided the running order, the branding, which stations are flagged, the navigation, the QR, and this sentence. A model that cannot choose the running order cannot get the running order wrong. Shrink what it is allowed to decide and you shrink what a human has to check at 7:50pm.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Never ask a model a question you can already answer</span><br><span class=\"d\">Which stations produced a real recording is a fact sitting on a disk. The deck reads it from there and throws away whatever the model says about it. That closed a real hole: a model that relabelled a failed station as a real one silently deleted the warning built to catch exactly that.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Constrain the output until it can be validated</span><br><span class=\"d\">It returns JSON against a fixed schema, not slides. Unknown station, missing station, too many bullets: rejected, and the deck already on disk stands untouched. You cannot check free text. You can check a schema.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Write the evals before the night, and test the disasters</span><br><span class=\"d\">137 automated checks across 24 rehearsals of this evening, including no transcript at all, prose instead of JSON, a crashed CLI, a transcript arriving late, and a narrator quietly dropping the numbers. The happy path is the least useful thing you can test.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Score the things you would otherwise argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"

an><br><span class=\"d\">Ron's pipeline has quietly dropped any record where the state field isn't exactly two characters for eighteen months, about four percent of rows. Temporary, it was meant to be. It's now load bearing, because downstream reports have been tuned to the filtered volume ever since.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Do, the garbage will. Until four hundred customers, a same day delivery it quotes</span><br><span class=\"d\">Dev's system quoted a delivery date off a lead time field that had silently defaulted to zero for an entire product category, telling roughly four hundred customers their order would arrive the same day. Exactly as designed, the system worked. The data underneath it was garbage, and the output looked completely normal for six weeks before anyone noticed, quieter and more expensive than any outage would have been.</span></span></li></ol>"

   "body": "<p class=\"lede\">This is an AI program too, so it had a bad feeling about itself. Six defects, all of them from rehearsal, none of them from review.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A bug that would have failed live, in this room, tonight</span><br><span class=\"d\">The prompt was passed as a shell argument. Linux caps a single argument at 128KB and five real transcripts come to 285KB, so it worked in every small test and would have died the moment it saw the real thing, with everyone sitting here.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model could quietly promote a failed station to a real one</span><br><span class=\"d\">Which deleted the on-screen warning that exists to prevent precisely that. Not fixed with a better prompt. Fixed by never asking.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A 26-character overrun threw away an entire run</span><br><span class=\"d\">Validation could not tell the difference between output that was wrong and output that was merely too long. Now it can: one rejects, the other gets trimmed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Two models running in parallel were running in sequence</span><br><span class=\"d\">And producing perfect output the whole time. Caught only because a test asserted on elapsed time rather than on the result.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The QR codes rendered as perfectly sized blank squares</span><br><span class=\"d\">Right dimensions, right position, nothing inside. No assertion about the markup would have caught it, so the test now scans the code back with a barcode reader.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">A narrator that changed 9% of the words and passed every check</span><br><span class=\"d\">Correcting one failure produced its exact opposite. The first Yoda inverted e weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy is a <b>demo</b>, built from invented transcripts so the format can be clicked through before the event. The timings and the machinery are real; the people, companies and numbers are not. Written by sonnet, from mock transcripts. Generated 2026-09-10 11:21.</div></div>"

argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"

ion, then given thirty days notice it was being deprecated anyway.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Half of you built an abstraction layer. Half did not. It shows.</span><br><span class=\"d\">You spent five months building a vendor abstraction layer, and swapped providers in three weeks when you needed to. You skipped it, and now you are locked into a proprietary export format, quoted forty thousand dollars to get your own documents back. You went from signing to production in nine months. Fourteen months, against a sales promise of six weeks. Twenty two months in, and still not live, quietly piloting a second vendor in parallel.</span></span></li></ol>"

r percent of rows. You called it temporary. It is load bearing now, because your downstream reports have been tuned to the filtered volume ever since.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The garbage held, until it promised four hundred customers a delivery that was never coming.</span><br><span class=\"d\">Your system quoted a delivery date off a lead time field that had silently defaulted to zero for an entire product category, telling roughly four hundred customers their order would arrive the same day. The system worked exactly as designed. The data underneath it was garbage, and the output looked normal for six weeks before anyone noticed. Quieter than an outage. More expensive than one too.</span></span></li></ol>"

   "body": "<p class=\"lede\">This is an AI program too, so it had a bad feeling about itself. Six defects, all of them from rehearsal, none of them from review.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A bug that would have failed live, in this room, tonight</span><br><span class=\"d\">The prompt was passed as a shell argument. Linux caps a single argument at 128KB and five real transcripts come to 285KB, so it worked in every small test and would have died the moment it saw the real thing, with everyone sitting here.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model could quietly promote a failed station to a real one</span><br><span class=\"d\">Which deleted the on-screen warning that exists to prevent precisely that. Not fixed with a better prompt. Fixed by never asking.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A 26-character overrun threw away an entire run</span><br><span class=\"d\">Validation could not tell the difference between output that was wrong and output that was merely too long. Now it can: one rejects, the other gets trimmed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Two models running in parallel were running in sequence</span><br><span class=\"d\">And producing perfect output the whole time. Caught only because a test asserted on elapsed time rather than on the result.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The QR codes rendered as perfectly sized blank squares</span><br><span class=\"d\">Right dimensions, right position, nothing inside. No assertion about the markup would have caught it, so the test now scans the code back with a barcode reader.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">A narrator that changed 9% of the words and passed every check</span><br><span class=\"d\">Correcting one failure produced its exact opposite. The first Yoda inverted    "body": "<p class=\"lede\">Five stations ran in parallel. Nobody was in more than one of them. This deck existed before the last one finished talking.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Every station was recorded to its own meeting, hosted by one person</span><br><span class=\"d\">Not by the leader running the room. One account owned all five, so no session depended on a presenter remembering to press a button correctly.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Ending the meeting is what starts the transcript</span><br><span class=\"d\">Teams generates a transcript 2.5 to 5 minutes after a meeting is ended, not left. Five staggered endings, then one to three minutes for the model to read every word said in this building and answer. That is the budget you just watched us spend, and every number in it was measured in rehearsal.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model was given the transcripts and a written brief, and asked for data</span><br><span class=\"d\">Not for a deck. It returns structured content, which is checked against a schema before anything is rendered. Wrong shape, wrong station name, too many bullets: rejected, and the previous deck stands.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The slides you are looking at were generated by code, not by the model</span><br><span class=\"d\">Order, branding, navigation, this screen, the QR code: all deterministic. The model only wrote the parts that needed judgment about what was said.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Two models ran at once, and it was not a race</span><br><span class=\"d\">A fast standby answered the same question in parallel. The good model got the whole deadline to itself and the standby was only used if it missed. Measured on the night's transcripts: 81 seconds against 167. A race would have handed you the weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy is a <b>demo</b>, built from invented transcripts so the format can be clicked through before the event. The timings and the machinery are real; the people, companies and numbers are not. Written by sonnet, from mock transcripts. Generated 2026-09-10 11:21.</div></div>"

   "body": "<p class=\"lede\">Nothing here needed a better model. It needed the unglamorous things around the model to be decided in advance, and every one of them is a thing your program can do on Monday.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Deterministic wherever determinism is available</span><br><span class=\"d\">The model wrote the words. Code decided the running order, the branding, which stations are flagged, the navigation, the QR, and this sentence. A model that cannot choose the running order cannot get the running order wrong. Shrink what it is allowed to decide and you shrink what a human has to check at 7:50pm.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Never ask a model a question you can already answer</span><br><span class=\"d\">Which stations produced a real recording is a fact sitting on a disk. The deck reads it from there and throws away whatever the model says about it. That closed a real hole: a model that relabelled a failed station as a real one silently deleted the warning built to catch exactly that.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Constrain the output until it can be validated</span><br><span class=\"d\">It returns JSON against a fixed schema, not slides. Unknown station, missing station, too many bullets: rejected, and the deck already on disk stands untouched. You cannot check free text. You can check a schema.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Write the evals before the night, and test the disasters</span><br><span class=\"d\">137 automated checks across 24 rehearsals of this evening, including no transcript at all, prose instead of JSON, a crashed CLI, a transcript arriving late, and a narrator quietly dropping the numbers. The happy path is the least useful thing you can test.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Score the things you would otherwise argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"

  const note = el("voicenote");
  if (unvoiced && voice !== "straight") {
    note.hidden = false;
    note.innerHTML = "<b>" + label + " is not narrating this screen.</b> The screens about " +
      "how this was built are ours, not the model's, so they stay in one voice. " +
      "Move to any station screen and " + label + " takes over.";
  } else {
    note.hidden = true;
  }
  // Dim the buttons here too, so the control looks as inert as it is.
  document.querySelectorAll("#voiceButtons button").forEach(b => {
    b.style.opacity = unvoiced && b.dataset.voice !== "straight" ? "0.45" : "";
  });
  window.scrollTo(0, 0);
}
el("prev").onclick = () => { i = Math.max(0, i - 1); render(); };
el("next").onclick = () => { i = Math.min(screens().length - 1, i + 1); render(); };

if (VOICES.length > 1) {
  el("voices").hidden = false;
  el("voiceButtons").innerHTML = VOICES.map(([k, label]) =>
    '<button data-voice="' + k + '">' + label + '</button>').join(" ");
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.onclick = () => setVoice(b.dataset.voice));
}

document.onkeydown = ev => {
  if (ev.key.toLowerCase() === "p") { presenting = !presenting; scale = 0; applyMode(); return; }
  if (ev.key.toLowerCase() === "d") {
    document.documentElement.classList.toggle("details");
    scale = 0; applyMode(); return;
  }
  if (ev.key === "+" || ev.key === "=") { nudge(0.1); return; }
  if (ev.key === "-" || ev.key === "_") { nudge(-0.1); return; }
  if (ev.key === "ArrowRight" || ev.key === " " || ev.key === "PageDown") el("next").click();
  if (ev.key === "ArrowLeft" || ev.key === "PageUp") el("prev").click();
  if (ev.key === "Home") { i = 0; render(); }
  if (ev.key === "End") { i = screens().length - 1; render(); }
  // Voice switching is meant to happen live, mid-sentence, without losing your place.
  if (VOICES.length > 1) {
    if (ev.key.toLowerCase() === "v") {
      const n = VOICES.findIndex(v => v[0] === voice);
      setVoice(VOICES[(n + 1) % VOICES.length][0]);
    }
    const d = parseInt(ev.key, 10);
    if (d >= 1 && d <= VOICES.length) setVoice(VOICES[d - 1][0]);
  }
};
function buildPrint() {
  const SCREENS = screens();
  el("printAll").innerHTML = SCREENS.map((s, n) =>
    '<div class="page" style="' + themeVars(s.id) + '">' +
    '<div class="topline"><span class="wordmark">ATP</span>' +
    '<span class="divider-v"></span><span class="kicker">' + s.kicker.toUpperCase() + '</span>' +
    '<span class="count">' + (n + 1) + ' / ' + SCREENS.length + '</span></div>' +
    '<h1>' + s.title + '</h1><div class="rule"></div>' + s.body +
    '<div class="takeaway"><div class="h">THE LINE FOR THE ROOM</div><div class="b">' +
    s.takeaway + '</div></div></div>').join("");
}
window.onbeforeprint = buildPrint;
if (location.hash === "#print") buildPrint();

// Deep link: land on the screen the QR pointed at.
function fromHash() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const n = screens().findIndex(s => s.id === id);
  if (n >= 0) i = n;
}
fromHash();
window.addEventListener("hashchange", () => { fromHash(); render(); });
window.addEventListener("resize", autofit);

applyMode();
render();
</script>
</body>
</html>
