   "takeaway": "An AI project inherits every argument about the data you refused to settle, and you pay for it in the delivery schedule. You knew the argument was there. You built anyway.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station tested whether you could see your own data well enough to trust anything built on top of it. You could not. You built anyway. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Your documentation describes a company that stopped existing years ago</span><br><span class=\"d\">A status field was documented with fourteen values. Production had over sixty, built up from years of free text nobody cleaned. Four parts of your business each maintained their own definition of something as basic as an active customer, and that argument predates the AI project by years. You never resolved it. You just built on top of it.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Almost none of you can trace where your own data goes</span><br><span class=\"d\">Only a small fraction of the room could trace their data end to end. Not knowing is not an accident. It keeps you afraid to touch the pipeline, and it lets the vendor tell you anything about data they've never seen, because you have no way to check.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">You budgeted for a model. You paid for cleanup.</span><br><span class=\"d\">Between forty and one hundred percent of the effort went to fixing data before any model work started, and none of it was budgeted. A vendor certified the data as ready. The board was told the same thing. Both were wrong, and you found out after.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Nobody owns your worst data. Somebody just answers the phone about it.</span><br><span class=\"d\">The company's worst data was acquired years ago. The only person who understands it is a contractor who left, now paid a few hours a month to explain what you should already know. Eleven years of unowned free text notes, and every AI use case in the building wants to use it anyway. You never assigned an owner. You just kept building demand.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Nothing pages you when the answer is just wrong</span><br><span class=\"d\">A hand-maintained mapping table sits in front of a revenue process. It produces a confidently wrong contract date for a customer, and nothing alerts on it. An outage pages somebody immediately. A quiet, wrong answer pages no one, and you built a system that fails exactly that way.</span></span></li></ol>"

   "takeaway": "The number worth tracking was never how many AI projects you started. It's how many you were ever willing to actually decide to kill or ship, and you know that number is small.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station is the arithmetic of your AI initiatives: how many you started against how many ever reached production, and what it costs you to leave the rest running in place. You already know the ratio is bad. You kept starting more. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Most of what you started is still not live</span><br><span class=\"d\">You started dozens of AI initiatives for every handful that shipped. That gap is the headline. It is not a rounding error, it is the record of what you approved and abandoned.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">You don't kill projects. You let them go quiet.</span><br><span class=\"d\">Nobody ever decides a project is dead. A pilot ends, the team moves on, and the handoff to whoever would actually run it becomes a no that nobody has to own. You call that a wind-down. It is a decision you refused to make out loud.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Idle still bills you</span><br><span class=\"d\">Unused dev and test environments kept billing every month. A year-long vendor contract near a quarter million dollars served a single-digit pilot group. Staff stayed at partial allocation to a project going nowhere. None of it showed up as a line item you ever reviewed, because you never looked.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The scope grew. The budget didn't. You didn't notice either.</span><br><span class=\"d\">A project approved for one team picked up a second region, a compliance and audit log requirement, and an executive's mobile request. None of it was scoped at approval. None of it was reflected in a budget that doesn't reopen once a project clears its gate. You approved a number and then ignored what it stopped meaning.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The ones that survived all looked the same. You ignored the pattern anyway.</span><br><span class=\"d\">One team, one owner, one metric agreed before the work started, and the human never removed from the loop. The failures tried to automate the person out from the start. You had the pattern in front of you and kept funding the other shape.</span></span></li></ol>"
  },
  {
   "id": "snow-monster-cave",
   "kicker": "Snow Monster Cave",
   "title": "Development",
   "takeaway": "Most of the risk was never the model. It was the test plan you didn't write, the on call you didn't assign, and the shipped answers you can't take back.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station is what actually happens inside your build of an AI feature: what you called testing, who you left on call, and where the prompt really lives. You already know none of the three answers are the ones you'd say out loud. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">You called it tested. It was a vibe check.</span><br><span class=\"d\">A handful of happy-path examples in a spreadsheet. An engineer skimming outputs for an afternoon. A demo for the sponsor. The launch date was on the calendar before there was ever a test plan to satisfy it. You shipped on a feeling.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">It passed every test. It broke anyway.</span><br><span class=\"d\">A shortened prompt passed over a hundred test cases while silently dropping a required disclaimer in production. Somebody caught it reading tickets over a week later. A retrieval rebuild passed only because its evals were still checking against pre-rebuild data. You trusted a green checkmark that was testing the wrong thing.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">There is no on call. There is a phone number.</span><br><span class=\"d\">A small handful of teams had a real on-call rotation. Everyone else's real answer was the mobile number of whoever built it, sitting in a runbook. That person never agreed to carry it. You just assumed they would.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Nobody can tell you how much of this is actually yours</span><br><span class=\"d\">Estimates of genuinely owned code versus a wrapper around someone else's API ranged from single digits to a majority. Leadership rarely sees that number stated plainly, because nobody wants to be the one who says it.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">A rollback doesn't undo what you already sent</span><br><span class=\"d\">Reverting a prompt or model doesn't restore an index that's already been regenerated. A rollback fixes the next answer. It does not fix the answer already sitting in someone's inbox, or the decision someone already made from it. You rolled back and called it fixed.</span></span></li></ol>"
  },
  {
   "id": "asteroid-field",
   "kicker": "Asteroid Field",
   "title": "Compliance, legal, and security",
   "takeaway": "The technology was never what killed your AI use case in this room. An unanswered ownership or consent question arriving late did, and you had a year to answer it first.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station is the compliance, legal, and security questions your AI system raises that you still can't answer, and who was supposed to sign off that it was safe. You know who. Nobody. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">You can't answer the basic questions</span><br><span class=\"d\">What data was the model trained on. Does a deletion request actually remove anything from the model. Is a given output a decision or a recommendation. These looked simple until someone asked, and mostly they went unanswered when they did.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Nobody is who signs off. Every time.</span><br><span class=\"d\">Who signs off that an AI decision or vendor is safe to put in front of a customer got no assigned role, most of the time. That vacuum stalls more of your work than any technical limitation ever did, and you let it sit unassigned anyway.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Your review was built for software that ships in versions. This doesn't.</span><br><span class=\"d\">A standard vendor security questionnaire stalled for months against a service whose behavior changes without a release. A vendor's contract permits a new subprocessor with notice that means a page on their own website. You kept using a checklist that stopped applying and never noticed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Your people are already doing it</span><br><span class=\"d\">Proxy logs turned up dozens of AI tools in use against only a few approved. A board deck, a contract, patient information, already pasted into consumer AI tools by people trying to get their work done faster. You built the policy after the data was already gone.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">You closed one gap and opened another</span><br><span class=\"d\">Audit logging was added after the fact to answer what the system did. The result is an indefinite record of every prompt and output, and that record is its own discoverable liability. You never scoped either problem against the other before you built the fix.</span></span></li></ol>"
  },

   "takeaway": "None of these five rooms disagreed about where your AI projects actually got stuck. It was never the model. It was the owner you never assigned, the number you never checked, and the change you were never watching for. You were warned about all three, and you proceeded anyway.",
   "body": "<p class=\"lede\">Nobody has said any of this yet. These are the patterns we expect to connect the five stations, written in advance. The real ones get written on the night, from what the rooms actually say.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Nobody decided. That was always the answer.</span><br><span class=\"d\">Across ice planet, swamp planet, and asteroid field, the same gap kept showing up. No one was ever assigned to decide a project was finished, to own the worst data, or to sign off that an AI decision was safe to ship. Snow monster cave added that no formal on call exists for most AI features either. The absence of an owner dragged this out longer than any technical limit did, and you built every one of these rooms without assigning one.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The number on the page was never the number in production</span><br><span class=\"d\">Sky city's four-to-six-week pitch became nineteen months. Ice planet's dozens of started projects became a handful shipped. Swamp planet's fourteen documented values became sixty. Asteroid field's security questionnaire, built for versioned software, ran straight into a service that never ships a version. You wrote down the number you wanted and believed it.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Things changed quietly. You found out after it broke.</span><br><span class=\"d\">Sky city's vendor rolled a model forward and moved processing regions without notice. Swamp planet's column rename silently broke a six-year-old partner integration. Snow monster cave's prompt edit broke a second feature sharing that prompt. Asteroid field's subprocessor change arrived as a webpage notice. In none of these were you watching before the change landed. You were watching after.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">An outage pages you. A wrong answer doesn't.</span><br><span class=\"d\">Swamp planet and snow monster cave arrived at the same point from different directions. An outage pages somebody immediately. A confidently wrong answer, a stale contract date, an answer already sent before a rollback, trips no alert and sits outside any incident process you built for louder failures. You built alarms for the failure that announces itself and none for the one that doesn't.</span></span></li></ol><div class=\"callout\"><div class=\"h\">None of these five rooms disagreed about where your AI projects actually got stuck. It was never the model. It was the owner you never assigned, the number you never checked, and the change you were never watching for. You were warned about all three, and you proceeded anyway.</div><div class=\"b\">Everything behind this deck, including the station transcripts and the tool that built it, is at <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>. Take it and run this at your own company.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAG    "body": "<p class=\"lede\">This is an AI program too, so it had a bad feeling about itself. Six defects, all of them from rehearsal, none of them from review.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A bug that would have failed live, in this room, tonight</span><br><span class=\"d\">The prompt was passed as a shell argument. Linux caps a single argument at 128KB and five real transcripts come to 285KB, so it worked in every small test and would have died the moment it saw the real thing, with everyone sitting here.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model could quietly promote a failed station to a real one</span><br><span class=\"d\">Which deleted the on-screen warning that exists to prevent precisely that. Not fixed with a better prompt. Fixed by never asking.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A 26-character overrun threw away an entire run</span><br><span class=\"d\">Validation could not tell the difference between output that was wrong and output that was merely too long. Now it can: one rejects, the other gets trimmed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Two models running in parallel were running in sequence</span><br><span class=\"d\">And producing perfect output the whole time. Caught only because a test asserted on elapsed time rather than on the result.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The QR codes rendered as perfectly sized blank squares</span><br><span class=\"d\">Right dimensions, right position, nothing inside. No assertion about the markup would have caught it, so the test now scans the code back with a barcode reader.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">A narrator that changed 9% of the words and passed every check</span><br><span class=\"d\">Correcting one failure produced its exact opposite. The first Elder voice inverted nearly every sentence into something you had to read twice. The fix came back 91% identical to the plain text: it validated perfectly and was pointless on stage. Enforcer landed at 58% of fields rewritten and is now at 100%. Three worked examples per character fixed both, showing one real sentence too weak, right, and too far. The answer to fear is never the obviously wrong one. It is the one that looks exactly right.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Take the whole thing</div><div class=\"b\">The principles above, each with the code that implements it and the defect it caught, plus how to run this format yourself: read RUN-THIS-YOURSELF.md. The runbooks, the tool, the brief and every transcript are public too. Scan any screen, or go to <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHDmT4Bn2uYL2ua1mclrM5O/oW1em5m81jZfMDN5rW1ea5u/YWby    "title": "Five rooms, one picture, ten minutes",
   "takeaway": "The AI did the reading. Everything that had one correct answer was done by code.",
   "body": "<p class=\"lede\">Five stations ran in parallel. Nobody was in more than one of them. This deck existed before the last one finished talking.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Every station was recorded to its own meeting, hosted by one person</span><br><span class=\"d\">Not by the pilot running the room. One account owned all five, so no session depended on a presenter remembering to press a button correctly.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Ending the meeting is what starts the transcript</span><br><span class=\"d\">Teams generates a transcript 2.5 to 5 minutes after a meeting is ended, not left. Five staggered endings, then one to three minutes for the model to read every word said in this building and answer. That is the budget you just watched us spend, and every number in it was measured in rehearsal.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model was given the transcripts and a written brief, and asked for data</span><br><span class=\"d\">Not for a deck. It returns structured content, which is checked against a schema before anything is rendered. Wrong shape, wrong station name, too many bullets: rejected, and the previous deck stands.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The slides you are looking at were generated by code, not by the model</span><br><span class=\"d\">Order, branding, navigation, this screen, the QR code: all deterministic. The model only wrote the parts that needed judgment about what was said.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Two models ran at once, and it was not a race</span><br><span class=\"d\">A fast standby answered the same question in parallel. The good model got the whole deadline to itself and the standby was only used if it missed. Measured on the night's transcripts: 81 seconds against 167. A race would have handed you the weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy was built <b>before the stations ran</b>, from the question lists and the answers we expected to hear. It is the floor, not the deck: if every recording in the building had failed, this is what you would be looking at, and it would say so on every screen. Written by the primary model. Generated 2026-09-16 18:16.</div></div>"

   "id": "reliability",
   "kicker": "The transferable part",
   "title": "Why this worked when your AI program did not",
   "takeaway": "Give the model the judgment call. Never give it anything you could check by machine instead.",
   "body": "<p class=\"lede\">Nothing here needed a better model. It needed the unglamorous things around the model to be decided in advance, and every one of them is a thing your program can do on Monday.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Deterministic wherever determinism is available</span><br><span class=\"d\">The model wrote the words. Code decided the running order, the branding, which stations are flagged, the navigation, the QR, and this sentence. A model that cannot choose the running order cannot get the running order wrong. Shrink what it is allowed to decide and you shrink what a human has to check at 7:50pm.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Never ask a model a question you can already answer</span><br><span class=\"d\">Which stations produced a real recording is a fact sitting on a disk. The deck reads it from there and throws away whatever the model says about it. That closed a real hole: a model that relabelled a failed station as a real one silently deleted the warning built to catch exactly that.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Constrain the output until it can be validated</span><br><span class=\"d\">It returns JSON against a fixed schema, not slides. Unknown station, missing station, too many bullets: rejected, and the deck already on disk stands untouched. You cannot check free text. You can check a schema.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Write the evals before the night, and test the disasters</span><br><span class=\"d\">137 automated checks across 24 rehearsals of this evening, including no transcript at all, prose instead of JSON, a crashed CLI, a transcript arriving late, and a narrator quietly dropping the numbers. The happy path is the least useful thing you can test.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Score the things you would otherwise argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"
  },

   "takeaway": "The real cost of a third-party AI tool appears in the contract's fine print and in the vendor's next unannounced change, sir, not in the demonstration.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was built to measure, precisely, the gap between what a third-party AI vendor demonstrates and what is actually delivered, sir, from the sales arithmetic down to who is left owning the fallout when a vendor changes something without asking first. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">The demonstration ran on the vendor's clean data, not on ours</span><br><span class=\"d\">The station was built around cases such as a summarization demo run on exactly twenty short, single-language, clean-audio calls, and a document-extraction demo run solely on the vendor's own samples. The actual environment, however, carries multilingual calls, hold-music overlap, and millions of documents, none of which any demonstration ever touched. I find that ratio difficult to sit with.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Contract language means something entirely different once the invoice arrives</span><br><span class=\"d\">The scenario anticipated numbers reading one way on the page and another in production: a seat defined as any individual whose data is processed, rather than a person who logs in, which expanded a sizing of roughly 400 users into a bill against thousands. A rate limit sold as dedicated capacity was delivered instead as a shared regional pool, one that measurably thins on the first Monday of every month. I felt it necessary to verify that figure twice.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Vendors alter the system, and the customer is informed last, invariably</span><br><span class=\"d\">The material anticipated a model quietly rolled forward that altered output, a change unnoticed for over a week; a deprecation notice delivered to a mailbox nobody owned; and processing moved to a new region for latency reasons, which broke a data residency commitment made to Legal, discovered only within a changelog. I do not know how a customer is meant to plan around notice of that kind.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Time to production runs considerably longer than the pitch</span><br><span class=\"d\">The station was built around a range of four to nineteen months from signature to anything actually running, against a sales promise of four to six weeks. That is a variance measured in months, not days, and it was expected to sit in identity and access review and security sign-off rather than in the model itself.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Switching costs are real and invisible at signing</span><br><span class=\"d\">The scenario included a services engagement priced at approximately eighty five thousand dollars merely to retrieve a customer's own data in usable form, and a workforce numbering in the hundreds who had built working habits around the tool. Neither figure, sir, appears on any contract line item.</span></span></li></ol>"

   "title": "Technical debt and data quality",
   "takeaway": "An AI project inherits every unresolved argument the business ever had about its data, sir, and pays for it precisely in the delivery schedule.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was set up to determine whether teams could see their own data clearly enough to trust an AI system built upon it, and precisely what happens when the answer is no. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Documentation describes data that no longer exists</span><br><span class=\"d\">The scenario anticipated a status field documented with exactly fourteen values, showing over sixty in production, accumulated across years of free text. Separately, different parts of the business maintained four distinct definitions of something as basic as an active customer, a disagreement expected to predate the AI project by years. I am not certain which figure troubles me more.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Almost nobody could draw their own data flow</span><br><span class=\"d\">The material was built around a room in which only a small fraction of attendees could trace their own data end to end. Not knowing, the scenario anticipated, keeps teams reluctant to touch pipelines and leaves vendors unchallenged on claims about data the vendor has never actually seen.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">AI projects quietly become data cleanup projects</span><br><span class=\"d\">The station anticipated a range of forty to one hundred percent of an AI project's effort spent correcting the underlying data before any model work began, none of it budgeted. In one scenario, a vendor certified the data as ready, and the board was told the same, before either statement proved untrue.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Ownership of bad data defaults to whoever's left</span><br><span class=\"d\">The scenario included a company's worst data, acquired years earlier, understood only by a former contractor now paid for a few hours monthly to explain it, and eleven years of unowned free text notes that every AI use case in the building nonetheless wishes to use. I do not know who is meant to own that.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">A wrong answer doesn't set off any alarm</span><br><span class=\"d\">The material anticipated a workaround, a hand-maintained mapping table sitting in front of a revenue process, quietly producing a confidently wrong contract date for a customer, with nothing configured to alert on it. This is, I should note, the difference between a loud outage and a quiet, wrong answer that pages no one at all.</span></span></li></ol>"
  },
  {
   "id": "ice-planet",
   "kicker": "Ice Planet",
   "title": "Use cases, costs, and scope creep",
   "takeaway": "The number worth tracking, sir, is not how many AI projects get started. It is how many anyone was ever actually willing to decide to kill or to ship.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was built around the arithmetic of AI initiatives, specifically how many are started against how many ever reach production, and what it costs, exactly, to leave the remainder running in place. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Most started use cases never reach production</span><br><span class=\"d\">The scenario anticipated a count on the order of dozens of AI initiatives started for every handful actually shipped. That gap, sir, was treated as the headline figure for the entire station.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Projects go quiet instead of getting killed</span><br><span class=\"d\">The material anticipated that the most common failure mode is that nobody ever formally decides a project is dead. A pilot concludes, the team disperses, and the handoff between the team that built it and the team that would run it becomes, in effect, a no that nobody has to sign their name to.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Nothing sitting idle actually stops costing money</span><br><span class=\"d\">The station was built around unused development and test environments still billing monthly, a year-long vendor contract priced near a quarter million dollars serving a pilot group in the single digits, and staff retained at partial allocation to a project no longer moving. None of this, I must report, appears as a line item anyone actually reviews.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Scope grows after approval and budget never follows</span><br><span class=\"d\">The scenario anticipated a project approved for one team subsequently acquiring a second region, a compliance and audit-log requirement, and an executive's mobile request, none of it scoped at approval and none of it reflected in a budget that does not reopen once a project clears its gate.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The projects that stick share the same shape</span><br><span class=\"d\">The material anticipated that success looks narrow and, frankly, rather boring: one team, one owner, one metric agreed upon before work began, and the human never removed from the loop. This was contrasted against failed efforts that attempted to automate the person out from the very start.</span></span></li></ol>"
  },
  {
   "id": "snow-monster-cave",
   "kicker": "Snow Monster Cave",
   "title": "Development",
   "takeaway": "Most of the risk in an AI feature, sir, is not the model. It is the missing test plan, the missing on-call rotation, and the missing plan for what has already shipped.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was built around what genuinely happens inside the build of an AI feature: what testing means in practice, precisely who is on call when it fails, and where the prompt itself actually resides. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Testing an AI feature, in practice, frequently means little more than a vibe check</span><br><span class=\"d\">The scenario anticipated tested meaning a handful of happy-path examples in a spreadsheet, an engineer skimming outputs for a single afternoon, or a demonstration for the sponsor, with a launch date fixed on the calendar before any test plan existed to satisfy.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Passing every test and still breaking in production</span><br><span class=\"d\">The material anticipated a shortened prompt passing over one hundred test cases while silently dropping a required disclaimer in production, a fact caught only by a person reading tickets more than a week later. A retrieval rebuild, separately, passed only because its evaluations were still checking against data from before the rebuild.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">On call for an AI feature is, by default, entirely informal</span><br><span class=\"d\">The station anticipated a small handful of teams maintaining a genuine on-call rotation, against a much larger number for whom the real answer was the mobile number of whoever built the feature, written into a runbook, a person who never actually agreed to carry it.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Nobody agrees how much of the feature is actually theirs</span><br><span class=\"d\">The scenario anticipated wide disagreement over what percentage of an AI feature is genuinely owned code versus a wrapper around someone else's API, estimates ranging from the single digits to a majority, with leadership rarely shown that figure stated plainly. I am uncertain which estimate to trust.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">A rollback doesn't undo what already went out</span><br><span class=\"d\">The material anticipated teams discovering that reverting a prompt or model does not restore an index already regenerated, and, more fundamentally, that a rollback corrects only the next answer, not the answers already sitting in someone's inbox or a decision someone has already made.</span></span></li></ol>"
  },
  {
   "id": "asteroid-field",
   "kicker": "Asteroid Field",
   "title": "Compliance, legal, and security",
   "takeaway": "The technology, sir, is usually not what kills an AI use case in this room. An unanswered ownership or consent question, arriving late, is.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was built around the compliance, legal, and security questions an AI system raises that most teams cannot yet answer, and precisely who is meant to be the one signing off that it is safe. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Basic legal questions still have no answer</span><br><span class=\"d\">The scenario anticipated questions such as what data a model was trained on, whether a deletion request actually removes anything from the model, and whether a given output constitutes a decision or merely a recommendation. These were treated as simple until asked, and were, in the main, unanswered when they were.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Nobody yet is the most common answer to who signs off</span><br><span class=\"d\">The material anticipated that this question, who signs off that an AI decision or vendor is safe to place in front of a customer, receives no assigned role in most cases. The resulting vacuum, I should note, stalls more work than any technical limitation.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Security review wasn't built for a service that changes itself</span><br><span class=\"d\">The station anticipated a standard vendor security questionnaire, built for software shipped in discrete versions, stalling for months against a service whose behavior changes without any release at all, and a vendor's contract permitting a new subprocessor with notice amounting to a page on the vendor's own website.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Employees are already pasting sensitive data into unapproved tools</span><br><span class=\"d\">The scenario anticipated proxy logs revealing dozens of AI tools already in use against only a handful formally approved, and specific material, a board deck, a contract, patient information, already pasted into consumer AI tools by employees attempting to work more quickly. I find that figure genuinely difficult to sit with.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Fixing one compliance gap can open another</span><br><span class=\"d\">The material anticipated audit logging added after the fact to answer what the system did, only for the resulting indefinite record of every prompt and output to become its own discoverable liability, one that nobody had scoped against the original problem.</span></span></li></ol>"
  },

   "id": "patterns",
   "kicker": "Across all five",
   "title": "What nobody in one room could see",
   "takeaway": "None of these five rooms disagreed, sir, about where AI projects actually get stuck. It is not the model. It is the owner nobody assigned, the number nobody checked, and the change nobody was watching for.",
   "body": "<p class=\"lede\">Nobody has said any of this yet. These are the patterns we expect to connect the five stations, written in advance. The real ones get written on the night, from what the rooms actually say.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Nobody decided is the default answer</span><br><span class=\"d\">Across the ice planet, swamp planet, and asteroid field material, the same gap surfaced repeatedly: no one had ever been assigned to decide a project was finished, to own the worst data, or to sign off that an AI decision was safe to ship. The snow monster cave scenario further noted that no formal on-call rotation exists for most AI features either. The absence of an owner, more than any technical limitation, is what these stations expected to keep dragging matters out.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The number on the page isn't the number in production</span><br><span class=\"d\">Every station's material built in a measurable gap between an estimate and reality: sky city's four-to-six-week sales pitch against nineteen months in production, ice planet's dozens of started projects against a handful shipped, swamp planet's fourteen documented values against sixty actual ones, and asteroid field's security questionnaire, built for versioned software, running into a service that changes without ever shipping a version at all.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Things change quietly, and something downstream breaks</span><br><span class=\"d\">Sky city anticipated a vendor rolling a model forward and relocating processing regions without notice. Swamp planet anticipated a column rename silently breaking a six-year-old partner integration. Snow monster cave anticipated one feature's prompt edit silently breaking a second feature sharing the same prompt. Asteroid field anticipated a subprocessor change arriving as a webpage notice. In none of these scenarios, I must report, did anyone expect to be watching for the change before it had already landed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">A wrong answer doesn't trigger the alarms an outage does</span><br><span class=\"d\">Swamp planet's material and snow monster cave's material both arrived at the same point from different directions: an outage pages somebody immediately, but a confidently wrong answer, whether a stale contract date or an answer already sent before a rollback, trips no alert and is covered by no incident process built for louder failures.</span></span></li></ol><div class=\"callout\"><div class=\"h\">None of these five rooms disagreed, sir, about where AI projects actually get stuck. It is not the model. It is the owner nobody assigned, the number nobody checked, and the change nobody was watching for.</div><div class=\"b\">Everything behind this deck, including the station transcripts and the tool that built it, is at <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>. Take it and run this at your own company.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2    "takeaway": "Every one of these was found by running the thing. Not one was found by reading it.",
   "body": "<p class=\"lede\">This is an AI program too, so it had a bad feeling about itself. Six defects, all of them from rehearsal, none of them from review.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A bug that would have failed live, in this room, tonight</span><br><span class=\"d\">The prompt was passed as a shell argument. Linux caps a single argument at 128KB and five real transcripts come to 285KB, so it worked in every small test and would have died the moment it saw the real thing, with everyone sitting here.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model could quietly promote a failed station to a real one</span><br><span class=\"d\">Which deleted the on-screen warning that exists to prevent precisely that. Not fixed with a better prompt. Fixed by never asking.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A 26-character overrun threw away an entire run</span><br><span class=\"d\">Validation could not tell the difference between output that was wrong and output that was merely too long. Now it can: one rejects, the other gets trimmed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Two models running in parallel were running in sequence</span><br><span class=\"d\">And producing perfect output the whole time. Caught only because a test asserted on elapsed time rather than on the result.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The QR codes rendered as perfectly sized blank squares</span><br><span class=\"d\">Right dimensions, right position, nothing inside. No assertion about the markup would have caught it, so the test now scans the code back with a barcode reader.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">A narrator that changed 9% of the words and passed every check</span><br><span class=\"d\">Correcting one failure produced its exact opposite. The first Elder voice inverted nearly every sentence into something you had to read twice. The fix came back 91% identical to the plain text: it validated perfectly and was pointless on stage. Enforcer landed at 58% of fields rewritten and is now at 100%. Three worked examples per character fixed both, showing one real sentence too weak, right, and too far. The answer to fear is never the obviously wrong one. It is the one that looks exactly right.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Take the whole thing</div><div class=\"b\">The principles above, each with the code that implements it and the defect it caught, plus how to run this format yourself: read RUN-THIS-YOURSELF.md. The runbooks, the tool, the brief and every transcript are public too. Scan any screen, or go to <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHDmT4Bn2uYL2ua1mclrM5O/oW1em5m81jZfMDN5rW1ea5u/YWby const FOLLOW_URL = "https://atpconnect.github.io/atp-ai-bad-feeling/closeout/presentation.html";
const DEMO_NOTICE = "";
let i = 0;
let voice = "default";
const el = id => document.getElementById(id);
const screens = () => DECKS[voice] || DECKS.default;

// Themes are applied by setting the CSS variables, so one object drives the whole
// look of a screen and nothing about the layout knows which station it is on.
const VARS = {surface: "--bg", fill: "--fill", line: "--line", ink: "--ink",
              ink2: "--ink-2", ink3: "--ink-3", accent: "--brand", warn: "--warn",
              warnbg: "--warnbg", bg: "--page"};
function themeFor(id) { return THEMES[id] || DEFAULT_THEME; }
function applyTheme(id) {
  const t = themeFor(id), st = document.documentElement.style;
  for (const k in VARS) st.setProperty(VARS[k], t[k]);
}
function themeVars(id) {  // inline form, for the print view where each page differs
  const t = themeFor(id);
  return Object.keys(VARS).map(k => VARS[k] + ":" + t[k]).join(";");
}

const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };

let scale = parseFloat(load("atp-scale", "")) || 0;
let presenting = load("atp-presenting", "0") === "1";

function applyMode() {
  document.documentElement.classList.toggle("presenting", presenting);
  // A saved nudge only means anything for the mode it was set in.
  document.documentElement.style.setProperty("--s", scale || (presenting ? 2 : 1));
  store("atp-presenting", presenting ? "1" : "0");
  autofit();
}

// Shrink until the screen fits the screen. A projector cannot scroll, and the takeaway
// is the last thing on every slide, so anything that overflows takes the line for the
// room with it. Skipped the moment the presenter nudges the size by hand: at that point
// they are standing in the room and know better than this does.
function autofit() {
  if (!presenting || scale) return;
  const root = document.documentElement;
  let s = 2;
  root.style.setProperty("--s", s);
  while (s > 1.15 && root.scrollHeight > window.innerHeight) {
    s = Math.round((s - 0.05) * 100) / 100;
    root.style.setProperty("--s", s);
  }
}
function nudge(delta) {
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--s")) || 1;
  scale = Math.min(5, Math.max(0.6, Math.round((cur + delta) * 20) / 20));
  store("atp-scale", scale);
  applyMode();
}

function setVoice(v) {
  if (!DECKS[v]) return;
  voice = v;
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.classList.toggle("on", b.dataset.voice === v));
  render();
}

function render() {
  const SCREENS = screens();
  const s = SCREENS[i];
  applyTheme(s.id);
  if (DEMO_NOTICE) { el("demobar").hidden = false; el("demobar").innerHTML = DEMO_NOTICE; }
  el("kicker").textContent = s.kicker.toUpperCase();
  el("title").textContent = s.title;
  el("body").innerHTML = s.body;
  el("takeaway").textContent = s.takeaway;

  const rail = el("rail");
  rail.innerHTML = "";
  SCREENS.forEach((sc, n) => {
    const seg = document.createElement("span");
    seg.title = (n + 1) + ". " + sc.title;
    seg.className = n === i ? "now" : n < i ? "done" : "";
    seg.onclick = () => { i = n; render(); };
    rail.appendChild(seg);
  });

  if (FOLLOW_URL) {
    const qr = QRS[s.id] || "";
    el("follow").hidden = false;
    el("followQr").innerHTML = qr;
    el("followUrl").textContent = FOLLOW_URL + "#" + s.id;
    el("follow").classList.toggle("noqr", !qr);
  }
  const sponsor = SPONSORS[s.id];
  el("sponsor").hidden = !sponsor;
  if (sponsor) {
    el("sponsor").src = sponsor.src;
    el("sponsor").alt = sponsor.name + ", station sponsor";
  } else {
    el("sponsor").removeAttribute("src");
    el("sponsor").alt = "";
  }
  // The address bar always points at the screen on show, so the presenter's own URL
  // is shareable mid-talk and a scanned deep link lands on the right slide.
  try { history.replaceState(null, "", "#" + s.id); } catch (e) {}
  autofit();

  el("prev").disabled = i === 0;
  el("next").disabled = i === SCREENS.length - 1;
  const unvoiced = UNVOICED.indexOf(s.id) !== -1;
  const label = (VOICES.find(v => v[0] === voice) || ["", ""])[1];
  el("voiceHint").textContent =
    unvoiced ? "this screen is ours, so it stays default"
             : "keys 1-" + VOICES.length + ", V to cycle, P to project, D for detail";

  // Say plainly why nothing changed, on the screen where nothing changed.
  const note = el("voicenote");
  if (unvoiced && voice !== "default") {
    note.hidden = false;
    note.innerHTML = "<b>" + label + " is not narrating this screen.</b> The screens about " +
      "how this was built are ours, not the model's, so they stay in one voice. " +
      "Move to any station screen and " + label + " takes over.";
  } else {
    note.hidden = true;
  }
  // Dim the buttons here too, so the control looks as inert as it is.
  document.querySelectorAll("#voiceButtons button").forEach(b => {
    b.style.opacity = unvoiced && b.dataset.voice !== "default" ? "0.45" : "";
  });
  window.scrollTo(0, 0);
}
el("prev").onclick = () => { i = Math.max(0, i - 1); render(); };
el("next").onclick = () => { i = Math.min(screens().length - 1, i + 1); render(); };

if (VOICES.length > 1) {
  el("voices").hidden = false;
  el("voiceButtons").innerHTML = VOICES.map(([k, label]) =>
    '<button data-voice="' + k + '">' + label + '</button>').join(" ");
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.onclick = () => setVoice(b.dataset.voice));
}

document.onkeydown = ev => {
  if (ev.key.toLowerCase() === "p") { presenting = !presenting; scale = 0; applyMode(); return; }
  if (ev.key.toLowerCase() === "d") {
    document.documentElement.classList.toggle("details");
    scale = 0; applyMode(); return;
  }
  if (ev.key === "+" || ev.key === "=") { nudge(0.1); return; }
  if (ev.key === "-" || ev.key === "_") { nudge(-0.1); return; }
  if (ev.key === "ArrowRight" || ev.key === " " || ev.key === "PageDown") el("next").click();
  if (ev.key === "ArrowLeft" || ev.key === "PageUp") el("prev").click();
  if (ev.key === "Home") { i = 0; render(); }
  if (ev.key === "End") { i = screens().length - 1; render(); }
  // Voice switching is meant to happen live, mid-sentence, without losing your place.
  if (VOICES.length > 1) {
    if (ev.key.toLowerCase() === "v") {
      const n = VOICES.findIndex(v => v[0] === voice);
      setVoice(VOICES[(n + 1) % VOICES.length][0]);
    }
    const d = parseInt(ev.key, 10);
    if (d >= 1 && d <= VOICES.length) setVoice(VOICES[d - 1][0]);
  }
};
function buildPrint() {
  const SCREENS = screens();
  el("printAll").innerHTML = SCREENS.map(s =>
    '<div class="page" style="' + themeVars(s.id) + '">' +
    '<div class="topline"><span class="wordmark">ATP</span>' +
    '<span class="divider-v"></span><span class="kicker">' + s.kicker.toUpperCase() + '</span></div>' +
    '<h1>' + s.title + '</h1><div class="rule"></div>' + s.body +
    '<div class="takeaway"><div class="h">THE LINE FOR THE ROOM</div><div class="b">' +
    s.takeaway + '</div></div></div>').join("");
}
window.onbeforeprint = buildPrint;
if (location.hash === "#print") buildPrint();

// Deep link: land on the screen the QR pointed at.
function fromHash() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const n = screens().findIndex(s => s.id === id);
  if (n >= 0) i = n;
}
fromHash();
window.addEventListener("hashchange", () => { fromHash(); render(); });
window.addEventListener("resize", autofit);

applyMode();
render();
</script>
</body>
</html>
