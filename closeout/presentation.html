<title>The Throne Room, ATP September 17, 2026 (pre-seeded)</title>
<style>
  :root {
    /* Everything sizes off --fs so presentation mode is one number, not a restyle.
       --s is nudged live with + and - because the only way to know what reads from
       the back of a particular room is to stand in it. */
    --base-fs: 15px;
    --s: 1;
    --fs: calc(var(--base-fs) * var(--s));
    --maxw: 940px;
    /* Set per screen from THEMES. The defaults here are the method-screen palette. */
    --brand: #2C6FBF;
    --page: #f5f7f8;
    --warnbg: #fdf6ee;
    --warn: #B4610C;
    --ink: #14181a;
    --ink-2: #4a5257;
    --ink-3: #697276;
    --line: #e3e7e9;
    --fill: #f5f7f8;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page); color: var(--ink);
    transition: background 320ms ease, color 200ms ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: var(--fs); line-height: 1.5;
  }
  /* Presentation mode is one number. Everything sizes off --fs, so doubling --s
     doubles the whole deck rather than restyling it screen by screen. */
  :root.presenting { --s: 2; --maxw: 1760px; }
  :root.presenting .shell { padding: 12px 16px 20px; }
  :root.presenting .stage { padding: 20px 26px 18px; }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.55); }
  :root.presenting .lede { margin-bottom: calc(var(--fs) * 0.7); }
  :root.presenting .rule { margin: 10px 0 16px; }
  :root.presenting .takeaway { margin-top: calc(var(--fs) * 0.7); }
  /* Headline big, detail a step down. On a projector the headline is what carries the
     room and the detail is what the phone is for. */
  /* The projector shows headlines. The phone shows the detail.

     This is not a compromise, it is the measurement: five headlines each followed by
     two lines of detail needs 1458px of a 993px screen at readable type, so something
     has to go, and it should be the thing nobody reads off a wall in a bar. Headlines
     plus the takeaway is a slide. Headlines plus 400 characters of detail is a document
     being projected at people. Press D to reveal the detail on any screen. */
  :root.presenting ol.points .d { display: none; }
  :root.presenting.details ol.points .d { display: block; font-size: calc(var(--fs) * .72); }
  :root.presenting ol.points .t { font-size: calc(var(--fs) * 1.05); }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.42); }
  :root.presenting .follow { margin-top: 8px; padding-top: 8px; }
  :root.presenting .follow .t { font-size: calc(var(--fs) * .55); }
  /* Big enough to scan from the back of the room, which is the only size that counts.
     A QR only the front two rows can reach is decoration. */
  :root.presenting .followqr { width: calc(var(--fs) * 4.6); }
  :root.presenting .follow .t { font-size: calc(var(--fs) * .62); }
  .shell { max-width: var(--maxw); margin: 0 auto; padding: 28px 24px 64px; }
  .stage { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 34px 38px 30px;
           box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 14px 44px rgba(0,0,0,.12); }

  .rail { display: flex; gap: 4px; margin-bottom: 22px; }
  .rail span { flex: 1; height: 3px; background: var(--line); cursor: pointer; }
  .rail span.done { background: var(--ink-3); }
  .rail span.now { background: var(--brand); }

  .topline { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .wordmark { color: var(--brand); font-weight: 800; letter-spacing: .18em; font-size: calc(var(--fs) * .8); }
  .divider-v { width: 1px; height: 12px; background: var(--line); }
  .kicker { font-size: calc(var(--fs) * .8); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
  .count { margin-left: auto; font-size: calc(var(--fs) * .8); color: var(--ink-3); font-variant-numeric: tabular-nums; }

  h1 { font-size: calc(var(--fs) * 1.6); line-height: 1.25; margin: 4px 0 0; font-weight: 650; }
  .rule { width: 48px; height: 2px; background: var(--brand); margin: 12px 0 24px; }
  p { margin: 0 0 12px; }
  .lede { font-size: calc(var(--fs) * 1.07); margin-bottom: 20px; }

  ol.points { list-style: none; margin: 0; padding: 0; }
  ol.points li { display: flex; gap: 14px; margin-bottom: 15px; }
  ol.points .n { color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; min-width: calc(var(--fs) * 1.35); }
  ol.points .t { font-weight: 600; }
  ol.points .d { color: var(--ink-2); }

  .pill { display: inline-block; font-size: calc(var(--fs) * .7); letter-spacing: .07em; font-weight: 700;
          color: var(--brand); border: 1px solid var(--brand); border-radius: 3px;
          padding: 1px 6px; vertical-align: 2px; margin-left: 4px; }
  .pill.warn { color: var(--warn); border-color: var(--warn); }

  .flag { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
          color: var(--ink-2); padding: 11px 14px; border-radius: 4px; margin-bottom: 18px; font-size: calc(var(--fs) * .93); }
  .flag b { color: var(--warn); }

  .callout { border: 1px solid var(--line); border-left: 3px solid var(--brand); background: var(--fill);
             padding: 12px 14px; border-radius: 4px; margin-top: 20px; }
  .callout .h { font-weight: 650; margin-bottom: 4px; }
  .callout .b { color: var(--ink-2); }
  .qr { display: block; width: 132px; height: 132px; margin: 12px 0 2px; image-rendering: pixelated; }

  .takeaway { border-left: 3px solid var(--brand); background: var(--fill); padding: 10px 14px; margin-top: 24px; }
  .takeaway .h { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-bottom: 3px; }
  .takeaway .b { font-weight: 600; }

  .nav { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  button { font: inherit; font-size: calc(var(--fs) * .87); padding: 6px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--fill); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  .nav .right { margin-left: auto; font-size: calc(var(--fs) * .8); color: var(--ink-3); }

  .voices { display: flex; align-items: center; gap: 6px; margin-top: 14px;
            padding-top: 14px; border-top: 1px solid var(--line); }
  .voices .lab { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-right: 4px; }
  .voices button { font-size: calc(var(--fs) * .8); padding: 4px 10px; }
  .voices button.on { background: var(--brand); color: var(--bg); border-color: var(--brand); }
  /* Demo builds carry this on every screen, not just the first. A page of invented
     people and invented numbers sitting at a public URL has to say so wherever the
     reader happens to land, including on a deep link straight into station four. */
  /* Selecting a narrator on a screen that never changes voice used to do nothing at
     all, with the only explanation in small grey type at the far edge of the voice
     bar. The deck opens on one of those screens, so the first thing anyone tried
     looked broken. Say it where they are looking. */
  .voicenote { border-left: 3px solid var(--brand); background: var(--fill);
               padding: 9px 13px; border-radius: 4px; margin-bottom: 18px;
               font-size: calc(var(--fs) * .85); color: var(--ink-2); }
  .voicenote b { color: var(--ink); }

  .demobar { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
             color: var(--ink-2); padding: 9px 13px; border-radius: 4px;
             margin-bottom: 16px; font-size: calc(var(--fs) * .8); }
  .demobar b { color: var(--warn); }

  .follow { display: flex; align-items: center; gap: 12px; margin-top: 12px;
            padding-top: 12px; border-top: 1px solid var(--line); }
  .followqr { width: 62px; aspect-ratio: 1 / 1; flex: none; display: block;
              background: #fff; padding: 4px; border-radius: 3px; }
  .follow .t { font-size: calc(var(--fs) * .8); color: var(--ink-3); line-height: 1.45; }
  .follow .t b { color: var(--ink-2); }
  .follow .u { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: calc(var(--fs) * .72); color: var(--ink-3); word-break: break-all; }

  .voices .hint { margin-left: auto; font-size: calc(var(--fs) * .77); color: var(--ink-3); }

  #printAll { display: none; }
  @media print {
    body { background: #fff; --page: #fff; }
    .rail, .nav, .stage { display: none !important; }
    .shell { max-width: none; padding: 0; }
    #printAll { display: block; }
    #printAll .page { page-break-after: always; padding: 0 0 24px; }
    #printAll .page:last-child { page-break-after: auto; }
  }
</style>

<script>
// VOICES is [[key, label], ...] in display order.
// UNVOICED lists the screen ids that never change voice: they are ours, not the model's.
const DECKS = {
 "straight": [
  {
   "id": "method",
   "kicker": "How this was made",
   "title": "Five rooms, one picture, ten minutes",
   "takeaway": "The AI did the reading. Everything that had one correct answer was done by code.",
   "body": "<p class=\"lede\">Five stations ran in parallel. Nobody was in more than one of them. This deck existed before the last one finished talking.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Every station was recorded to its own meeting, hosted by one person</span><br><span class=\"d\">Not by the pilot running the room. One account owned all five, so no session depended on a presenter remembering to press a button correctly.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Ending the meeting is what starts the transcript</span><br><span class=\"d\">Teams generates a transcript 2.5 to 5 minutes after a meeting is ended, not left. Five staggered endings, then one to three minutes for the model to read every word said in this building and answer. That is the budget you just watched us spend, and every number in it was measured in rehearsal.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model was given the transcripts and a written brief, and asked for data</span><br><span class=\"d\">Not for a deck. It returns structured content, which is checked against a schema before anything is rendered. Wrong shape, wrong station name, too many bullets: rejected, and the previous deck stands.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The slides you are looking at were generated by code, not by the model</span><br><span class=\"d\">Order, branding, navigation, this screen, the QR code: all deterministic. The model only wrote the parts that needed judgment about what was said.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Two models ran at once, and it was not a race</span><br><span class=\"d\">A fast standby answered the same question in parallel. The good model got the whole deadline to itself and the standby was only used if it missed. Measured on the night's transcripts: 81 seconds against 167. A race would have handed you the weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy was built <b>before the stations ran</b>, from the question lists and the answers we expected to hear. It is the floor, not the deck: if every recording in the building had failed, this is what you would be looking at, and it would say so on every screen. Written by the primary model. Generated 2026-09-13 10:25.</div></div>"
  },
  {
   "id": "reliability",
   "kicker": "The transferable part",
   "title": "Why this worked when your AI program did not",
   "takeaway": "Give the model the judgment call. Never give it anything you could check by machine instead.",
   "body": "<p class=\"lede\">Nothing here needed a better model. It needed the unglamorous things around the model to be decided in advance, and every one of them is a thing your program can do on Monday.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Deterministic wherever determinism is available</span><br><span class=\"d\">The model wrote the words. Code decided the running order, the branding, which stations are flagged, the navigation, the QR, and this sentence. A model that cannot choose the running order cannot get the running order wrong. Shrink what it is allowed to decide and you shrink what a human has to check at 7:50pm.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Never ask a model a question you can already answer</span><br><span class=\"d\">Which stations produced a real recording is a fact sitting on a disk. The deck reads it from there and throws away whatever the model says about it. That closed a real hole: a model that relabelled a failed station as a real one silently deleted the warning built to catch exactly that.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Constrain the output until it can be validated</span><br><span class=\"d\">It returns JSON against a fixed schema, not slides. Unknown station, missing station, too many bullets: rejected, and the deck already on disk stands untouched. You cannot check free text. You can check a schema.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Write the evals before the night, and test the disasters</span><br><span class=\"d\">137 automated checks across 24 rehearsals of this evening, including no transcript at all, prose instead of JSON, a crashed CLI, a transcript arriving late, and a narrator quietly dropping the numbers. The happy path is the least useful thing you can test.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Score the things you would otherwise argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"
  },
  {
   "id": "sky-city",
   "kicker": "Sky City",
   "title": "Infrastructure and integration with third-party tools",
   "takeaway": "Negotiate the definitions, not the price: what a seat is, whose rate limit it is, what notice you get before the model changes, and what a tested data export costs before go live rather than after.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Sky City was set up to open the gap between what a vendor demo shows and what an integration actually costs, one contract line at a time. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A seat is not a person</span><br><span class=\"d\">The definition this station was built to surface is the contract one: a seat as any individual whose data the service processes in a billing period. A deployment sized for four hundred users bills against roughly nineteen thousand, because every customer whose claim passes through it counts. The demos that set the expectation ran on twenty hand picked calls, all clean audio and all under four minutes, or two hundred indexed files against a real corpus of eleven million.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The rate limit in the contract is a pool, not yours</span><br><span class=\"d\">Sixty requests a second is written as though it belongs to you and is expected to be shared across a region, so capacity thins out on the first Monday of the month when every other buyer runs month end. Uptime reads the same way: the number almost always measures the API being reachable, monthly, with a carve out for capacity events, which is not the same sentence as the thing working.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The vendor changes something and you find out late</span><br><span class=\"d\">The failures Sky City expects are quiet ones. A model rolled forward on a Tuesday, noticed nine days later by a supervisor who samples output weekly. A forty five day deprecation notice sent to a shared mailbox owned by someone who left in March, found in spam with eleven days to go. Inference moved to multi region to improve latency, which also moved data out of the region Legal had been promised, announced in a changelog entry.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Identity is where the months go</span><br><span class=\"d\">Identity is the assumption this station expects tools to get wrong most often, ahead of network, data access, and who is allowed to call it, and the cost attached is four months building a permissions proxy in front of a product already bought. Signing to production runs from four months to nineteen against sales talk of six weeks to first value. Almost none of that time is the model: it is identity, data access reviews, security review, and waiting for a budget quarter.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The exit cost is not in the contract</span><br><span class=\"d\">Eighty five thousand dollars and about ten weeks for a services engagement to get your own extracted data back in a documented format, because the export is in the contract and the format is not. The larger number has no invoice at all: three hundred and ten supervisors who have built a way of working around the tool, and retraining them appears in no agreement anywhere.</span></span></li></ol>"
  },
  {
   "id": "swamp-planet",
   "kicker": "Swamp Planet",
   "title": "Technical debt and data quality",
   "takeaway": "Profile the data before you promise anybody a date, and get the four people who disagree about your main entity into one room before anything is built. If nobody would notice it being wrong, that is the real finding.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Swamp Planet was built to get the real state of the data said out loud, what it was like the first time an AI system touched it and what the cleanup actually cost. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">It is not a data problem, it is a disagreement problem</span><br><span class=\"d\">The sharpest thing this station was set up to surface is definitional rather than technical: four definitions of an active customer across three systems, each one correct for the team that owns it, a disagreement nine years old that nobody had to resolve until a model needed a single answer. The technical version sits beside it, a status field documented with fourteen values and holding more than sixty in production because it has been free text since 2019, half of them typos of the other half.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Most of the project is cleanup, and none of it was budgeted</span><br><span class=\"d\">The expected answers run from forty percent to all of it and cluster in the seventies and eighties, including one project ten months in whose only delivery is a clean customer table that everybody now uses and nobody will fund. The single low answer of forty percent comes from an eighteen month warehouse migration already paid for, for a completely different reason, years earlier.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Nobody owns the worst data</span><br><span class=\"d\">Three people out of twenty five are expected to be able to name an owner for their worst data. The rest is what the station exists to draw out: customer records merged by a contractor on a fixed bid in 2019, with the one person who understood the mapping now billing four hours a month as a consultant; a product hierarchy whose owner after a reorg is a Teams channel; eleven years of free text service notes that nobody owns and every proposed use case wants.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The workaround becomes the thing you can no longer fix</span><br><span class=\"d\">Built around it is expected to beat fixed it by a wide margin, and the example is an eleven hundred row mapping table maintained by hand in a spreadsheet that syncs to a database nightly, now sitting in the path of a process that touches revenue. It costs one analyst permanently, and it also makes the underlying data unfixable, because unwinding eleven hundred hand written exceptions is its own project that nobody will fund either.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">A wrong answer does not page anybody</span><br><span class=\"d\">The expected split is five catching a confidently wrong output before a customer did and fourteen catching it after. The case the station is written around is an assistant telling a customer a contract end date eleven months wrong, because it read a table that stopped being updated when billing systems changed. Nothing was down, nothing was slow, nothing threw an error. Twenty years of alerting has been built for the loud failure, and this is the quiet one.</span></span></li></ol>"
  },
  {
   "id": "ice-planet",
   "kicker": "Ice Planet",
   "title": "Use cases, costs, and scope creep",
   "takeaway": "Nothing on the list of what would have to be true to ship next quarter is a better model. It is a named production owner, a support model, a decision date, and operating budget approved when the build budget is.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Ice Planet opens with arithmetic, use cases started against use cases actually in production, and spends the rest of its time on where the difference goes and what it costs while it sits there. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A hundred and forty seven started, nineteen live</span><br><span class=\"d\">The totals this station is built around are roughly a hundred and forty seven AI use cases started against nineteen in production, with one set of answers running north of thirty started because every function began its own. The only case where all four are live comes with a rule attached: you cannot start a fifth until one of them lands.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The most common way a project ends is that nobody decides</span><br><span class=\"d\">Against budget, no owner, data, and legal, the largest expected pile is that nobody ever actually decided. Projects do not get cancelled, they get quiet. The pilot ends, the team moves to the next thing, there is no meeting where anyone says this is finished or this is dead, and two years later it is still on a slide. The handoff version is a platform team answering not in this year's plan, which is a no that nobody has to own.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">An uncancelled project still bills every month</span><br><span class=\"d\">Six thousand a month in dev and test environments nobody turned off. A vendor contract with eleven months left at two hundred and forty thousand a year, carrying one pilot with nine users. Three people at ten percent allocation, which means they are on it and also not fully on anything else. None of it shows up as a line item anybody reviews, which is precisely why it survives, and the unpriced one is credibility with a board that has seen two proposals already.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The bill multiplies, and the model is not the reason</span><br><span class=\"d\">Expected multiples against the pilot estimate run from three to eleven times, with one eleven times case flat per transaction because the volume was eleven times too. The surprises named are people, two and a half permanent reviewers on a regulated workflow; seats going from sixty to eleven hundred in five months; re-embedding the corpus every time anything changes; and eval work that had no budget line at all. Token price came down twice.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">What sticks is boring and has an owner</span><br><span class=\"d\">The use cases expected to survive are narrow ones. Routing inbound email for a shared mailbox: one workflow, one team, one owner in the business who wanted it, a number agreed before the start, handle time from about nine minutes to five and a half with reopen rate flat. The other is drafting a first response with a person approving every one. The failures are expected to start by removing the person.</span></span></li></ol>"
  },
  {
   "id": "snow-monster-cave",
   "kicker": "Snow Monster Cave",
   "title": "Development",
   "takeaway": "The integration is an afternoon and the eval set is a month. Write the on call plan and put the prompt in the repository before launch, and decide now what you do about the answers that already went out.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Snow Monster Cave is about what actually happens inside the build: what tested meant, what broke anyway, and who picks up the phone at two in the morning. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Tested means whatever the calendar allowed</span><br><span class=\"d\">The expected definitions of tested run from vibes, to forty examples in a spreadsheet the product manager wrote, to an engineer reading outputs for an afternoon, to three hundred golden cases that are all happy path with nothing adversarial, nothing empty, and nothing in the wrong language. One real eval harness appears, built after an incident on the previous feature. Nobody decided any of it was enough. The launch date was on the calendar before the test plan existed.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The tests pass because they are testing the wrong thing</span><br><span class=\"d\">A tightened prompt passes a hundred and twenty cases and then drops a required disclaimer in production, because the disclaimer was the longest sentence and shorter was the instruction. A rebuilt retrieval index passes every eval because the eval used a cached retrieval set from before the rebuild, testing the old index against the new model. And a vendor side change breaks behaviour with nothing in the repository having moved at all.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Three formal on call rotations out of twenty two</span><br><span class=\"d\">What this station expects instead is a mobile number typed into a runbook during launch week, or an alert reaching a platform engineer who is good and has no idea what the thing does, whose real escalation is a Teams message to the builder. The two a.m. case is a backed up queue whose only fix was a setting in a vendor console that one person had the login for, and that person was asleep and had never agreed to carry it.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The prompt is not where you think it is</span><br><span class=\"d\">Eight expect prompts in source control, six in a vendor console, two on a laptop. The cost attached is output quality dropping on a Monday with nothing in the release notes, nothing in the repository, and no deployment, because someone edited a console prompt at five on Friday for a good reason on a different feature, and both features read the same prompt. The win from moving it is not version control, it is that a change now has a person and a reason on it.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">You cannot roll back the answers already given</span><br><span class=\"d\">Rolling back a prompt takes four minutes, or forty when thirty nine of them are spent finding the prompt. A pinned version tier gets close but not identical behaviour back, and one rollback only looked successful because the index embeddings had already been regenerated with the new model. The output that went out is in inboxes, in tickets, and in decisions people made, and no incident process has a step for it.</span></span></li></ol>"
  },

   "id": "asteroid-field",
   "kicker": "Asteroid Field",
   "title": "Compliance, legal, and security",
   "takeaway": "Every control has a second bill. Logging prompts and outputs to answer the audit creates a complete, indefinite, discoverable record of everything every employee has ever asked, and nobody scoped either side of it.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Asteroid Field was set up around the questions Legal asks that nobody can answer, and what happens to a use case in the months everyone spends waiting for an answer. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Nobody signs the output</span><br><span class=\"d\">Asked who signs off that an AI decision is safe enough to put in front of a customer, the expected answer is nobody yet, five times out of nine. The other four are people who did not want the job: a CISO who signs the vendor but not the decision, Legal who signs the contract but not the output, a risk committee that meets monthly and so means nobody for up to four weeks, and a CIO who has said out loud that it should not be the CIO.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The deletion question still has no answer</span><br><span class=\"d\">The opening list is the questions Legal asks and nobody can answer: what the model was trained on, whether a customer's deleted data comes back out of it, whether a specific output can be explained to a regulator in plain language, who is liable when it is wrong, and what the retention obligation is for a prompt. Three vendors asked the deletion question are expected to answer no, effectively no, and a paragraph that means no. The one question answered got answered by changing the product so a person presses a button.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The review is not wrong, it is late</span><br><span class=\"d\">Compliance is expected to have killed use cases outright: call summarisation, where the consent script covers recording for quality but not processing by a third party and the consent change takes eighteen months; resume screening, on bias audit requirements in two hiring jurisdictions. The objection is timing rather than judgment. Four months and about two hundred thousand dollars went into something that was never going to be legal, and someone could have said so in week one for free.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Blocking moves the problem, it does not remove it</span><br><span class=\"d\">Proxy logs are expected to show thirty four distinct AI tools in use with three approved, and DLP to turn up customer contracts, an unsigned commercial agreement, source code, and a board deck pasted in by someone senior enough that nobody wanted to write the incident report. Blocking pushes the same traffic onto phones, where it cannot be seen at all. Sanctioning one enterprise tool and putting it in front of everybody cuts unapproved use by around eighty percent, which is not zero and is still a lot of problem.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The audit that actually arrived came from a customer</span><br><span class=\"d\">The pressure this station expects is not regulatory: four new AI questions on a cyber insurance renewal, one asking whether AI touches customer eligibility; external auditors wanting every place AI sits in the financial reporting path documented as a control; and a large customer's security annex harder than anything any regulator has published, with the account attached to answering it. The regulatory silence is not relief, because nothing is harder to build against than a position that does not exist yet.</span></span></li></ol>"
  },

   "takeaway": "Nothing that stopped these five missions was the model. It was a definition nobody agreed, an owner nobody named, a decision nobody made, and a failure that nothing in the building would page anybody about.",
   "body": "<p class=\"lede\">Nobody has said any of this yet. These are the patterns we expect to connect the five stations, written in advance. The real ones get written on the night, from what the rooms actually say.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Nothing was down, and everything was wrong</span><br><span class=\"d\">Sky City has a model rolled forward without notice, caught nine days later by a supervisor sampling output. Snow Monster Cave has a shortened prompt dropping a required disclaimer, caught nine days later by a quality lead reading tickets. Swamp Planet has a customer given a contract end date eleven months wrong. In all three, nothing was down, nothing was slow, and nothing threw an error. Every alerting system in every building here was built for the loud failure.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The bottleneck is a name, not a technology</span><br><span class=\"d\">Ice Planet's largest stall reason is that nobody ever decided. Asteroid Field answers nobody yet, five times out of nine, on who signs off an AI decision. Swamp Planet gets three people out of twenty five who can name an owner for their worst data. Snow Monster Cave gets three formal on call rotations out of twenty two, and names the missing skill as somebody with the standing to stop a launch. Four stations, four versions of the same empty chair.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model is never the expensive part</span><br><span class=\"d\">Sky City puts four to nineteen months between signing and production, spent on identity, data access reviews, security review, and waiting for a budget quarter. Swamp Planet expects seventy to eighty percent of the project to become data cleanup. Snow Monster Cave puts the integration at an afternoon and the eval set at a month. Ice Planet's token prices came down twice, and not one thing on its list of what would have to be true to ship is a better model.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The fix arrives with its own bill</span><br><span class=\"d\">Swamp Planet's eleven hundred row mapping table saves the deadline and makes the underlying data permanently unfixable. Asteroid Field closes an audit gap by logging every prompt and output, and creates a discoverable record of everything every employee has asked. Sky City's abstraction layer is a hedge with a backlog and an on call rotation against a switch that has not happened yet, and the counter argument is simply that you have not needed it yet.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The person you left in is the control that works</span><br><span class=\"d\">Ice Planet expects the failures to start by removing the person, and two and a half permanent reviewers to be the line that turned a business case upside down. Asteroid Field expects the same two and a half people, added after the fact, and still calls it the right call. Swamp Planet catches a stale pricing table only because someone reads two hundred outputs a week. Snow Monster Cave's production breaks are found by humans reading tickets, not by dashboards.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Nothing that stopped these five missions was the model. It was a definition nobody agreed, an owner nobody named, a decision nobody made, and a failure that nothing in the building would page anybody about.</div><div class=\"b\">Everything behind this deck, including the station transcripts and the tool that built it, is at <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>. Take it and run this at your own company.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAw    "id": "receipts",
   "kicker": "Our own bad feeling",
   "title": "What that discipline caught, in this deck, this week",
   "takeaway": "Every one of these was found by running the thing. Not one was found by reading it.",
   "body": "<p class=\"lede\">This is an AI program too, so it had a bad feeling about itself. Six defects, all of them from rehearsal, none of them from review.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A bug that would have failed live, in this room, tonight</span><br><span class=\"d\">The prompt was passed as a shell argument. Linux caps a single argument at 128KB and five real transcripts come to 285KB, so it worked in every small test and would have died the moment it saw the real thing, with everyone sitting here.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model could quietly promote a failed station to a real one</span><br><span class=\"d\">Which deleted the on-screen warning that exists to prevent precisely that. Not fixed with a better prompt. Fixed by never asking.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A 26-character overrun threw away an entire run</span><br><span class=\"d\">Validation could not tell the difference between output that was wrong and output that was merely too long. Now it can: one rejects, the other gets trimmed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Two models running in parallel were running in sequence</span><br><span class=\"d\">And producing perfect output the whole time. Caught only because a test asserted on elapsed time rather than on the result.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The QR codes rendered as perfectly sized blank squares</span><br><span class=\"d\">Right dimensions, right position, nothing inside. No assertion about the markup would have caught it, so the test now scans the code back with a barcode reader.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">A narrator that changed 9% of the words and passed every check</span><br><span class=\"d\">Correcting one failure produced its exact opposite. The first Sage voice inverted nearly every sentence into something you had to read twice. The fix came back 91% identical to the plain text: it validated perfectly and was pointless on stage. The Admiral landed at 58% of fields rewritten and is now at 100%. Three worked examples per character fixed both, showing one real sentence too weak, right, and too far. The answer to fear is never the obviously wrong one. It is the one that looks exactly right.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Take the whole thing</div><div class=\"b\">The principles above, each with the code that implements it and the defect it caught, plus how to run this format yourself: read RUN-THIS-YOURSELF.md. The runbooks, the tool, the brief and every transcript are public too. Scan any screen, or go to <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHDmT4Bn2uYL2ua1mclrM5O/oW1em5m81jZfMDN5rW1ea5u/YW 6h1M34,36h1M35,36h1M36,36h1\" stroke=\"#000\" stroke-width=\"1\" fill=\"none\"/></svg>"};            // screen id -> inline SVG, one per screen, not per voice
const FOLLOW_URL = "https://atpconnect.github.io/atp-ai-bad-feeling/closeout/presentation.html";
const DEMO_NOTICE = "";
let i = 0;
let voice = "straight";
const el = id => document.getElementById(id);
const screens = () => DECKS[voice] || DECKS.straight;

// Themes are applied by setting the CSS variables, so one object drives the whole
// look of a screen and nothing about the layout knows which station it is on.
const VARS = {surface: "--bg", fill: "--fill", line: "--line", ink: "--ink",
              ink2: "--ink-2", ink3: "--ink-3", accent: "--brand", warn: "--warn",
              warnbg: "--warnbg", bg: "--page"};
function themeFor(id) { return THEMES[id] || DEFAULT_THEME; }
function applyTheme(id) {
  const t = themeFor(id), st = document.documentElement.style;
  for (const k in VARS) st.setProperty(VARS[k], t[k]);
}
function themeVars(id) {  // inline form, for the print view where each page differs
  const t = themeFor(id);
  return Object.keys(VARS).map(k => VARS[k] + ":" + t[k]).join(";");
}

const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };

let scale = parseFloat(load("atp-scale", "")) || 0;
let presenting = load("atp-presenting", "0") === "1";

function applyMode() {
  document.documentElement.classList.toggle("presenting", presenting);
  // A saved nudge only means anything for the mode it was set in.
  document.documentElement.style.setProperty("--s", scale || (presenting ? 2 : 1));
  store("atp-presenting", presenting ? "1" : "0");
  autofit();
}

// Shrink until the screen fits the screen. A projector cannot scroll, and the takeaway
// is the last thing on every slide, so anything that overflows takes the line for the
// room with it. Skipped the moment the presenter nudges the size by hand: at that point
// they are standing in the room and know better than this does.
function autofit() {
  if (!presenting || scale) return;
  const root = document.documentElement;
  let s = 2;
  root.style.setProperty("--s", s);
  while (s > 1.15 && root.scrollHeight > window.innerHeight) {
    s = Math.round((s - 0.05) * 100) / 100;
    root.style.setProperty("--s", s);
  }
}
function nudge(delta) {
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--s")) || 1;
  scale = Math.min(5, Math.max(0.6, Math.round((cur + delta) * 20) / 20));
  store("atp-scale", scale);
  applyMode();
}

function setVoice(v) {
  if (!DECKS[v]) return;
  voice = v;
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.classList.toggle("on", b.dataset.voice === v));
  render();
}

function render() {
  const SCREENS = screens();
  const s = SCREENS[i];
  applyTheme(s.id);
  if (DEMO_NOTICE) { el("demobar").hidden = false; el("demobar").innerHTML = DEMO_NOTICE; }
  el("kicker").textContent = s.kicker.toUpperCase();
  el("count").textContent = (i + 1) + " / " + SCREENS.length;
  el("title").textContent = s.title;
  el("body").innerHTML = s.body;
  el("takeaway").textContent = s.takeaway;

  const rail = el("rail");
  rail.innerHTML = "";
  SCREENS.forEach((sc, n) => {
    const seg = document.createElement("span");
    seg.title = (n + 1) + ". " + sc.title;
    seg.className = n === i ? "now" : n < i ? "done" : "";
    seg.onclick = () => { i = n; render(); };
    rail.appendChild(seg);
  });

  if (FOLLOW_URL) {
    el("follow").hidden = false;
    el("followQr").innerHTML = QRS[s.id] || "";
    el("followUrl").textContent = FOLLOW_URL + "#" + s.id;
  }
  // The address bar always points at the screen on show, so the presenter's own URL
  // is shareable mid-talk and a scanned deep link lands on the right slide.
  try { history.replaceState(null, "", "#" + s.id); } catch (e) {}
  autofit();

  el("prev").disabled = i === 0;
  el("next").disabled = i === SCREENS.length - 1;
  const unvoiced = UNVOICED.indexOf(s.id) !== -1;
  const label = (VOICES.find(v => v[0] === voice) || ["", ""])[1];
  el("voiceHint").textContent =
    unvoiced ? "this screen is ours, so it stays straight"
             : "keys 1-" + VOICES.length + ", V to cycle, P to project, D for detail";

  // Say plainly why nothing changed, on the screen where nothing changed.
  const note = el("voicenote");
  if (unvoiced && voice !== "straight") {
    note.hidden = false;
    note.innerHTML = "<b>" + label + " is not narrating this screen.</b> The screens about " +
      "how this was built are ours, not the model's, so they stay in one voice. " +
      "Move to any station screen and " + label + " takes over.";
  } else {
    note.hidden = true;
  }
  // Dim the buttons here too, so the control looks as inert as it is.
  document.querySelectorAll("#voiceButtons button").forEach(b => {
    b.style.opacity = unvoiced && b.dataset.voice !== "straight" ? "0.45" : "";
  });
  window.scrollTo(0, 0);
}
el("prev").onclick = () => { i = Math.max(0, i - 1); render(); };
el("next").onclick = () => { i = Math.min(screens().length - 1, i + 1); render(); };

if (VOICES.length > 1) {
  el("voices").hidden = false;
  el("voiceButtons").innerHTML = VOICES.map(([k, label]) =>
    '<button data-voice="' + k + '">' + label + '</button>').join(" ");
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.onclick = () => setVoice(b.dataset.voice));
}

document.onkeydown = ev => {
  if (ev.key.toLowerCase() === "p") { presenting = !presenting; scale = 0; applyMode(); return; }
  if (ev.key.toLowerCase() === "d") {
    document.documentElement.classList.toggle("details");
    scale = 0; applyMode(); return;
  }
  if (ev.key === "+" || ev.key === "=") { nudge(0.1); return; }
  if (ev.key === "-" || ev.key === "_") { nudge(-0.1); return; }
  if (ev.key === "ArrowRight" || ev.key === " " || ev.key === "PageDown") el("next").click();
  if (ev.key === "ArrowLeft" || ev.key === "PageUp") el("prev").click();
  if (ev.key === "Home") { i = 0; render(); }
  if (ev.key === "End") { i = screens().length - 1; render(); }
  // Voice switching is meant to happen live, mid-sentence, without losing your place.
  if (VOICES.length > 1) {
    if (ev.key.toLowerCase() === "v") {
      const n = VOICES.findIndex(v => v[0] === voice);
      setVoice(VOICES[(n + 1) % VOICES.length][0]);
    }
    const d = parseInt(ev.key, 10);
    if (d >= 1 && d <= VOICES.length) setVoice(VOICES[d - 1][0]);
  }
};
function buildPrint() {
  const SCREENS = screens();
  el("printAll").innerHTML = SCREENS.map((s, n) =>
    '<div class="page" style="' + themeVars(s.id) + '">' +
    '<div class="topline"><span class="wordmark">ATP</span>' +
    '<span class="divider-v"></span><span class="kicker">' + s.kicker.toUpperCase() + '</span>' +
    '<span class="count">' + (n + 1) + ' / ' + SCREENS.length + '</span></div>' +
    '<h1>' + s.title + '</h1><div class="rule"></div>' + s.body +
    '<div class="takeaway"><div class="h">THE LINE FOR THE ROOM</div><div class="b">' +
    s.takeaway + '</div></div></div>').join("");
}
window.onbeforeprint = buildPrint;
if (location.hash === "#print") buildPrint();

// Deep link: land on the screen the QR pointed at.
function fromHash() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const n = screens().findIndex(s => s.id === id);
  if (n >= 0) i = n;
}
fromHash();
window.addEventListener("hashchange", () => { fromHash(); render(); });
window.addEventListener("resize", autofit);

applyMode();
render();
</script>
</body>
