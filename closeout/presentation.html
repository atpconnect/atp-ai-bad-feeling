<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>The Throne Room, ATP September 17, 2026 (pre-seeded)</title>
<style>
  :root {
    /* Everything sizes off --fs so presentation mode is one number, not a restyle.
       --s is nudged live with + and - because the only way to know what reads from
       the back of a particular room is to stand in it. */
    --base-fs: 15px;
    --s: 1;
    --fs: calc(var(--base-fs) * var(--s));
    --maxw: 940px;
    --qrw: 92px;
    /* Set per screen from THEMES. The defaults here are the method-screen palette. */
    --brand: #2C6FBF;
    --page: #f5f7f8;
    --warnbg: #fdf6ee;
    --warn: #B4610C;
    --ink: #14181a;
    --ink-2: #4a5257;
    --ink-3: #697276;
    --line: #e3e7e9;
    --fill: #f5f7f8;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page); color: var(--ink);
    transition: background 320ms ease, color 200ms ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: var(--fs); line-height: 1.5;
  }
  /* Presentation mode is one number. Everything sizes off --fs, so doubling --s
     doubles the whole deck rather than restyling it screen by screen. */
  :root.presenting { --s: 2; --maxw: 1760px; }
  :root.presenting .shell { padding: 12px 16px 20px; }
  :root.presenting .stage { padding: 20px 26px 18px; }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.55); }
  :root.presenting .lede { margin-bottom: calc(var(--fs) * 0.7); }
  :root.presenting .rule { margin: 10px 0 16px; }
  :root.presenting .takeaway { margin-top: calc(var(--fs) * 0.7); }
  /* Headline big, detail a step down. On a projector the headline is what carries the
     room and the detail is what the phone is for. */
  /* The projector shows headlines. The phone shows the detail.

     This is not a compromise, it is the measurement: five headlines each followed by
     two lines of detail needs 1458px of a 993px screen at readable type, so something
     has to go, and it should be the thing nobody reads off a wall in a bar. Headlines
     plus the takeaway is a slide. Headlines plus 400 characters of detail is a document
     being projected at people. Press D to reveal the detail on any screen. */
  :root.presenting ol.points .d { display: none; }
  :root.presenting.details ol.points .d { display: block; font-size: calc(var(--fs) * .72); }
  :root.presenting ol.points .t { font-size: calc(var(--fs) * 1.05); }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.42); }
  /* Big enough to scan from the back of the room, which is the only size that counts.
     A QR only the front two rows can reach is decoration. */
  :root.presenting { --qrw: calc(var(--fs) * 6.4); }
  :root.presenting .head { gap: calc(var(--fs) * 1.1); }
  .shell { max-width: var(--maxw); margin: 0 auto; padding: 28px 24px 64px; }
  .stage { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 34px 38px 30px;
           box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 14px 44px rgba(0,0,0,.12); }

  .rail { display: flex; gap: 4px; margin-bottom: 22px; }
  .rail span { flex: 1; height: 3px; background: var(--line); cursor: pointer; }
  .rail span.done { background: var(--ink-3); }
  .rail span.now { background: var(--brand); }

  /* Several elements here carry a display rule and are toggled with the hidden
     attribute, which a bare display wins against. Without this an unsponsored
     station renders a src-less img: a broken-image icon and its alt text. */
  [hidden] { display: none !important; }

  /* The QR rides in the top right corner, beside the title rather than below the
     takeaway. At the foot of the card it was the last thing on the screen and the
     first thing the room's eye skipped; up here it is next to the only other thing
     anyone is looking at. The header is two columns so the QR can never overlap a
     long title, whatever the auto-fit does to the type size. */
  .head { display: flex; align-items: flex-start; gap: 22px; }
  .headmain { flex: 1; min-width: 0; }

  .topline { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .wordmark { color: var(--brand); font-weight: 800; letter-spacing: .18em; font-size: calc(var(--fs) * .8); }
  .divider-v { width: 1px; height: 12px; background: var(--line); }
  .kicker { font-size: calc(var(--fs) * .8); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }

  h1 { font-size: calc(var(--fs) * 1.6); line-height: 1.25; margin: 4px 0 0; font-weight: 650; }
  .rule { width: 48px; height: 2px; background: var(--brand); margin: 12px 0 24px; }
  p { margin: 0 0 12px; }
  .lede { font-size: calc(var(--fs) * 1.07); margin-bottom: 20px; }

  ol.points { list-style: none; margin: 0; padding: 0; }
  ol.points li { display: flex; gap: 14px; margin-bottom: 15px; }
  ol.points .n { color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; min-width: calc(var(--fs) * 1.35); }
  ol.points .t { font-weight: 600; }
  ol.points .d { color: var(--ink-2); }

  .pill { display: inline-block; font-size: calc(var(--fs) * .7); letter-spacing: .07em; font-weight: 700;
          color: var(--brand); border: 1px solid var(--brand); border-radius: 3px;
          padding: 1px 6px; vertical-align: 2px; margin-left: 4px; }
  .pill.warn { color: var(--warn); border-color: var(--warn); }

  .flag { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
          color: var(--ink-2); padding: 11px 14px; border-radius: 4px; margin-bottom: 18px; font-size: calc(var(--fs) * .93); }
  .flag b { color: var(--warn); }

  .callout { border: 1px solid var(--line); border-left: 3px solid var(--brand); background: var(--fill);
             padding: 12px 14px; border-radius: 4px; margin-top: 20px; }
  .callout .h { font-weight: 650; margin-bottom: 4px; }
  .callout .b { color: var(--ink-2); }
  .qr { display: block; width: 132px; height: 132px; margin: 12px 0 2px; image-rendering: pixelated; }

  .takeaway { border-left: 3px solid var(--brand); background: var(--fill); padding: 10px 14px; margin-top: 24px; }
  .takeaway .h { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-bottom: 3px; }
  .takeaway .b { font-weight: 600; }

  .nav { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  button { font: inherit; font-size: calc(var(--fs) * .87); padding: 6px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--fill); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  .nav .right { margin-left: auto; font-size: calc(var(--fs) * .8); color: var(--ink-3); }

  .voices { display: flex; align-items: center; gap: 6px; margin-top: 14px;
            padding-top: 14px; border-top: 1px solid var(--line); }
  .voices .lab { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-right: 4px; }
  .voices button { font-size: calc(var(--fs) * .8); padding: 4px 10px; }
  .voices button.on { background: var(--brand); color: var(--bg); border-color: var(--brand); }
  /* Demo builds carry this on every screen, not just the first. A page of invented
     people and invented numbers sitting at a public URL has to say so wherever the
     reader happens to land, including on a deep link straight into station four. */
  /* Selecting a narrator on a screen that never changes voice used to do nothing at
     all, with the only explanation in small grey type at the far edge of the voice
     bar. The deck opens on one of those screens, so the first thing anyone tried
     looked broken. Say it where they are looking. */
  .voicenote { border-left: 3px solid var(--brand); background: var(--fill);
               padding: 9px 13px; border-radius: 4px; margin-bottom: 18px;
               font-size: calc(var(--fs) * .85); color: var(--ink-2); }
  .voicenote b { color: var(--ink); }

  .demobar { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
             color: var(--ink-2); padding: 9px 13px; border-radius: 4px;
             margin-bottom: 16px; font-size: calc(var(--fs) * .8); }
  .demobar b { color: var(--warn); }

  /* Sponsor logo sits left of the code, matched to its height. It carries no caption
     for the same reason the QR does not: a label under a logo in the corner of a slide
     is read by nobody, and the two of them together are already the only things up
     there that are not the title. */
  .corner { flex: none; display: flex; align-items: center; gap: calc(var(--qrw) * .22); }
  /* On the dark themes the sponsor asset is a white plate rather than inverted ink,
     so it gets the same rounded corner as the QR and the two read as a deliberate
     pair of cards instead of one logo and one rectangle. */
  .sponsor { height: var(--qrw); width: auto; max-width: calc(var(--qrw) * 2.1);
             object-fit: contain; display: block; border-radius: 3px; }
  .follow { flex: none; display: block; }
  .followqr { width: var(--qrw); aspect-ratio: 1 / 1; flex: none; display: block;
              background: #fff; padding: 4px; border-radius: 3px; }
  /* The URL is the no-qrencode fallback, so it only shows when there is no QR to
     scan. In the corner a full URL would be taller than the code it replaces. */
  .follow .u { display: none; }
  .follow.noqr { max-width: calc(var(--fs) * 13); }
  .follow.noqr .u { display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: calc(var(--fs) * .72); color: var(--ink-3); word-break: break-all; }

  .voices .hint { margin-left: auto; font-size: calc(var(--fs) * .77); color: var(--ink-3); }

  #printAll { display: none; }
  @media print {
    body { background: #fff; --page: #fff; }
    .rail, .nav, .stage { display: none !important; }
    .shell { max-width: none; padding: 0; }
    #printAll { display: block; }
    #printAll .page { page-break-after: always; padding: 0 0 24px; }
    #printAll .page:last-child { page-break-after: auto; }
  }
</style>

<script>

const DECKS = {
 "straight": [
  {
   "id": "method",
   "kicker": "How this was made",
   "title": "Five rooms, one picture, ten minutes",
   "takeaway": "The AI did the reading. Everything that had one correct answer was done by code.",
   "body": "<p class=\"lede\">Five stations ran in parallel. Nobody was in more than one of them. This deck existed before the last one finished talking.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Every station was recorded to its own meeting, hosted by one person</span><br><span class=\"d\">Not by the pilot running the room. One account owned all five, so no session depended on a presenter remembering to press a button correctly.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Ending the meeting is what starts the transcript</span><br><span class=\"d\">Teams generates a transcript 2.5 to 5 minutes after a meeting is ended, not left. Five staggered endings, then one to three minutes for the model to read every word said in this building and answer. That is the budget you just watched us spend, and every number in it was measured in rehearsal.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model was given the transcripts and a written brief, and asked for data</span><br><span class=\"d\">Not for a deck. It returns structured content, which is checked against a schema before anything is rendered. Wrong shape, wrong station name, too many bullets: rejected, and the previous deck stands.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The slides you are looking at were generated by code, not by the model</span><br><span class=\"d\">Order, branding, navigation, this screen, the QR code: all deterministic. The model only wrote the parts that needed judgment about what was said.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Two models ran at once, and it was not a race</span><br><span class=\"d\">A fast standby answered the same question in parallel. The good model got the whole deadline to itself and the standby was only used if it missed. Measured on the night's transcripts: 81 seconds against 167. A race would have handed you the weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy was built <b>before the stations ran</b>, from the question lists and the answers we expected to hear. It is the floor, not the deck: if every recording in the building had failed, this is what you would be looking at, and it would say so on every screen. Written by the primary model. Generated 2026-09-16 13:32.</div></div>"
  },
  {
   "id": "reliability",
   "kicker": "The transferable part",
   "title": "Why this worked when your AI program did not",
   "takeaway": "Give the model the judgment call. Never give it anything you could check by machine instead.",
   "body": "<p class=\"lede\">Nothing here needed a better model. It needed the unglamorous things around the model to be decided in advance, and every one of them is a thing your program can do on Monday.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Deterministic wherever determinism is available</span><br><span class=\"d\">The model wrote the words. Code decided the running order, the branding, which stations are flagged, the navigation, the QR, and this sentence. A model that cannot choose the running order cannot get the running order wrong. Shrink what it is allowed to decide and you shrink what a human has to check at 7:50pm.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Never ask a model a question you can already answer</span><br><span class=\"d\">Which stations produced a real recording is a fact sitting on a disk. The deck reads it from there and throws away whatever the model says about it. That closed a real hole: a model that relabelled a failed station as a real one silently deleted the warning built to catch exactly that.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Constrain the output until it can be validated</span><br><span class=\"d\">It returns JSON against a fixed schema, not slides. Unknown station, missing station, too many bullets: rejected, and the deck already on disk stands untouched. You cannot check free text. You can check a schema.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Write the evals before the night, and test the disasters</span><br><span class=\"d\">137 automated checks across 24 rehearsals of this evening, including no transcript at all, prose instead of JSON, a crashed CLI, a transcript arriving late, and a narrator quietly dropping the numbers. The happy path is the least useful thing you can test.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Score the things you would otherwise argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"
  },
  {
   "id": "sky-city",
   "kicker": "Sky City",
   "title": "Infrastructure and integration with third-party tools",
   "takeaway": "Every clause on the refuse-to-sign list, version pinning at your tier, a written definition of a seat, dedicated rate limits, notice before a model changes, is a sentence somebody pays for by learning it too late.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Sky City was built to open the gap between an AI vendor's sales demo and the same product running inside a real enterprise: the contract numbers, the changes made without asking, and the assumptions a tool makes about identity and access before it ever touches your data. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A seat is whatever the contract says a seat is</span><br><span class=\"d\">The station is built around contract numbers that turn out to mean something else in production. The worked example: a buyer sized for four hundred logins and billed against roughly nineteen thousand, because the contract defines a seat as any individual whose data the service processes in a billing period. The match to it is a rate limit written as sixty requests a second of yours that is actually a regional pool, thinnest on the first Monday of the month when every other customer runs month end.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The vendor changes the product and nobody tells you</span><br><span class=\"d\">Unannounced change is the integration risk this station was set up to surface: a model rolled forward on a tier mid-week so summaries got shorter and started dropping callback commitments, a forty-five day deprecation notice sent to a shared mailbox owned by someone who left in March, and inference moved to multi-region for latency and out of the region Legal had been promised. In each case the discovery is a changelog entry or a human reading samples, days or weeks late.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Identity, not the model, is where the months go</span><br><span class=\"d\">Of the four assumptions the station asks about, identity, network, data access, and who may call it, identity is the expected largest pile: a tool that wants a flat user list meeting role-based, region-scoped permissions with two settings, on and off, and four months spent building a permissions proxy in front of a product already paid for. Expected time from signing to anything real in production runs four to nineteen months against six weeks to first value at the sale.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Exit cost is mostly not in the contract</span><br><span class=\"d\">Sky City was set up to price the walk-away, and the expected numbers sit in two places. A documented export of your own extracted data comes in at a services engagement of about eighty-five thousand dollars and ten weeks, because the export is in the contract and the format is not. The larger cost is three hundred and ten supervisors who have rebuilt their working day around the tool. Retraining is the real switching cost and it appears in no agreement anywhere.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The abstraction layer argument has no settled answer</span><br><span class=\"d\">The station stages a genuine disagreement and both sides hold. A thin internal gateway, two engineers, three months, made a provider swap a two-week job at almost no cost. Another built at the same time became its own product with a backlog and an on-call rotation, hedging a switch that has not happened and billing for it every sprint. The middle position in the material is to abstract the data going in and the review step coming out, and leave the model alone.</span></span></li></ol>"
  },
  {
   "id": "swamp-planet",
   "kicker": "Swamp Planet",
   "title": "Technical debt and data quality",
   "takeaway": "Profile the data before you promise anyone a date, and get the four people who disagree about your main entity into one room before anybody builds a thing.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Swamp Planet was set up to establish what actually happens when an AI system is pointed at enterprise data for the first time, and the expected answer is that most of the project turns into data work that was never scoped, never budgeted, and never owned. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">The data problem is usually a disagreement problem</span><br><span class=\"d\">The sharpest thing this station is built to surface is definitional, not technical: four definitions of an active customer across three systems, each correct for the team that owns it, unresolved for nine years because nothing ever forced the question. Next to it, a status field documented with fourteen values and holding just over sixty in production, free text since 2019, half of them typos of the other half, with every report quietly wrong at the edges because each consumer built its own filter.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Nobody can draw where the data goes</span><br><span class=\"d\">The station asks who could map their data flow start to finish right now, and the expected answer is close to nobody, with the one raised hand belonging to someone who drew it after an incident and already knows two systems on it are wrong. The consequences are specific: no pipeline gets touched without hand-tracing it first, vendors ask what the data looks like and get no answer, and half the roadmap assumes data lives in one place, known by everyone building it and unsaid where it gets approved.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Seventy to ninety percent becomes cleanup, and none of it was budgeted</span><br><span class=\"d\">Expected answers to how much of the AI project turned into a data cleanup project run from forty percent to all of it, clustering in the seventies and eighties. The low number belongs to a company that had already done an eighteen-month warehouse migration for unrelated reasons and paid for it on a different budget. The harder version is a cleanup that needed decisions from four departments that could not be got into one room, and a board already told the data was ready on a vendor's assessment.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The workaround outlives the deadline and then blocks the fix</span><br><span class=\"d\">Nearly everyone in this station was expected to have built around the data rather than fixed it. The case the material turns on is an eleven-hundred-row mapping table maintained by hand in a spreadsheet that syncs to a database nightly, now sitting in a process that touches revenue. It costs one analyst permanently, it fails silently for a week when something new arrives while they are away, and it has made the underlying data harder to fix, because unwinding the exceptions is its own unfunded project.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">A wrong answer does not page anybody</span><br><span class=\"d\">The station closes on confidently wrong output, and the framing it exists to land is that an outage wakes somebody and a wrong answer wakes nobody. The worked case is an assistant telling a customer a contract end date eleven months off, read from a table that stopped being updated at a billing system change. Nothing was down, nothing was slow, nothing threw an error. The only detection that works in the expected answers is boring sampling, two hundred outputs a week, read and scored by a person.</span></span></li></ol>"
  },
  {
   "id": "ice-planet",
   "kicker": "Ice Planet",
   "title": "Use cases, costs, and scope creep",
   "takeaway": "Nothing on the list of what would have to be true to ship next quarter is a better model. It is a named production owner, a support model, a decision date, and operating budget approved alongside the build budget.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Ice Planet was built around arithmetic: how many AI use cases a company has started against how many are actually live, what the stalled ones cost every month nobody cancels them, and what the bill looks like once real users arrive. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A hundred and forty-seven launches, nineteen landings</span><br><span class=\"d\">The station opens by totalling started use cases against production ones, and the expected tally for a room this size is roughly a hundred and forty-seven begun and about nineteen running, one of which is a pilot serving real customers without ever having been promoted. The counterexample built into the material is a company with four use cases and all four live, because it has a rule that you cannot start a fifth until one of the four lands.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Projects do not get cancelled, they get quiet</span><br><span class=\"d\">Asked why a use case stalls, the largest expected pile is not budget, data, or Legal, it is that nobody ever actually decided. The pilot ends, the team moves to the next thing, no meeting declares it finished or dead, and two years later it is still on a slide. The companion mechanism is the handoff, where the platform team's answer is not no but not in this year's plan, which is a no that nobody has to own or defend.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The stalled project is still billing you</span><br><span class=\"d\">The station was set up to put real numbers on uncancelled work: about six thousand dollars a month in dev and test environments nobody turned off, a platform contract at two hundred and forty thousand a year with eleven months left and nine pilot users on it, and three people at ten percent allocation who are neither on it nor fully off anything else. None of it shows up as a line item anyone reviews, which is precisely why it survives.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The overrun is people and seats, not tokens</span><br><span class=\"d\">Expected multiples against the pilot estimate run three to eleven times, with the eleven attached to eleven times the volume and roughly flat per transaction. The surprise lines are two and a half permanent reviewers on a regulated workflow, a seat count moving from sixty to eleven hundred in five months, and re-embedding plus the eval engineering nobody had a budget line for. Token price was expected to move the other way, down, twice.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">What sticks is boring, owned, and measured against a number agreed first</span><br><span class=\"d\">The use cases expected to have shipped and stayed are routing inbound email for one shared mailbox, handle time from about nine minutes to five and a half, and drafting the first response in a support queue with a person approving every one. The shared features are one workflow, one team, a named business owner who wanted it, and a metric agreed before the build. The disagreement the station stages is whether forty people who would fight to keep a tool counts as payoff without a number.</span></span></li></ol>"
  },
  {
   "id": "snow-monster-cave",
   "kicker": "Snow Monster Cave",
   "title": "Development",
   "takeaway": "The integration is an afternoon and the eval set is a month. Put the prompt in source control on day one, write the on-call plan before launch, and decide now what you do about the answers that already went out.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Snow Monster Cave was built to look inside the build itself: what tested means for an AI feature, who is really carrying the pager at two in the morning, where the prompt lives, and what a rollback actually restores. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Tested means whatever the calendar allowed</span><br><span class=\"d\">The station opens on what tested meant for the last AI feature shipped, and the expected range runs from vibes, through forty examples in a spreadsheet the product manager wrote and one engineer reading outputs for an afternoon, to three hundred golden cases that are all happy path with nothing adversarial, nothing empty, and nothing in the wrong language. The answer to who decided that was enough is that nobody did. There was a launch date before there was a test plan.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The tests pass because nothing in your repository moved</span><br><span class=\"d\">This station was set up around changes that clear every test and still break behaviour. A prompt tightened for shorter answers quietly dropped a required disclaimer, because the disclaimer was the longest sentence, and a quality lead reading tickets found it nine days on. A retrieval rebuild passed every eval because the evals ran against a cached index from before the rebuild. And a vendor-side change breaks production while the suite stays green, because nothing local changed at all.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">On-call is a mobile number typed into a runbook at launch</span><br><span class=\"d\">Formal rotations for AI features were expected to be rare, three out of about twenty-five, with the real arrangement being the two people who built it. The escalation path is an alert to a platform on-call who does not know what the system does, messaging the builder and hoping. The two a.m. case the station turns on is a backed-up queue fixable only from a vendor console, one login, held by someone asleep who volunteered to build a prototype and never renegotiated that.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Usage dashboards go green while the outcome gets worse</span><br><span class=\"d\">The station pushes past adoption to whose scorecard the outcome sits on, and the expected answer is nobody's, it is on a slide. Active users, adoption, and queries per day were all expected to climb through roughly two months of the actual outcome degrading unnoticed. Where an outcome did reach a reviewed scorecard, the reason is that Finance owns the process it touches and reviews everything quarterly whether you want it reviewed or not.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">You can roll back the system, not the answers it already gave</span><br><span class=\"d\">Expected rollback stories all stop short of a clean restore. A prompt reverted in four minutes, but to behaviour that was close rather than identical, because the weights underneath had moved. An apparently successful rollback undone by embeddings already regenerated with the new model. Forty minutes to roll back, thirty-nine of them spent finding where the prompt lived. And four thousand answers already sitting in inboxes, tickets, and decisions, with no incident process that has a step for them.</span></span></li></ol>"
  },
  {
   "id": "asteroid-field",
   "kicker": "Asteroid Field",
   "title": "Compliance, legal, and security",
   "takeaway": "The pressure is arriving from customers and cyber insurers ahead of regulators, and a review that shows up at the end costs four months and two hundred thousand dollars more than the same review in week one.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Asteroid Field was built around the questions Legal asks that nobody can answer, what a security or compliance review actually catches and what it misses, and what employees are already doing with AI tools while the review runs. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">The unanswerable questions are the ones that decide everything</span><br><span class=\"d\">The station opens by collecting what Legal asked that could not be answered: what the model was trained on, whether a deletion request reaches the model, whether a single output can be explained to a regulator in plain language, whether this is a decision or a recommendation, who is liable when it is wrong, and what the retention obligation is for a prompt. The expected answer on deletion is three vendors and three ways of saying no. The one that got answered was decision versus recommendation, by changing the product so a person presses a button.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Five nobody yets out of nine</span><br><span class=\"d\">Asked who signs off that an AI decision or vendor is safe enough to put in front of a customer, the expected answer is a vacuum. Five of nine name nobody yet. The other four name someone who did not want the job: a CISO who signs the vendor but not the decision, Legal who signs the contract but not the output, a risk committee that meets monthly and so functionally means nobody for four weeks, and a CIO who has said out loud that it should not be the CIO. That vacuum stalls more work than any technical limit.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Security review was written for software that ships in versions</span><br><span class=\"d\">Running an AI vendor through normal process was expected to produce three outcomes, all bad. Stalled: seven months, a hundred and eighty questions, about forty with no meaningful answer for a service whose behaviour changes without a release. Passed and should not have: an inherited cloud certification, plus a contract that lets the vendor add a subprocessor with notice, where notice is a page on their website. Passed properly in five weeks only because the AI product was a new module on a contract from 2021.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Blocking it moved it to phones</span><br><span class=\"d\">Where companies looked at what staff were actually pasting in, the expected findings are thirty-four distinct AI tools in use with three approved, and DLP hits on customer contracts, source code, and a board deck pasted by somebody senior enough that nobody wanted to write the incident report. The comparison the station stages is blocking, with domain rules and DLP, which pushed the same data onto personal phones and out of sight, against one sanctioned enterprise tool that cut unapproved use by about eighty percent in two months.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Solving one compliance problem by creating another</span><br><span class=\"d\">What has to be added after the fact was expected to be audit logs, security controls, human review, and explainability, roughly in that order. The case the station turns on is logging prompts and outputs so you can answer what the system did, then finding out six weeks later that you now retain a complete, discoverable record of everything every employee has ever asked, indefinitely. Human review lands as two and a half permanent people who invert the business case and are still the right call.</span></span></li></ol>"
  },

   "id": "patterns",
   "kicker": "Across all five",
   "title": "What nobody in one room could see",
   "takeaway": "Across all five stations, not one answer to what went wrong was the model, which is the finding: when your AI program has a bad feeling about this, it is about who owns the decision, whether anyone can see a quiet failure, and who is permanently in the loop.",
   "body": "<p class=\"lede\">Nobody has said any of this yet. These are the patterns we expect to connect the five stations, written in advance. The real ones get written on the night, from what the rooms actually say.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Nobody signs, so nothing moves</span><br><span class=\"d\">The missing decision has the same shape in four stations. Ice Planet expects nobody ever actually decided to be the single biggest reason a use case stalls. Asteroid Field expects five of nine to say nobody signs off on an AI output. Snow Monster Cave expects the outcome metric to live on a slide rather than anybody's scorecard. Swamp Planet expects the worst data to have no owner at all. Not one of these is a technology problem, and not one of them is on anybody's plate.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The quiet failure has no alarm</span><br><span class=\"d\">Every station separates being down from being wrong. Swamp Planet: a customer told a contract date eleven months off, with nothing alerting because nothing was broken. Snow Monster Cave: a dropped disclaimer found nine days later by a person reading tickets. Sky City: a model rolled forward by the vendor, caught nine days on by a supervisor who samples output weekly. The detection is always a human reading samples, because twenty years of alerting was built for the loud failure.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The real cost is people, and it is permanent</span><br><span class=\"d\">Ice Planet expects the pilot-to-production overrun to be two and a half permanent reviewers and a seat count going from sixty to eleven hundred, not tokens, which came down twice. Asteroid Field expects the same two and a half reviewers arriving as a compliance requirement that turns the business case upside down. Swamp Planet expects one analyst permanently maintaining eleven hundred hand-written exceptions. Sky City expects retraining three hundred and ten supervisors to be the exit cost in no contract.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Something outside your repository changes and you find out late</span><br><span class=\"d\">Sky City expects vendors to move models, endpoints, and processing regions on a changelog entry. Snow Monster Cave expects the test suite to stay green because nothing local moved. Asteroid Field expects a signed contract that permits a new subprocessor with notice posted on a web page. Swamp Planet expects a partner integration to silently stop loading rows after a column rename, discovered when they call about their own missing revenue. The thing you reviewed is not the thing running.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The work nobody funds is the work everything else rests on</span><br><span class=\"d\">Swamp Planet expects seventy to ninety percent of an AI project to become unbudgeted data cleanup, and expects drawing the data map to stay unfunded precisely because it would kill three projects currently in flight. Snow Monster Cave expects the eval set to take a month against an afternoon for the integration, with eval skill the biggest gap still open. Ice Planet expects fifty thousand dollars to be better spent on a real test set or on the reviewers than on the feature itself.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Across all five stations, not one answer to what went wrong was the model, which is the finding: when your AI program has a bad feeling about this, it is about who owns the decision, whether anyone can see a quiet failure, and who is permanently in the loop.</div><div class=\"b\">Everything behind this deck, including the station transcripts and the tool that built it, is at <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>. Take it and run this at your own company.</div><img class=\"qr\" alt=\"QR code to https://g    "takeaway": "Every one of these was found by running the thing. Not one was found by reading it.",
   "body": "<p class=\"lede\">This is an AI program too, so it had a bad feeling about itself. Six defects, all of them from rehearsal, none of them from review.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A bug that would have failed live, in this room, tonight</span><br><span class=\"d\">The prompt was passed as a shell argument. Linux caps a single argument at 128KB and five real transcripts come to 285KB, so it worked in every small test and would have died the moment it saw the real thing, with everyone sitting here.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model could quietly promote a failed station to a real one</span><br><span class=\"d\">Which deleted the on-screen warning that exists to prevent precisely that. Not fixed with a better prompt. Fixed by never asking.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A 26-character overrun threw away an entire run</span><br><span class=\"d\">Validation could not tell the difference between output that was wrong and output that was merely too long. Now it can: one rejects, the other gets trimmed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Two models running in parallel were running in sequence</span><br><span class=\"d\">And producing perfect output the whole time. Caught only because a test asserted on elapsed time rather than on the result.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The QR codes rendered as perfectly sized blank squares</span><br><span class=\"d\">Right dimensions, right position, nothing inside. No assertion about the markup would have caught it, so the test now scans the code back with a barcode reader.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">A narrator that changed 9% of the words and passed every check</span><br><span class=\"d\">Correcting one failure produced its exact opposite. The first Sage voice inverted nearly every sentence into something you had to read twice. The fix came back 91% identical to the plain text: it validated perfectly and was pointless on stage. The Admiral landed at 58% of fields rewritten and is now at 100%. Three worked examples per character fixed both, showing one real sentence too weak, right, and too far. The answer to fear is never the obviously wrong one. It is the one that looks exactly right.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Take the whole thing</div><div class=\"b\">The principles above, each with the code that implements it and the defect it caught, plus how to run this format yourself: read RUN-THIS-YOURSELF.md. The runbooks, the tool, the brief and every transcript are public too. Scan any screen, or go to <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHDmT4Bn2uYL2ua1mclrM5O/oW1em5m81jZfMDN5rW1ea5u/YW const FOLLOW_URL = "https://atpconnect.github.io/atp-ai-bad-feeling/closeout/presentation.html";
const DEMO_NOTICE = "";
let i = 0;
let voice = "straight";
const el = id => document.getElementById(id);
const screens = () => DECKS[voice] || DECKS.straight;

// Themes are applied by setting the CSS variables, so one object drives the whole
// look of a screen and nothing about the layout knows which station it is on.
const VARS = {surface: "--bg", fill: "--fill", line: "--line", ink: "--ink",
              ink2: "--ink-2", ink3: "--ink-3", accent: "--brand", warn: "--warn",
              warnbg: "--warnbg", bg: "--page"};
function themeFor(id) { return THEMES[id] || DEFAULT_THEME; }
function applyTheme(id) {
  const t = themeFor(id), st = document.documentElement.style;
  for (const k in VARS) st.setProperty(VARS[k], t[k]);
}
function themeVars(id) {  // inline form, for the print view where each page differs
  const t = themeFor(id);
  return Object.keys(VARS).map(k => VARS[k] + ":" + t[k]).join(";");
}

const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };

let scale = parseFloat(load("atp-scale", "")) || 0;
let presenting = load("atp-presenting", "0") === "1";

function applyMode() {
  document.documentElement.classList.toggle("presenting", presenting);
  // A saved nudge only means anything for the mode it was set in.
  document.documentElement.style.setProperty("--s", scale || (presenting ? 2 : 1));
  store("atp-presenting", presenting ? "1" : "0");
  autofit();
}

// Shrink until the screen fits the screen. A projector cannot scroll, and the takeaway
// is the last thing on every slide, so anything that overflows takes the line for the
// room with it. Skipped the moment the presenter nudges the size by hand: at that point
// they are standing in the room and know better than this does.
function autofit() {
  if (!presenting || scale) return;
  const root = document.documentElement;
  let s = 2;
  root.style.setProperty("--s", s);
  while (s > 1.15 && root.scrollHeight > window.innerHeight) {
    s = Math.round((s - 0.05) * 100) / 100;
    root.style.setProperty("--s", s);
  }
}
function nudge(delta) {
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--s")) || 1;
  scale = Math.min(5, Math.max(0.6, Math.round((cur + delta) * 20) / 20));
  store("atp-scale", scale);
  applyMode();
}

function setVoice(v) {
  if (!DECKS[v]) return;
  voice = v;
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.classList.toggle("on", b.dataset.voice === v));
  render();
}

function render() {
  const SCREENS = screens();
  const s = SCREENS[i];
  applyTheme(s.id);
  if (DEMO_NOTICE) { el("demobar").hidden = false; el("demobar").innerHTML = DEMO_NOTICE; }
  el("kicker").textContent = s.kicker.toUpperCase();
  el("title").textContent = s.title;
  el("body").innerHTML = s.body;
  el("takeaway").textContent = s.takeaway;

  const rail = el("rail");
  rail.innerHTML = "";
  SCREENS.forEach((sc, n) => {
    const seg = document.createElement("span");
    seg.title = (n + 1) + ". " + sc.title;
    seg.className = n === i ? "now" : n < i ? "done" : "";
    seg.onclick = () => { i = n; render(); };
    rail.appendChild(seg);
  });

  if (FOLLOW_URL) {
    const qr = QRS[s.id] || "";
    el("follow").hidden = false;
    el("followQr").innerHTML = qr;
    el("followUrl").textContent = FOLLOW_URL + "#" + s.id;
    el("follow").classList.toggle("noqr", !qr);
  }
  const sponsor = SPONSORS[s.id];
  el("sponsor").hidden = !sponsor;
  if (sponsor) {
    el("sponsor").src = sponsor.src;
    el("sponsor").alt = sponsor.name + ", station sponsor";
  } else {
    el("sponsor").removeAttribute("src");
    el("sponsor").alt = "";
  }
  // The address bar always points at the screen on show, so the presenter's own URL
  // is shareable mid-talk and a scanned deep link lands on the right slide.
  try { history.replaceState(null, "", "#" + s.id); } catch (e) {}
  autofit();

  el("prev").disabled = i === 0;
  el("next").disabled = i === SCREENS.length - 1;
  const unvoiced = UNVOICED.indexOf(s.id) !== -1;
  const label = (VOICES.find(v => v[0] === voice) || ["", ""])[1];
  el("voiceHint").textContent =
    unvoiced ? "this screen is ours, so it stays straight"
             : "keys 1-" + VOICES.length + ", V to cycle, P to project, D for detail";

  // Say plainly why nothing changed, on the screen where nothing changed.
  const note = el("voicenote");
  if (unvoiced && voice !== "straight") {
    note.hidden = false;
    note.innerHTML = "<b>" + label + " is not narrating this screen.</b> The screens about " +
      "how this was built are ours, not the model's, so they stay in one voice. " +
      "Move to any station screen and " + label + " takes over.";
  } else {
    note.hidden = true;
  }
  // Dim the buttons here too, so the control looks as inert as it is.
  document.querySelectorAll("#voiceButtons button").forEach(b => {
    b.style.opacity = unvoiced && b.dataset.voice !== "straight" ? "0.45" : "";
  });
  window.scrollTo(0, 0);
}
el("prev").onclick = () => { i = Math.max(0, i - 1); render(); };
el("next").onclick = () => { i = Math.min(screens().length - 1, i + 1); render(); };

if (VOICES.length > 1) {
  el("voices").hidden = false;
  el("voiceButtons").innerHTML = VOICES.map(([k, label]) =>
    '<button data-voice="' + k + '">' + label + '</button>').join(" ");
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.onclick = () => setVoice(b.dataset.voice));
}

document.onkeydown = ev => {
  if (ev.key.toLowerCase() === "p") { presenting = !presenting; scale = 0; applyMode(); return; }
  if (ev.key.toLowerCase() === "d") {
    document.documentElement.classList.toggle("details");
    scale = 0; applyMode(); return;
  }
  if (ev.key === "+" || ev.key === "=") { nudge(0.1); return; }
  if (ev.key === "-" || ev.key === "_") { nudge(-0.1); return; }
  if (ev.key === "ArrowRight" || ev.key === " " || ev.key === "PageDown") el("next").click();
  if (ev.key === "ArrowLeft" || ev.key === "PageUp") el("prev").click();
  if (ev.key === "Home") { i = 0; render(); }
  if (ev.key === "End") { i = screens().length - 1; render(); }
  // Voice switching is meant to happen live, mid-sentence, without losing your place.
  if (VOICES.length > 1) {
    if (ev.key.toLowerCase() === "v") {
      const n = VOICES.findIndex(v => v[0] === voice);
      setVoice(VOICES[(n + 1) % VOICES.length][0]);
    }
    const d = parseInt(ev.key, 10);
    if (d >= 1 && d <= VOICES.length) setVoice(VOICES[d - 1][0]);
  }
};
function buildPrint() {
  const SCREENS = screens();
  el("printAll").innerHTML = SCREENS.map(s =>
    '<div class="page" style="' + themeVars(s.id) + '">' +
    '<div class="topline"><span class="wordmark">ATP</span>' +
    '<span class="divider-v"></span><span class="kicker">' + s.kicker.toUpperCase() + '</span></div>' +
    '<h1>' + s.title + '</h1><div class="rule"></div>' + s.body +
    '<div class="takeaway"><div class="h">THE LINE FOR THE ROOM</div><div class="b">' +
    s.takeaway + '</div></div></div>').join("");
}
window.onbeforeprint = buildPrint;
if (location.hash === "#print") buildPrint();

// Deep link: land on the screen the QR pointed at.
function fromHash() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const n = screens().findIndex(s => s.id === id);
  if (n >= 0) i = n;
}
fromHash();
window.addEventListener("hashchange", () => { fromHash(); render(); });
window.addEventListener("resize", autofit);

applyMode();
render();
</script>
