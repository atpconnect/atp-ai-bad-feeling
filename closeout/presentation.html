<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>The Throne Room, ATP September 17, 2026 (pre-seeded)</title>
<style>
  :root {
    /* Everything sizes off --fs so presentation mode is one number, not a restyle.
       --s is nudged live with + and - because the only way to know what reads from
       the back of a particular room is to stand in it. */
    --base-fs: 15px;
    --s: 1;
    --fs: calc(var(--base-fs) * var(--s));
    --maxw: 940px;
    /* Set per screen from THEMES. The defaults here are the method-screen palette. */
    --brand: #2C6FBF;
    --page: #f5f7f8;
    --warnbg: #fdf6ee;
    --warn: #B4610C;
    --ink: #14181a;
    --ink-2: #4a5257;
    --ink-3: #697276;
    --line: #e3e7e9;
    --fill: #f5f7f8;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page); color: var(--ink);
    transition: background 320ms ease, color 200ms ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: var(--fs); line-height: 1.5;
  }
  /* Presentation mode is one number. Everything sizes off --fs, so doubling --s
     doubles the whole deck rather than restyling it screen by screen. */
  :root.presenting { --s: 2; --maxw: 1760px; }
  :root.presenting .shell { padding: 12px 16px 20px; }
  :root.presenting .stage { padding: 20px 26px 18px; }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.55); }
  :root.presenting .lede { margin-bottom: calc(var(--fs) * 0.7); }
  :root.presenting .rule { margin: 10px 0 16px; }
  :root.presenting .takeaway { margin-top: calc(var(--fs) * 0.7); }
  /* Headline big, detail a step down. On a projector the headline is what carries the
     room and the detail is what the phone is for. */
  /* The projector shows headlines. The phone shows the detail.

     This is not a compromise, it is the measurement: five headlines each followed by
     two lines of detail needs 1458px of a 993px screen at readable type, so something
     has to go, and it should be the thing nobody reads off a wall in a bar. Headlines
     plus the takeaway is a slide. Headlines plus 400 characters of detail is a document
     being projected at people. Press D to reveal the detail on any screen. */
  :root.presenting ol.points .d { display: none; }
  :root.presenting.details ol.points .d { display: block; font-size: calc(var(--fs) * .72); }
  :root.presenting ol.points .t { font-size: calc(var(--fs) * 1.05); }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.42); }
  :root.presenting .follow { margin-top: 8px; padding-top: 8px; }
  :root.presenting .follow .t { font-size: calc(var(--fs) * .55); }
  /* Big enough to scan from the back of the room, which is the only size that counts.
     A QR only the front two rows can reach is decoration. */
  :root.presenting .followqr { width: calc(var(--fs) * 4.6); }
  :root.presenting .follow .t { font-size: calc(var(--fs) * .62); }
  .shell { max-width: var(--maxw); margin: 0 auto; padding: 28px 24px 64px; }
  .stage { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 34px 38px 30px;
           box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 14px 44px rgba(0,0,0,.12); }

  .rail { display: flex; gap: 4px; margin-bottom: 22px; }
  .rail span { flex: 1; height: 3px; background: var(--line); cursor: pointer; }
  .rail span.done { background: var(--ink-3); }
  .rail span.now { background: var(--brand); }

  .topline { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .wordmark { color: var(--brand); font-weight: 800; letter-spacing: .18em; font-size: calc(var(--fs) * .8); }
  .divider-v { width: 1px; height: 12px; background: var(--line); }
  .kicker { font-size: calc(var(--fs) * .8); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
  .count { margin-left: auto; font-size: calc(var(--fs) * .8); color: var(--ink-3); font-variant-numeric: tabular-nums; }

  h1 { font-size: calc(var(--fs) * 1.6); line-height: 1.25; margin: 4px 0 0; font-weight: 650; }
  .rule { width: 48px; height: 2px; background: var(--brand); margin: 12px 0 24px; }
  p { margin: 0 0 12px; }
  .lede { font-size: calc(var(--fs) * 1.07); margin-bottom: 20px; }

  ol.points { list-style: none; margin: 0; padding: 0; }
  ol.points li { display: flex; gap: 14px; margin-bottom: 15px; }
  ol.points .n { color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; min-width: calc(var(--fs) * 1.35); }
  ol.points .t { font-weight: 600; }
  ol.points .d { color: var(--ink-2); }

  .pill { display: inline-block; font-size: calc(var(--fs) * .7); letter-spacing: .07em; font-weight: 700;
          color: var(--brand); border: 1px solid var(--brand); border-radius: 3px;
          padding: 1px 6px; vertical-align: 2px; margin-left: 4px; }
  .pill.warn { color: var(--warn); border-color: var(--warn); }

  .flag { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
          color: var(--ink-2); padding: 11px 14px; border-radius: 4px; margin-bottom: 18px; font-size: calc(var(--fs) * .93); }
  .flag b { color: var(--warn); }

  .callout { border: 1px solid var(--line); border-left: 3px solid var(--brand); background: var(--fill);
             padding: 12px 14px; border-radius: 4px; margin-top: 20px; }
  .callout .h { font-weight: 650; margin-bottom: 4px; }
  .callout .b { color: var(--ink-2); }
  .qr { display: block; width: 132px; height: 132px; margin: 12px 0 2px; image-rendering: pixelated; }

  .takeaway { border-left: 3px solid var(--brand); background: var(--fill); padding: 10px 14px; margin-top: 24px; }
  .takeaway .h { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-bottom: 3px; }
  .takeaway .b { font-weight: 600; }

  .nav { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  button { font: inherit; font-size: calc(var(--fs) * .87); padding: 6px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--fill); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  .nav .right { margin-left: auto; font-size: calc(var(--fs) * .8); color: var(--ink-3); }

  .voices { display: flex; align-items: center; gap: 6px; margin-top: 14px;
            padding-top: 14px; border-top: 1px solid var(--line); }
  .voices .lab { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-right: 4px; }
  .voices button { font-size: calc(var(--fs) * .8); padding: 4px 10px; }
  .voices button.on { background: var(--brand); color: var(--bg); border-color: var(--brand); }
  /* Demo builds carry this on every screen, not just the first. A page of invented
     people and invented numbers sitting at a public URL has to say so wherever the
     reader happens to land, including on a deep link straight into station four. */
  /* Selecting a narrator on a screen that never changes voice used to do nothing at
     all, with the only explanation in small grey type at the far edge of the voice
     bar. The deck opens on one of those screens, so the first thing anyone tried
     looked broken. Say it where they are looking. */
  .voicenote { border-left: 3px solid var(--brand); background: var(--fill);
               padding: 9px 13px; border-radius: 4px; margin-bottom: 18px;
               font-size: calc(var(--fs) * .85); color: var(--ink-2); }
  .voicenote b { color: var(--ink); }

  .demobar { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
             color: var(--ink-2); padding: 9px 13px; border-radius: 4px;
             margin-bottom: 16px; font-size: calc(var(--fs) * .8); }
  .demobar b { color: var(--warn); }

  .follow { display: flex; align-items: center; gap: 12px; margin-top: 12px;
            padding-top: 12px; border-top: 1px solid var(--line); }
  .followqr { width: 62px; aspect-ratio: 1 / 1; flex: none; display: block;
              background: #fff; padding: 4px; border-radius: 3px; }
  .follow .t { font-size: calc(var(--fs) * .8); color: var(--ink-3); line-height: 1.45; }
  .follow .t b { color: var(--ink-2); }
  .follow .u { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: calc(var(--fs) * .72); color: var(--ink-3); word-break: break-all; }

  .voices .hint { margin-left: auto; font-size: calc(var(--fs) * .77); color: var(--ink-3); }

  #printAll { display: none; }
  @media print {
    body { background: #fff; --page: #fff; }
    .rail, .nav, .stage { display: none !important; }
    .shell { max-width: none; padding: 0; }
    #printAll { display: block; }
    #printAll .page { page-break-after: always; padding: 0 0 24px; }
    #printAll .page:last-child { page-break-after: auto; }
  }
</style>
</head>

<script>
// VOICES is [[key, label], ...] in display order.
// UNVOICED lists the screen ids that never change voice: they are ours, not the model's.
const DECKS = {
 "straight": [
  {
   "id": "method",
   "kicker": "How this was made",
   "title": "Five rooms, one picture, ten minutes",
   "takeaway": "The AI did the reading. Everything that had one correct answer was done by code.",
   "body": "<p class=\"lede\">Five stations ran in parallel. Nobody was in more than one of them. This deck existed before the last one finished talking.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Every station was recorded to its own meeting, hosted by one person</span><br><span class=\"d\">Not by the pilot running the room. One account owned all five, so no session depended on a presenter remembering to press a button correctly.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Ending the meeting is what starts the transcript</span><br><span class=\"d\">Teams generates a transcript 2.5 to 5 minutes after a meeting is ended, not left. Five staggered endings, then one to three minutes for the model to read every word said in this building and answer. That is the budget you just watched us spend, and every number in it was measured in rehearsal.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model was given the transcripts and a written brief, and asked for data</span><br><span class=\"d\">Not for a deck. It returns structured content, which is checked against a schema before anything is rendered. Wrong shape, wrong station name, too many bullets: rejected, and the previous deck stands.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The slides you are looking at were generated by code, not by the model</span><br><span class=\"d\">Order, branding, navigation, this screen, the QR code: all deterministic. The model only wrote the parts that needed judgment about what was said.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Two models ran at once, and it was not a race</span><br><span class=\"d\">A fast standby answered the same question in parallel. The good model got the whole deadline to itself and the standby was only used if it missed. Measured on the night's transcripts: 81 seconds against 167. A race would have handed you the weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy was built <b>before the stations ran</b>, from the question lists and the answers we expected to hear. It is the floor, not the deck: if every recording in the building had failed, this is what you would be looking at, and it would say so on every screen. Written by the primary model. Generated 2026-09-11 15:04.</div></div>"
  },
  {
   "id": "reliability",
   "kicker": "The transferable part",
   "title": "Why this worked when your AI program did not",
   "takeaway": "Give the model the judgment call. Never give it anything you could check by machine instead.",
   "body": "<p class=\"lede\">Nothing here needed a better model. It needed the unglamorous things around the model to be decided in advance, and every one of them is a thing your program can do on Monday.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Deterministic wherever determinism is available</span><br><span class=\"d\">The model wrote the words. Code decided the running order, the branding, which stations are flagged, the navigation, the QR, and this sentence. A model that cannot choose the running order cannot get the running order wrong. Shrink what it is allowed to decide and you shrink what a human has to check at 7:50pm.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Never ask a model a question you can already answer</span><br><span class=\"d\">Which stations produced a real recording is a fact sitting on a disk. The deck reads it from there and throws away whatever the model says about it. That closed a real hole: a model that relabelled a failed station as a real one silently deleted the warning built to catch exactly that.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Constrain the output until it can be validated</span><br><span class=\"d\">It returns JSON against a fixed schema, not slides. Unknown station, missing station, too many bullets: rejected, and the deck already on disk stands untouched. You cannot check free text. You can check a schema.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Write the evals before the night, and test the disasters</span><br><span class=\"d\">137 automated checks across 24 rehearsals of this evening, including no transcript at all, prose instead of JSON, a crashed CLI, a transcript arriving late, and a narrator quietly dropping the numbers. The happy path is the least useful thing you can test.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Score the things you would otherwise argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"
  },
  {
   "id": "sky-city",
   "kicker": "Sky City",
   "title": "Infrastructure and integration with third-party tools",
   "takeaway": "It's a trap: the terms of every vendor deal are only as good as the version pin, the exit clause, and the export format you insisted on before signing.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was set up to follow a vendor deal from the demo that looked clean through to the moment a number in the contract meant something different in production. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">The demo runs on one tenant and no load; the gap shows up in week one of real traffic</span><br><span class=\"d\">The agenda opened by asking what the sales demo did not show. The likely shape of the answer is a clean data slice with a single tenant and nothing resembling production volume, so the first real week of traffic is where the gap appears.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Shared rate limits read like dedicated capacity until other customers have a busy Monday</span><br><span class=\"d\">The contract number question targets rate limits, token counts, and per-seat prices that turn out to mean something else under load. The expected example is a shared limit written as if it were reserved, with the same lesson for buyers on either side of the sale.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Versions swap on the vendor's schedule, and nobody had a regression test watching</span><br><span class=\"d\">The agenda asks when a vendor changed something a customer depended on without asking. The expected pattern is a model or API version swap with no pinning on the tier that was bought, and output quality drifting with no test in place to catch it.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Signing to production runs months, not the weeks the sale promised</span><br><span class=\"d\">The room was asked to put a number of months on the gap between signing and something real in production. The general expectation is six to nine months against a sales pitch measured in weeks, with the time going to integration and identity work nobody scoped.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The closer: what clause would you refuse to sign again Monday</span><br><span class=\"d\">The final question asks for one clause each. The likely list is version pinning, a real exit clause, and data export in a format the buyer controls rather than the vendor.</span></span></li></ol>"
  },
  {
   "id": "swamp-planet",
   "kicker": "Swamp Planet",
   "title": "Technical debt and data quality",
   "takeaway": "The garbage will do, right up until the moment it produces a confident answer in front of a customer. Profile the data before the project has a deadline.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was built around the swamp under every AI project: the data nobody cleaned, the schema nobody updated, the owner who left, and the pilot that became production without a rebuild. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">The documented schema and the real contents diverged years ago</span><br><span class=\"d\">The opening question asks what a team discovers about its data the first time an AI system tries to use it. The general expectation is that the documented schema and the actual contents parted ways long before, and everyone downstream has been quietly working around it.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Most of the AI project becomes a data cleanup project, and none of it was budgeted</span><br><span class=\"d\">The agenda asks for a percentage from each person. The commonly quoted split is seventy to eighty percent of effort going to cleanup, with the follow-up being whether any of that was in the original budget.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The worst data usually has no owner since the one person who understood it left</span><br><span class=\"d\">The ownership question expects customer records tangled by a merger or acquisition, with nobody named as owner and the institutional knowledge gone with a departure.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Confidently wrong answers get caught after a customer sees them, not before</span><br><span class=\"d\">The station asks whether bad data produced a wrong answer that was caught before or after a customer, and how. The expected failure mode is silence rather than an outage: nothing crashed, so no monitor fired, and a person downstream noticed first.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The closer: profile the data before promising anything to anyone</span><br><span class=\"d\">The final question asks what to tell a colleague starting Monday. The general answer on the agenda is an honest audit up front, on the grounds that it is cheaper than learning the truth in front of a customer.</span></span></li></ol>"
  },
  {
   "id": "ice-planet",
   "kicker": "Ice Planet",
   "title": "Use cases, costs, and scope creep",
   "takeaway": "Do or do not, there is no try. A stalled pilot needs a named owner, a support model, and one executive willing to accept the risk in writing, or it needs to be killed.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was about AI use cases stuck at the outpost: not cancelled, not shipped, waiting on a decision nobody has made while the cost meter runs and the scope quietly grows. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Double digits started, low single digits in production</span><br><span class=\"d\">The opening question asks each person for two numbers, use cases started and use cases live, with a running total. The expected ratio is many started against very few in production, and that ratio is the whole story of this station.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Stalls happen in the handoff, when nobody owns the thing with budget authority</span><br><span class=\"d\">The agenda polls the reasons a use case stalls: budget, no owner, data, legal, or no decision at all. The expected biggest pile is the missing production owner once the pilot ends, in the gap between the team that built it and the team that would run it.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Scope grows in every direction, and the budget rarely follows</span><br><span class=\"d\">The scope question expects a single workflow picking up a compliance review, a second business unit, and an executive's feature before anyone goes back to re-scope the money.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Production cost is a multiple of the pilot, and the surprise is rarely the token price</span><br><span class=\"d\">The bill question asks for a multiple, not a percentage. The expected surprise lines are the people reviewing output, the seats nobody counted, and usage that grew because the thing worked.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Killing a project outright usually takes a reorg, not a decision on the merits</span><br><span class=\"d\">The agenda asks who has actually killed an AI project and what it took. The general expectation is that it is rare, and that when it happens it comes from a budget cut or reorganization rather than an honest call on the project itself.</span></span></li></ol>"
  },
  {
   "id": "snow-monster-cave",
   "kicker": "Snow Monster Cave",
   "title": "Dev",
   "takeaway": "The model integration is not what eats the time. The eval set, the on-call plan, and deciding who owns it after the builder moves on are.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was about what happens inside the build: what tested meant, who is on call at 2am, where the prompt actually lives, and the engineer holding all of it when something breaks. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Tested means a handful of hand-checked examples, and the deadline decided that was enough</span><br><span class=\"d\">The opening question asks what tested meant for the last shipped AI feature and who decided. The expected answer is a few examples someone said looked right, with no formal decision that this was sufficient.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The on-call rotation is whoever built it, informally, because it never went through the process</span><br><span class=\"d\">The agenda counts hands for a formal on-call rotation on an AI feature. The general expectation is that few exist, and that the one or two engineers who built the feature are carrying it without having signed up for it.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The feature is thinner than leadership assumes: a prompt, a vendor model, and plumbing</span><br><span class=\"d\">The station asks what percentage of an AI feature is genuinely owned code. The expected answer is that most of the behavior lives in a prompt and a vendor's model, with the follow-up being whether leadership knows that number.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The prompt lives in a vendor console or a laptop, and one change nobody could trace</span><br><span class=\"d\">The agenda polls three homes for the prompt: source control, a vendor console, or someone's machine. The expected cost is an untraceable change made by someone who did not know a second feature shared the same prompt.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Rollback is partial: you can revert the prompt but not the vendor's weights</span><br><span class=\"d\">The rollback question asks what could and could not be reverted after a bad change. The general expectation is that pinning the model and reverting the prompt only gets you part of the way back.</span></span></li></ol>"
  },
  {
   "id": "asteroid-field",
   "kicker": "Asteroid Field",
   "title": "Compliance, legal, and security",
   "takeaway": "I find your lack of a sign-off disturbing. The review is worth it when it catches the data flow nobody drew, and someone has to be willing to own the answer.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was about the compliance, legal, and security review everyone dreaded and flew through anyway: what it caught, what going around it cost, and what employees were pasting into AI tools the whole time. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Legal asks where the training data came from, and nobody can answer</span><br><span class=\"d\">The opening question asks what Legal asked that could not be answered. The expected examples are the origin of the training data and whether an output can be explained to a regulator in plain language.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Nobody wants to be the one who signs off that the AI is safe for a customer</span><br><span class=\"d\">The agenda asks for the role that signs off on an AI decision or vendor, and counts how many say nobody yet. The general expectation is that this vacuum stalls more work than any technical limit.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The security review was not built for a system whose behavior changes without a release</span><br><span class=\"d\">The station asks what happened when an AI vendor went through the normal security review. The expected outcome is that it either passed something it should not have or stalled indefinitely, because the process assumes releases.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Shadow AI: more tools than anyone approved and more data than anyone classified</span><br><span class=\"d\">The agenda asks what turned up when someone looked at what employees put into AI tools. The expected finding is customer records, contracts, and source code in consumer chat tools before any policy existed, with blocking not actually stopping it.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Insurers ask first, auditors are starting, regulators are mostly silent</span><br><span class=\"d\">The question about who has asked anything at all expects cyber insurers with a line or two on the questionnaire, auditors asking where AI touches financial reporting, and regulators saying nothing, which is harder to design for than a strict rule.</span></span></li></ol>"
  },

   "takeaway": "Everyone in this building had a bad feeling about this at some point and proceeded anyway. The fix in every room was the same: name an owner, write down the number, and watch the thing after it ships.",
   "body": "<p class=\"lede\">Nobody has said any of this yet. These are the patterns we expect to connect the five stations, written in advance. The real ones get written on the night, from what the rooms actually say.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Nobody owns it after the pilot ends</span><br><span class=\"d\">Every station has a version of this. Ice Planet's stalled use cases wait on a production owner with budget. Snow Monster Cave's on-call falls to whoever built it. Swamp Planet's worst data has no owner since the last person left. Asteroid Field's sign-off role is nobody yet.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Things change underneath you without a release, and nothing is watching</span><br><span class=\"d\">Sky City's vendors swap versions on their own schedule. Snow Monster Cave finds rollback only partial because the vendor's weights cannot be reverted. Asteroid Field's security review was built for releases and cannot handle behavior that drifts. Swamp Planet's failures are silent, not loud.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The cost that hurts was never in the estimate</span><br><span class=\"d\">Sky City's integration months were not in the sales cycle. Swamp Planet's cleanup was not in the budget. Ice Planet's production bill is a multiple of the pilot because of people and seats. Asteroid Field's audit logs, human review, and explainability were each discovered separately as a surprise.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Workarounds become production and someone is quietly holding them up</span><br><span class=\"d\">Swamp Planet's notebook running a real business process. Snow Monster Cave's prompt on a laptop. Ice Planet's uncancelled project still burning cloud spend. Sky City's shop that skipped the abstraction layer and now quotes exit fees.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Everyone in this building had a bad feeling about this at some point and proceeded anyway. The fix in every room was the same: name an owner, write down the number, and watch the thing after it ships.</div><div class=\"b\">Everything behind this deck, including the station transcripts and the tool that built it, is at <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>. Take it and run this at your own company.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHDmT4Bn2uYL2ua1mclrM5O/oW1em5m81jZfMDN5rW1ea5u/YWbyWtu8NjN5rW2A/98GAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzJ/8uLaBV2Ymr7XNF7TNazOTv2Fm8gUzk9fa5lfNTP6GtvmCtuHf1zb8ng0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZP/mQmQn8y9rmtZnJa23z2szktbb5G2Ymr7XNazMTftPM5LW2eW1m8lrbfMHMBF7ZAAAAZzYAAMCZDQAA   {
   "id": "receipts",
   "kicker": "Our own bad feeling",
   "title": "What that discipline caught, in this deck, this week",
   "takeaway": "Every one of these was found by running the thing. Not one was found by reading it.",
   "body": "<p class=\"lede\">This is an AI program too, so it had a bad feeling about itself. Six defects, all of them from rehearsal, none of them from review.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A bug that would have failed live, in this room, tonight</span><br><span class=\"d\">The prompt was passed as a shell argument. Linux caps a single argument at 128KB and five real transcripts come to 285KB, so it worked in every small test and would have died the moment it saw the real thing, with everyone sitting here.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model could quietly promote a failed station to a real one</span><br><span class=\"d\">Which deleted the on-screen warning that exists to prevent precisely that. Not fixed with a better prompt. Fixed by never asking.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A 26-character overrun threw away an entire run</span><br><span class=\"d\">Validation could not tell the difference between output that was wrong and output that was merely too long. Now it can: one rejects, the other gets trimmed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Two models running in parallel were running in sequence</span><br><span class=\"d\">And producing perfect output the whole time. Caught only because a test asserted on elapsed time rather than on the result.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The QR codes rendered as perfectly sized blank squares</span><br><span class=\"d\">Right dimensions, right position, nothing inside. No assertion about the markup would have caught it, so the test now scans the code back with a barcode reader.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">A narrator that changed 9% of the words and passed every check</span><br><span class=\"d\">Correcting one failure produced its exact opposite. The first Yoda inverted nearly every sentence into something you had to read twice. The fix came back 91% identical to the plain text: it validated perfectly and was pointless on stage. Vader landed at 58% of fields rewritten and is now at 100%. Three worked examples per character fixed both, showing one real sentence too weak, right, and too far. The answer to fear is never the obviously wrong one. It is the one that looks exactly right.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Take the whole thing</div><div class=\"b\">The principles above, each with the code that implements it and the defect it caught, plus how to run this format yourself: read RUN-THIS-YOURSELF.md. The runbooks, the tool, the brief and every transcript are public too. Scan any screen, or go to <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHDmT4Bn2uYL2ua1mclrM5O/oW1em5m81jZfMDN5rW1ea5u/YWbyWtu8NjN5rW gba(124,139,149,0) 100%), radial-gradient(900px 520px at 70% 20%, #1D242A 0%, rgba(29,36,42,0) 64%), linear-gradient(168deg, #0C0F12 0%, #141A1F 55%, #080A0C 100%)", "surface": "#171B1E", "fill": "#1F262B", "line": "#333D44", "ink": "#E9EDF0", "ink2": "#B8C2C9", "ink3": "#93A0A8", "accent": "#7FB4D4", "warn": "#E8B45C", "warnbg": "#2A2412"}};
const DEFAULT_THEME = {"bg": "#f5f7f8", "surface": "#ffffff", "fill": "#f5f7f8", "line": "#e3e7e9", "ink": "#14181a", "ink2": "#4a5257", "ink3": "#697276", "accent": "#2C6FBF", "warn": "#B4610C", "warnbg": "#fdf6ee"};
const QRS = {"method": "", "reliability": "", "sky-city": "", "swamp-planet": "", "ice-planet": "", "snow-monster-cave": "", "asteroid-field": "", "patterns": "", "receipts": ""};            // screen id -> inline SVG, one per screen, not per voice
const FOLLOW_URL = "https://atpconnect.github.io/atp-ai-bad-feeling/closeout/presentation.html";
const DEMO_NOTICE = "";
let i = 0;
let voice = "straight";
const el = id => document.getElementById(id);
const screens = () => DECKS[voice] || DECKS.straight;

// Themes are applied by setting the CSS variables, so one object drives the whole
// look of a screen and nothing about the layout knows which station it is on.
const VARS = {surface: "--bg", fill: "--fill", line: "--line", ink: "--ink",
              ink2: "--ink-2", ink3: "--ink-3", accent: "--brand", warn: "--warn",
              warnbg: "--warnbg", bg: "--page"};
function themeFor(id) { return THEMES[id] || DEFAULT_THEME; }
function applyTheme(id) {
  const t = themeFor(id), st = document.documentElement.style;
  for (const k in VARS) st.setProperty(VARS[k], t[k]);
}
function themeVars(id) {  // inline form, for the print view where each page differs
  const t = themeFor(id);
  return Object.keys(VARS).map(k => VARS[k] + ":" + t[k]).join(";");
}

const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };

let scale = parseFloat(load("atp-scale", "")) || 0;
let presenting = load("atp-presenting", "0") === "1";

function applyMode() {
  document.documentElement.classList.toggle("presenting", presenting);
  // A saved nudge only means anything for the mode it was set in.
  document.documentElement.style.setProperty("--s", scale || (presenting ? 2 : 1));
  store("atp-presenting", presenting ? "1" : "0");
  autofit();
}

// Shrink until the screen fits the screen. A projector cannot scroll, and the takeaway
// is the last thing on every slide, so anything that overflows takes the line for the
// room with it. Skipped the moment the presenter nudges the size by hand: at that point
// they are standing in the room and know better than this does.
function autofit() {
  if (!presenting || scale) return;
  const root = document.documentElement;
  let s = 2;
  root.style.setProperty("--s", s);
  while (s > 1.15 && root.scrollHeight > window.innerHeight) {
    s = Math.round((s - 0.05) * 100) / 100;
    root.style.setProperty("--s", s);
  }
}
function nudge(delta) {
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--s")) || 1;
  scale = Math.min(5, Math.max(0.6, Math.round((cur + delta) * 20) / 20));
  store("atp-scale", scale);
  applyMode();
}

function setVoice(v) {
  if (!DECKS[v]) return;
  voice = v;
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.classList.toggle("on", b.dataset.voice === v));
  render();
}

function render() {
  const SCREENS = screens();
  const s = SCREENS[i];
  applyTheme(s.id);
  if (DEMO_NOTICE) { el("demobar").hidden = false; el("demobar").innerHTML = DEMO_NOTICE; }
  el("kicker").textContent = s.kicker.toUpperCase();
  el("count").textContent = (i + 1) + " / " + SCREENS.length;
  el("title").textContent = s.title;
  el("body").innerHTML = s.body;
  el("takeaway").textContent = s.takeaway;

  const rail = el("rail");
  rail.innerHTML = "";
  SCREENS.forEach((sc, n) => {
    const seg = document.createElement("span");
    seg.title = (n + 1) + ". " + sc.title;
    seg.className = n === i ? "now" : n < i ? "done" : "";
    seg.onclick = () => { i = n; render(); };
    rail.appendChild(seg);
  });

  if (FOLLOW_URL) {
    el("follow").hidden = false;
    el("followQr").innerHTML = QRS[s.id] || "";
    el("followUrl").textContent = FOLLOW_URL + "#" + s.id;
  }
  // The address bar always points at the screen on show, so the presenter's own URL
  // is shareable mid-talk and a scanned deep link lands on the right slide.
  try { history.replaceState(null, "", "#" + s.id); } catch (e) {}
  autofit();

  el("prev").disabled = i === 0;
  el("next").disabled = i === SCREENS.length - 1;
  const unvoiced = UNVOICED.indexOf(s.id) !== -1;
  const label = (VOICES.find(v => v[0] === voice) || ["", ""])[1];
  el("voiceHint").textContent =
    unvoiced ? "this screen is ours, so it stays straight"
             : "keys 1-" + VOICES.length + ", V to cycle, P to project, D for detail";

  // Say plainly why nothing changed, on the screen where nothing changed.
  const note = el("voicenote");
  if (unvoiced && voice !== "straight") {
    note.hidden = false;
    note.innerHTML = "<b>" + label + " is not narrating this screen.</b> The screens about " +
      "how this was built are ours, not the model's, so they stay in one voice. " +
      "Move to any station screen and " + label + " takes over.";
  } else {
    note.hidden = true;
  }
  // Dim the buttons here too, so the control looks as inert as it is.
  document.querySelectorAll("#voiceButtons button").forEach(b => {
    b.style.opacity = unvoiced && b.dataset.voice !== "straight" ? "0.45" : "";
  });
  window.scrollTo(0, 0);
}
el("prev").onclick = () => { i = Math.max(0, i - 1); render(); };
el("next").onclick = () => { i = Math.min(screens().length - 1, i + 1); render(); };

if (VOICES.length > 1) {
  el("voices").hidden = false;
  el("voiceButtons").innerHTML = VOICES.map(([k, label]) =>
    '<button data-voice="' + k + '">' + label + '</button>').join(" ");
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.onclick = () => setVoice(b.dataset.voice));
}

document.onkeydown = ev => {
  if (ev.key.toLowerCase() === "p") { presenting = !presenting; scale = 0; applyMode(); return; }
  if (ev.key.toLowerCase() === "d") {
    document.documentElement.classList.toggle("details");
    scale = 0; applyMode(); return;
  }
  if (ev.key === "+" || ev.key === "=") { nudge(0.1); return; }
  if (ev.key === "-" || ev.key === "_") { nudge(-0.1); return; }
  if (ev.key === "ArrowRight" || ev.key === " " || ev.key === "PageDown") el("next").click();
  if (ev.key === "ArrowLeft" || ev.key === "PageUp") el("prev").click();
  if (ev.key === "Home") { i = 0; render(); }
  if (ev.key === "End") { i = screens().length - 1; render(); }
  // Voice switching is meant to happen live, mid-sentence, without losing your place.
  if (VOICES.length > 1) {
    if (ev.key.toLowerCase() === "v") {
      const n = VOICES.findIndex(v => v[0] === voice);
      setVoice(VOICES[(n + 1) % VOICES.length][0]);
    }
    const d = parseInt(ev.key, 10);
    if (d >= 1 && d <= VOICES.length) setVoice(VOICES[d - 1][0]);
  }
};
function buildPrint() {
  const SCREENS = screens();
  el("printAll").innerHTML = SCREENS.map((s, n) =>
    '<div class="page" style="' + themeVars(s.id) + '">' +
    '<div class="topline"><span class="wordmark">ATP</span>' +
    '<span class="divider-v"></span><span class="kicker">' + s.kicker.toUpperCase() + '</span>' +
    '<span class="count">' + (n + 1) + ' / ' + SCREENS.length + '</span></div>' +
    '<h1>' + s.title + '</h1><div class="rule"></div>' + s.body +
    '<div class="takeaway"><div class="h">THE LINE FOR THE ROOM</div><div class="b">' +
    s.takeaway + '</div></div></div>').join("");
}
window.onbeforeprint = buildPrint;
if (location.hash === "#print") buildPrint();

// Deep link: land on the screen the QR pointed at.
function fromHash() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const n = screens().findIndex(s => s.id === id);
  if (n >= 0) i = n;
}
fromHash();
window.addEventListener("hashchange", () => { fromHash(); render(); });
window.addEventListener("resize", autofit);

applyMode();
render();
</script>
</body>
</html>
