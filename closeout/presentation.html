<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Throne Room, ATP September 17, 2026 (pre-seeded)</title>
<style>
  :root {
    /* Everything sizes off --fs so presentation mode is one number, not a restyle.
       --s is nudged live with + and - because the only way to know what reads from
       the back of a particular room is to stand in it. */
    --base-fs: 15px;
    --s: 1;
    --fs: calc(var(--base-fs) * var(--s));
    --maxw: 940px;
    --qrw: 92px;
    /* Set per screen from THEMES. The defaults here are the method-screen palette. */
    --brand: #2C6FBF;
    --page: #f5f7f8;
    --warnbg: #fdf6ee;
    --warn: #B4610C;
    --ink: #14181a;
    --ink-2: #4a5257;
    --ink-3: #697276;
    --line: #e3e7e9;
    --fill: #f5f7f8;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page); color: var(--ink);
    transition: background 320ms ease, color 200ms ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: var(--fs); line-height: 1.5;
  }
  /* Presentation mode is one number. Everything sizes off --fs, so doubling --s
     doubles the whole deck rather than restyling it screen by screen. */
  :root.presenting { --s: 2; --maxw: 1760px; }
  :root.presenting .shell { padding: 12px 16px 20px; }
  :root.presenting .stage { padding: 20px 26px 18px; }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.55); }
  :root.presenting .lede { margin-bottom: calc(var(--fs) * 0.7); }
  :root.presenting .rule { margin: 10px 0 16px; }
  :root.presenting .takeaway { margin-top: calc(var(--fs) * 0.7); }
  /* Headline big, detail a step down. On a projector the headline is what carries the
     room and the detail is what the phone is for. */
  /* The projector shows headlines. The phone shows the detail.

     This is not a compromise, it is the measurement: five headlines each followed by
     two lines of detail needs 1458px of a 993px screen at readable type, so something
     has to go, and it should be the thing nobody reads off a wall in a bar. Headlines
     plus the takeaway is a slide. Headlines plus 400 characters of detail is a document
     being projected at people. Press D to reveal the detail on any screen. */
  :root.presenting ol.points .d { display: none; }
  :root.presenting.details ol.points .d { display: block; font-size: calc(var(--fs) * .72); }
  :root.presenting ol.points .t { font-size: calc(var(--fs) * 1.05); }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.42); }
  /* Big enough to scan from the back of the room, which is the only size that counts.
     A QR only the front two rows can reach is decoration. */
  :root.presenting { --qrw: calc(var(--fs) * 6.4); }
  :root.presenting .head { gap: calc(var(--fs) * 1.1); }
  .shell { max-width: var(--maxw); margin: 0 auto; padding: 28px 24px 64px; }
  .stage { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 34px 38px 30px;
           box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 14px 44px rgba(0,0,0,.12); }

  .rail { display: flex; gap: 4px; margin-bottom: 22px; }
  .rail span { flex: 1; height: 3px; background: var(--line); cursor: pointer; }
  .rail span.done { background: var(--ink-3); }
  .rail span.now { background: var(--brand); }

  /* Several elements here carry a display rule and are toggled with the hidden
     attribute, which a bare display wins against. Without this an unsponsored
     station renders a src-less img: a broken-image icon and its alt text. */
  [hidden] { display: none !important; }

  /* The QR rides in the top right corner, beside the title rather than below the
     takeaway. At the foot of the card it was the last thing on the screen and the
     first thing the room's eye skipped; up here it is next to the only other thing
     anyone is looking at. The header is two columns so the QR can never overlap a
     long title, whatever the auto-fit does to the type size. */
  .head { display: flex; align-items: flex-start; gap: 22px; }
  .headmain { flex: 1; min-width: 0; }

  .topline { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .wordmark { color: var(--brand); font-weight: 800; letter-spacing: .18em; font-size: calc(var(--fs) * .8); }
  .divider-v { width: 1px; height: 12px; background: var(--line); }
  .kicker { font-size: calc(var(--fs) * .8); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }

  h1 { font-size: calc(var(--fs) * 1.6); line-height: 1.25; margin: 4px 0 0; font-weight: 650; }
  .rule { width: 48px; height: 2px; background: var(--brand); margin: 12px 0 24px; }
  p { margin: 0 0 12px; }
  .lede { font-size: calc(var(--fs) * 1.07); margin-bottom: 20px; }

  ol.points { list-style: none; margin: 0; padding: 0; }
  ol.points li { display: flex; gap: 14px; margin-bottom: 15px; }
  ol.points .n { color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; min-width: calc(var(--fs) * 1.35); }
  ol.points .t { font-weight: 600; }
  ol.points .d { color: var(--ink-2); }

  .pill { display: inline-block; font-size: calc(var(--fs) * .7); letter-spacing: .07em; font-weight: 700;
          color: var(--brand); border: 1px solid var(--brand); border-radius: 3px;
          padding: 1px 6px; vertical-align: 2px; margin-left: 4px; }
  .pill.warn { color: var(--warn); border-color: var(--warn); }

  .flag { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
          color: var(--ink-2); padding: 11px 14px; border-radius: 4px; margin-bottom: 18px; font-size: calc(var(--fs) * .93); }
  .flag b { color: var(--warn); }

  .callout { border: 1px solid var(--line); border-left: 3px solid var(--brand); background: var(--fill);
             padding: 12px 14px; border-radius: 4px; margin-top: 20px; }
  .callout .h { font-weight: 650; margin-bottom: 4px; }
  .callout .b { color: var(--ink-2); }
  .qr { display: block; width: 132px; height: 132px; margin: 12px 0 2px; image-rendering: pixelated; }

  .takeaway { border-left: 3px solid var(--brand); background: var(--fill); padding: 10px 14px; margin-top: 24px; }
  .takeaway .h { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-bottom: 3px; }
  .takeaway .b { font-weight: 600; }

  .nav { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  button { font: inherit; font-size: calc(var(--fs) * .87); padding: 6px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--fill); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  .nav .right { margin-left: auto; font-size: calc(var(--fs) * .8); color: var(--ink-3); }

  .voices { display: flex; align-items: center; gap: 6px; margin-top: 14px;
            padding-top: 14px; border-top: 1px solid var(--line); }
  .voices .lab { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-right: 4px; }
  .voices button { font-size: calc(var(--fs) * .8); padding: 4px 10px; }
  .voices button.on { background: var(--brand); color: var(--bg); border-color: var(--brand); }
  /* Demo builds carry this on every screen, not just the first. A page of invented
     people and invented numbers sitting at a public URL has to say so wherever the
     reader happens to land, including on a deep link straight into station four. */
  /* Selecting a narrator on a screen that never changes voice used to do nothing at
     all, with the only explanation in small grey type at the far edge of the voice
     bar. The deck opens on one of those screens, so the first thing anyone tried
     looked broken. Say it where they are looking. */
  .voicenote { border-left: 3px solid var(--brand); background: var(--fill);
               padding: 9px 13px; border-radius: 4px; margin-bottom: 18px;
               font-size: calc(var(--fs) * .85); color: var(--ink-2); }
  .voicenote b { color: var(--ink); }

  .demobar { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
             color: var(--ink-2); padding: 9px 13px; border-radius: 4px;
             margin-bottom: 16px; font-size: calc(var(--fs) * .8); }
  .demobar b { color: var(--warn); }

  /* Sponsor logo sits left of the code, matched to its height. It carries no caption
     for the same reason the QR does not: a label under a logo in the corner of a slide
     is read by nobody, and the two of them together are already the only things up
     there that are not the title. */
  .corner { flex: none; display: flex; align-items: center; gap: calc(var(--qrw) * .22); }
  /* On the dark themes the sponsor asset is a white plate rather than inverted ink,
     so it gets the same rounded corner as the QR and the two read as a deliberate
     pair of cards instead of one logo and one rectangle. */
  .sponsor { height: var(--qrw); width: auto; max-width: calc(var(--qrw) * 2.1);
             object-fit: contain; display: block; border-radius: 3px; }
  .follow { flex: none; display: block; }
  .followqr { width: var(--qrw); aspect-ratio: 1 / 1; flex: none; display: block;
              background: #fff; padding: 4px; border-radius: 3px; }
  /* The URL is the no-qrencode fallback, so it only shows when there is no QR to
     scan. In the corner a full URL would be taller than the code it replaces. */
  .follow .u { display: none; }
  .follow.noqr { max-width: calc(var(--fs) * 13); }
  .follow.noqr .u { display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: calc(var(--fs) * .72); color: var(--ink-3); word-break: break-all; }

  .voices .hint { margin-left: auto; font-size: calc(var(--fs) * .77); color: var(--ink-3); }

  #printAll { display: none; }
  @media print {
    body { background: #fff; --page: #fff; }
    .rail, .nav, .stage { display: none !important; }
    .shell { max-width: none; padding: 0; }
    #printAll { display: block; }
    #printAll .page { page-break-after: always; padding: 0 0 24px; }
    #printAll .page:last-child { page-break-after: auto; }
  }
</style>

const DECKS = {
 "default": [
  {
   "id": "method",
   "kicker": "How this was made",
   "title": "Five rooms, one picture, ten minutes",
   "takeaway": "The AI did the reading. Everything that had one correct answer was done by code.",
   "body": "<p class=\"lede\">Five stations ran in parallel. Nobody was in more than one of them. This deck existed before the last one finished talking.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Every station was recorded to its own meeting, hosted by one person</span><br><span class=\"d\">Not by the pilot running the room. One account owned all five, so no session depended on a presenter remembering to press a button correctly.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Ending the meeting is what starts the transcript</span><br><span class=\"d\">Teams generates a transcript 2.5 to 5 minutes after a meeting is ended, not left. Five staggered endings, then one to three minutes for the model to read every word said in this building and answer. That is the budget you just watched us spend, and every number in it was measured in rehearsal.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model was given the transcripts and a written brief, and asked for data</span><br><span class=\"d\">Not for a deck. It returns structured content, which is checked against a schema before anything is rendered. Wrong shape, wrong station name, too many bullets: rejected, and the previous deck stands.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The slides you are looking at were generated by code, not by the model</span><br><span class=\"d\">Order, branding, navigation, this screen, the QR code: all deterministic. The model only wrote the parts that needed judgment about what was said.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Two models ran at once, and it was not a race</span><br><span class=\"d\">A fast standby answered the same question in parallel. The good model got the whole deadline to itself and the standby was only used if it missed. Measured on the night's transcripts: 81 seconds against 167. A race would have handed you the weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy was built <b>before the stations ran</b>, from the question lists and the answers we expected to hear. It is the floor, not the deck: if every recording in the building had failed, this is what you would be looking at, and it would say so on every screen. Written by the primary model. Generated 2026-09-16 18:16.</div></div>"
  },
  {
   "id": "reliability",
   "kicker": "The transferable part",
   "title": "Why this worked when your AI program did not",
   "takeaway": "Give the model the judgment call. Never give it anything you could check by machine instead.",
   "body": "<p class=\"lede\">Nothing here needed a better model. It needed the unglamorous things around the model to be decided in advance, and every one of them is a thing your program can do on Monday.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Deterministic wherever determinism is available</span><br><span class=\"d\">The model wrote the words. Code decided the running order, the branding, which stations are flagged, the navigation, the QR, and this sentence. A model that cannot choose the running order cannot get the running order wrong. Shrink what it is allowed to decide and you shrink what a human has to check at 7:50pm.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Never ask a model a question you can already answer</span><br><span class=\"d\">Which stations produced a real recording is a fact sitting on a disk. The deck reads it from there and throws away whatever the model says about it. That closed a real hole: a model that relabelled a failed station as a real one silently deleted the warning built to catch exactly that.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Constrain the output until it can be validated</span><br><span class=\"d\">It returns JSON against a fixed schema, not slides. Unknown station, missing station, too many bullets: rejected, and the deck already on disk stands untouched. You cannot check free text. You can check a schema.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Write the evals before the night, and test the disasters</span><br><span class=\"d\">137 automated checks across 24 rehearsals of this evening, including no transcript at all, prose instead of JSON, a crashed CLI, a transcript arriving late, and a narrator quietly dropping the numbers. The happy path is the least useful thing you can test.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Score the things you would otherwise argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"
  },
  {
   "id": "sky-city",
   "kicker": "Sky City",
   "title": "Infrastructure and integration with third-party tools",
   "takeaway": "The real cost of a third-party AI tool shows up in the contract's fine print and the vendor's next silent change, not in the demo.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was built to pressure-test the gap between what a third-party AI vendor demos and what actually ships, from sales math to who owns the fallout when a vendor changes something without asking. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Demos run on the vendor's clean data, not yours</span><br><span class=\"d\">The station was set up around cases like a summarization demo built on twenty short, single-language, clean-audio calls, or a document-extraction demo run only on the vendor's own samples, when the real environment carries multilingual calls, hold-music overlap, and millions of documents no demo ever touched.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Contract language means something different once you're billed</span><br><span class=\"d\">The scenario anticipated numbers that read one way on the page and another in production: a seat defined as any individual whose data is processed rather than a person who logs in, ballooning a sizing of roughly 400 users into a bill against thousands, and a rate limit sold as dedicated capacity but delivered as a shared regional pool that thins out on the first Monday of the month.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Vendors change things and the customer finds out last</span><br><span class=\"d\">The material anticipated silent changes landing downstream: a model quietly rolled forward that altered output and wasn't noticed for over a week, a deprecation notice sent to a mailbox nobody owned, and processing moved to a new region for latency that broke a data residency commitment made to Legal, discovered only in a changelog.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Time to production runs months longer than the pitch</span><br><span class=\"d\">The station was built around a wide spread, roughly four to nineteen months from signature to anything real running, against sales promises closer to four to six weeks, with the gap expected to sit in identity and access review and security sign-off rather than the model itself.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Switching costs are real and invisible at signing</span><br><span class=\"d\">The scenario included a services engagement priced near eighty five thousand dollars just to get a customer's own data back out in a usable format, and a workforce of hundreds who'd built working habits around a tool, both framed as exit costs no contract line item ever captures.</span></span></li></ol>"
  },
  {
   "id": "swamp-planet",
   "kicker": "Swamp Planet",
   "title": "Technical debt and data quality",
   "takeaway": "An AI project inherits every argument about the data that the business never resolved, and pays for it in the delivery schedule.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was set up to test whether teams could see their own data well enough to trust an AI system built on top of it, and what happens when the answer is no. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Documentation describes data that no longer exists</span><br><span class=\"d\">The scenario anticipated a status field documented with fourteen values showing over sixty in production, built up from years of free text, and different parts of the business quietly maintaining four separate definitions of something as basic as an active customer, a disagreement expected to predate the AI project by years.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Almost nobody could draw their own data flow</span><br><span class=\"d\">The material was built around a room where only a small fraction could actually trace where their data goes end to end, with the expectation that not knowing keeps teams afraid to touch pipelines and lets vendors go unchallenged on claims about data they've never seen.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">AI projects quietly become data cleanup projects</span><br><span class=\"d\">The station anticipated a range of forty to one hundred percent of an AI project's effort going to fixing the underlying data before any model work happened, none of it budgeted, with one scenario a vendor certifying data as ready and the board being told the same thing before it wasn't true.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Ownership of bad data defaults to whoever's left</span><br><span class=\"d\">The scenario included a company's worst data, acquired years earlier, understood only by a contractor who left and now gets paid a few hours a month to explain it, and eleven years of unowned free text notes that every AI use case in the building wants to use anyway.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">A wrong answer doesn't set off any alarm</span><br><span class=\"d\">The material anticipated a workaround, a hand maintained mapping table sitting in front of a revenue process, quietly producing a confidently wrong contract date for a customer with nothing to alert on, framed as the difference between a loud outage and a quiet, wrong answer that nothing pages anyone about.</span></span></li></ol>"
  },
  {
   "id": "ice-planet",
   "kicker": "Ice Planet",
   "title": "Use cases, costs, and scope creep",
   "takeaway": "The number worth tracking isn't how many AI projects get started, it's how many anyone was ever willing to actually decide to kill or ship.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was built around the arithmetic of AI initiatives, how many get started against how many ever reach production, and what it costs to leave the rest running in place. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Most started use cases never reach production</span><br><span class=\"d\">The scenario anticipated a wide count of started AI initiatives against a much smaller number actually live, on the order of dozens started for every handful shipped, with the gap treated as the headline number for the whole station.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Projects go quiet instead of getting killed</span><br><span class=\"d\">The material anticipated the most common failure mode being that nobody ever decides a project is dead, a pilot ends, the team moves on, and a handoff between the team that built it and the team that would run it becomes a no that nobody has to own.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Nothing sitting idle actually stops costing money</span><br><span class=\"d\">The station was built around unused dev and test environments still billing monthly, a year long vendor contract priced near a quarter million dollars serving a single digit pilot group, and staff kept at partial allocation to a project that isn't moving, none of it showing up as a line item anyone reviews.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Scope grows after approval and budget never follows</span><br><span class=\"d\">The scenario anticipated a project approved for one team picking up a second region, a compliance and audit log requirement, and an executive's mobile request, none scoped at approval and none reflected in a budget that doesn't reopen once a project clears its gate.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The projects that stick share the same shape</span><br><span class=\"d\">The material anticipated success looking narrow and boring, one team, one owner, one metric agreed before the work started, and never removing the human from the loop, contrasted with failed efforts that tried to automate the person out from the start.</span></span></li></ol>"
  },
  {
   "id": "snow-monster-cave",
   "kicker": "Snow Monster Cave",
   "title": "Development",
   "takeaway": "Most of the risk in an AI feature isn't the model, it's the missing test plan, the missing on call, and the missing plan for what already shipped.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was built around what actually happens inside the build of an AI feature: what testing means in practice, who's on call when it breaks, and where the prompt itself really lives. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Testing an AI feature often means a vibe check</span><br><span class=\"d\">The scenario anticipated tested meaning a handful of happy path examples in a spreadsheet, an engineer skimming outputs for an afternoon, or a demo for the sponsor, with a launch date on the calendar before there was ever a test plan to satisfy.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Passing every test and still breaking in production</span><br><span class=\"d\">The material anticipated a shortened prompt passing over a hundred test cases while silently dropping a required disclaimer in production, caught by a person reading tickets more than a week later, and a retrieval rebuild that passed only because its evals were still checking against pre-rebuild data.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">On call for an AI feature is informal by default</span><br><span class=\"d\">The station anticipated a small handful of teams with a real on call rotation, against a much larger number where the real answer was the mobile number of whoever built it, sitting in a runbook, with that person never having agreed to carry it.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Nobody agrees how much of the feature is actually theirs</span><br><span class=\"d\">The scenario anticipated wide disagreement about what percentage of an AI feature is genuinely owned code versus a wrapper around someone else's API, ranging from single digits to the majority, and an expectation that leadership rarely sees that number stated plainly.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">A rollback doesn't undo what already went out</span><br><span class=\"d\">The material anticipated teams discovering that reverting a prompt or model doesn't restore an index that's already been regenerated, and more fundamentally, that a rollback fixes the next answer, not the answers already sitting in someone's inbox or a decision someone already made.</span></span></li></ol>"
  },
  {
   "id": "asteroid-field",
   "kicker": "Asteroid Field",
   "title": "Compliance, legal, and security",
   "takeaway": "The technology usually isn't what kills an AI use case in this room, an unanswered ownership or consent question that arrives late is.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was built around the compliance, legal, and security questions an AI system raises that most teams can't yet answer, and who is supposed to be the one signing off that it's safe. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Basic legal questions still have no answer</span><br><span class=\"d\">The scenario anticipated questions like what data a model was trained on, whether a deletion request actually removes anything from the model, and whether a given output is a decision or a recommendation, treated as simple until asked, and mostly unanswered when they were.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Nobody yet is the most common answer to who signs off</span><br><span class=\"d\">The material anticipated that question, who signs off that an AI decision or vendor is safe to put in front of a customer, getting no assigned role most of the time, with the expectation that the resulting vacuum stalls more work than any technical limitation does.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Security review wasn't built for a service that changes itself</span><br><span class=\"d\">The station anticipated a standard vendor security questionnaire, built for software that ships in versions, stalling for months against a service whose behavior changes without a release, and a vendor's contract permitting a new subprocessor with notice that means a page on their own website.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Employees are already pasting sensitive data into unapproved tools</span><br><span class=\"d\">The scenario anticipated proxy logs turning up dozens of AI tools in use against only a few approved, and specific material, a board deck, a contract, patient information, already having been pasted into consumer AI tools by people trying to get their work done faster.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Fixing one compliance gap can open another</span><br><span class=\"d\">The material anticipated audit logging added after the fact to answer what did the system do, only for the resulting indefinite record of every prompt and output to become its own discoverable liability that nobody had scoped either problem against.</span></span></li></ol>"
  },

   "id": "patterns",

   "title": "What nobody in one room could see",
   "takeaway": "None of these five rooms disagreed about where AI projects actually get stuck, it isn't the model, it's the owner nobody assigned, the number nobody checked, and the change nobody was watching for.",
   "body": "<p class=\"lede\">Nobody has said any of this yet. These are the patterns we expect to connect the five stations, written in advance. The real ones get written on the night, from what the rooms actually say.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Nobody decided is the default answer</span><br><span class=\"d\">Across the ice planet, swamp planet, and asteroid field material, the same gap kept surfacing: no one had ever been assigned to decide a project was finished, own the worst data, or sign off that an AI decision was safe to ship, and the snow monster cave scenario added that no formal on call exists for most AI features either. The absence of an owner, more than any technical limit, is what these stations expected to keep dragging things out.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The number on the page isn't the number in production</span><br><span class=\"d\">Every station's material built in a gap between an estimate and reality: sky city's four to six week sales pitch against nineteen months in production, ice planet's dozens of started projects against a handful shipped, swamp planet's fourteen documented values against sixty real ones, and asteroid field's security questionnaire built for versioned software running into a service that changes without ever shipping a version.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Things change quietly, and something downstream breaks</span><br><span class=\"d\">Sky city anticipated a vendor rolling a model forward and moving processing regions without notice, swamp planet anticipated a column rename silently breaking a six year old partner integration, snow monster cave anticipated one feature's prompt edit silently breaking a second feature sharing the same prompt, and asteroid field anticipated a subprocessor change arriving as a webpage notice. None of these scenarios expected anyone to be watching for the change until it had already landed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">A wrong answer doesn't trigger the alarms an outage does</span><br><span class=\"d\">Swamp planet's material and snow monster cave's material both built toward the same point from different angles: an outage pages somebody immediately, but a confidently wrong answer, whether a stale contract date or an answer already sent before a rollback, doesn't trip any alert and isn't covered by any incident process built for louder failures.</span></span></li></ol><div class=\"callout\"><div class=\"h\">None of these five rooms disagreed about where AI projects actually get stuck, it isn't the model, it's the owner nobody assigned, the number nobody checked, and the change nobody was watching for.</div><div class=\"b\">Everything behind this deck, including the station transcripts and the tool that built it, is at <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>. Take it and run this at your own company.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX   {
   "id": "receipts",
   "kicker": "Our own bad feeling",
   "title": "What that discipline caught, in this deck, this week",
   "takeaway": "Every one of these was found by running the thing. Not one was found by reading it.",
   "body": "<p class=\"lede\">This is an AI program too, so it had a bad feeling about itself. Six defects, all of them from rehearsal, none of them from review.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A bug that would have failed live, in this room, tonight</span><br><span class=\"d\">The prompt was passed as a shell argument. Linux caps a single argument at 128KB and five real transcripts come to 285KB, so it worked in every small test and would have died the moment it saw the real thing, with everyone sitting here.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model could quietly promote a failed station to a real one</span><br><span class=\"d\">Which deleted the on-screen warning that exists to prevent precisely that. Not fixed with a better prompt. Fixed by never asking.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A 26-character overrun threw away an entire run</span><br><span class=\"d\">Validation could not tell the difference between output that was wrong and output that was merely too long. Now it can: one rejects, the other gets trimmed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Two models running in parallel were running in sequence</span><br><span class=\"d\">And producing perfect output the whole time. Caught only because a test asserted on elapsed time rather than on the result.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The QR codes rendered as perfectly sized blank squares</span><br><span class=\"d\">Right dimensions, right position, nothing inside. No assertion about the markup would have caught it, so the test now scans the code back with a barcode reader.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">A narrator that changed 9% of the words and passed every check</span><br><span class=\"d\">Correcting one failure produced its exact opposite. The first Elder voice inverted nearly every sentence into something you had to read twice. The fix came back 91% identical to the plain text: it validated perfectly and was pointless on stage. Enforcer landed at 58% of fields rewritten and is now at 100%. Three worked examples per character fixed both, showing one real sentence too weak, right, and too far. The answer to fear is never the obviously wrong one. It is the one that looks exactly right.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Take the whole thing</div><div class=\"b\">The principles above, each with the code that implements it and the defect it caught, plus how to run this format yourself: read RUN-THIS-YOURSELF.md. The runbooks, the tool, the brief and every transcript are public too. Scan any screen, or go to <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHDmT4Bn2uYL2ua1mclrM5O/oW1em5m81jZfMDN5rW1ea5u/YWby    "title": "Five rooms, one picture, ten minutes",
   "takeaway": "The AI did the reading. Everything that had one correct answer was done by code.",
   "body": "<p class=\"lede\">Five stations ran in parallel. Nobody was in more than one of them. This deck existed before the last one finished talking.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Every station was recorded to its own meeting, hosted by one person</span><br><span class=\"d\">Not by the pilot running the room. One account owned all five, so no session depended on a presenter remembering to press a button correctly.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Ending the meeting is what starts the transcript</span><br><span class=\"d\">Teams generates a transcript 2.5 to 5 minutes after a meeting is ended, not left. Five staggered endings, then one to three minutes for the model to read every word said in this building and answer. That is the budget you just watched us spend, and every number in it was measured in rehearsal.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model was given the transcripts and a written brief, and asked for data</span><br><span class=\"d\">Not for a deck. It returns structured content, which is checked against a schema before anything is rendered. Wrong shape, wrong station name, too many bullets: rejected, and the previous deck stands.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The slides you are looking at were generated by code, not by the model</span><br><span class=\"d\">Order, branding, navigation, this screen, the QR code: all deterministic. The model only wrote the parts that needed judgment about what was said.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Two models ran at once, and it was not a race</span><br><span class=\"d\">A fast standby answered the same question in parallel. The good model got the whole deadline to itself and the standby was only used if it missed. Measured on the night's transcripts: 81 seconds against 167. A race would have handed you the weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy was built <b>before the stations ran</b>, from the question lists and the answers we expected to hear. It is the floor, not the deck: if every recording in the building had failed, this is what you would be looking at, and it would say so on every screen. Written by the primary model. Generated 2026-09-16 18:16.</div></div>"

   "title": "Why this worked when your AI program did not",
   "takeaway": "Give the model the judgment call. Never give it anything you could check by machine instead.",
   "body": "<p class=\"lede\">Nothing here needed a better model. It needed the unglamorous things around the model to be decided in advance, and every one of them is a thing your program can do on Monday.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Deterministic wherever determinism is available</span><br><span class=\"d\">The model wrote the words. Code decided the running order, the branding, which stations are flagged, the navigation, the QR, and this sentence. A model that cannot choose the running order cannot get the running order wrong. Shrink what it is allowed to decide and you shrink what a human has to check at 7:50pm.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Never ask a model a question you can already answer</span><br><span class=\"d\">Which stations produced a real recording is a fact sitting on a disk. The deck reads it from there and throws away whatever the model says about it. That closed a real hole: a model that relabelled a failed station as a real one silently deleted the warning built to catch exactly that.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Constrain the output until it can be validated</span><br><span class=\"d\">It returns JSON against a fixed schema, not slides. Unknown station, missing station, too many bullets: rejected, and the deck already on disk stands untouched. You cannot check free text. You can check a schema.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Write the evals before the night, and test the disasters</span><br><span class=\"d\">137 automated checks across 24 rehearsals of this evening, including no transcript at all, prose instead of JSON, a crashed CLI, a transcript arriving late, and a narrator quietly dropping the numbers. The happy path is the least useful thing you can test.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Score the things you would otherwise argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"

   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Built to pressure-test the gap between what a vendor demos and what actually ships, this station was. Sales math it covers, and who owns the fallout when a vendor changes something without asking. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Clean data, the demo ran on. Not yours.</span><br><span class=\"d\">Cases like these, the station was built around: a summarization demo on twenty short, single-language, clean-audio calls, or document extraction shown only on the vendor's own samples. Multilingual calls, hold-music overlap, and millions of documents no demo ever touched, that is the real environment.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The contract reads one way. The bill reads another.</span><br><span class=\"d\">Numbers that meant one thing on the page and another in production, the scenario anticipated. A seat defined as any individual whose data is processed, not a person who logs in, ballooned a sizing of roughly 400 users into a bill against thousands. A rate limit sold as dedicated capacity, delivered as a shared regional pool, thinning out on the first Monday of every month.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Vendors change things. The customer hears about it last.</span><br><span class=\"d\">Silent changes landing downstream, the material expected: a model quietly rolled forward that altered output, unnoticed for over a week. A deprecation notice sent to a mailbox nobody owned. Processing moved to a new region for latency, breaking a data residency commitment made to Legal, discovered only in a changelog.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Months longer than the pitch, production takes.</span><br><span class=\"d\">A wide spread, the station was built around: roughly four to nineteen months from signature to anything real running, against sales promises closer to four to six weeks. In identity and access review, and security sign-off, the gap sits. Not in the model.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Invisible at signing, the switching costs are.</span><br><span class=\"d\">A services engagement priced near eighty five thousand dollars, just to get a customer's own data back out in a usable format, the scenario included. A workforce of hundreds who'd built working habits around a tool. Exit costs, both of them, and no contract line item ever captures them.</span></span></li></ol>"

   "title": "Technical debt and data quality",
   "takeaway": "Every argument about the data the business never resolved, an AI project inherits. And pays for it in the delivery schedule.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Whether teams could see their own data well enough to trust an AI system built on top of it, this station tested. And what happens when the answer is no. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">The documentation describes data that no longer exists.</span><br><span class=\"d\">Fourteen documented values, the scenario anticipated, showing over sixty in production, built up from years of free text. Four separate definitions of something as basic as an active customer, different parts of the business quietly maintained. Older than the AI project, that disagreement, by years.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Their own data flow, almost nobody could draw.</span><br><span class=\"d\">A room where only a small fraction could trace where their data goes end to end, the material was built around. Afraid to touch pipelines, not knowing keeps teams. And vendors go unchallenged on claims about data they've never seen.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Cleanup projects, AI projects quietly become.</span><br><span class=\"d\">Forty to one hundred percent of an AI project's effort, the station anticipated, going to fixing the underlying data before any model work happened. None of it budgeted. A vendor certifying data as ready, the board told the same thing, before it wasn't true.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Bad data's ownership defaults to whoever's left.</span><br><span class=\"d\">A company's worst data, acquired years earlier, understood only by a contractor who left and now gets paid a few hours a month to explain it, the scenario included. Eleven years of unowned free text notes. Every AI use case in the building wants to use them anyway.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">No alarm sounds when the answer is simply wrong.</span><br><span class=\"d\">A workaround, a hand-maintained mapping table sitting in front of a revenue process, the material anticipated, quietly producing a confidently wrong contract date for a customer. Nothing to alert on. A loud outage pages someone. A quiet, wrong answer pages no one.</span></span></li></ol>"
  },
  {
   "id": "ice-planet",
   "kicker": "Ice Planet",
   "title": "Use cases, costs, and scope creep",
   "takeaway": "Not how many AI projects get started, the number worth tracking is. How many anyone was ever willing to actually decide to kill or ship.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">Around the arithmetic of AI initiatives, this station was built: how many get started, against how many ever reach production, and what it costs to leave the rest running in place. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Most started use cases never reach production.</span><br><span class=\"d\">A wide count of started AI initiatives against a much smaller number actually live, the scenario anticipated, on the order of dozens started for every handful shipped. The headline number for the whole station, that gap.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Quiet, not killed, is how projects go.</span><br><span class=\"d\">Nobody ever decides a project is dead, the material anticipated as the most common failure. A pilot ends, the team moves on. A handoff between the team that built it and the team that would run it becomes a no that nobody has to own.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Idle costs money too. Nothing sitting still is free.</span><br><span class=\"d\">Unused dev and test environments still billing monthly, the station was built around. A year-long vendor contract priced near a quarter million dollars, serving a single-digit pilot group. Staff kept at partial allocation to a project that isn't moving. None of it a line item anyone reviews.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Scope grows after approval. The budget does not follow.</span><br><span class=\"d\">A project approved for one team, picking up a second region, a compliance and audit log requirement, and an executive's mobile request, the scenario anticipated. None scoped at approval. A budget that doesn't reopen once a project clears its gate, none of it reflected in.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The same shape, the projects that stick share.</span><br><span class=\"d\">Narrow and boring, success looks, the material anticipated: one team, one owner, one metric agreed before the work started, and the human never removed from the loop. Failed efforts tried to automate the person out from the start.</span></span></li></ol>"
  },
  {
   "id": "snow-monster-cave",
   "kicker": "Snow Monster Cave",
   "title": "Development",
   "takeaway": "Not the model, most of the risk in an AI feature is. The missing test plan, the missing on call, and the missing plan for what already shipped.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">What actually happens inside the build of an AI feature, this station was built around: what testing means in practice, who's on call when it breaks, and where the prompt itself really lives. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A vibe check, testing often means.</span><br><span class=\"d\">A handful of happy-path examples in a spreadsheet, the scenario anticipated, an engineer skimming outputs for an afternoon, or a demo for the sponsor. A launch date on the calendar before there was ever a test plan to satisfy.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Passed every test. Broke in production anyway.</span><br><span class=\"d\">A shortened prompt passing over a hundred test cases while silently dropping a required disclaimer in production, the material anticipated, caught by a person reading tickets more than a week later. A retrieval rebuild that passed only because its evals still checked against pre-rebuild data.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Informal by default, on call is.</span><br><span class=\"d\">A small handful of teams with a real on call rotation, the station anticipated, against a much larger number where the real answer was the mobile number of whoever built it, sitting in a runbook. Never agreed to carry it, that person.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">How much of the feature is theirs, nobody agrees.</span><br><span class=\"d\">Wide disagreement about what percentage of an AI feature is genuinely owned code versus a wrapper around someone else's API, the scenario anticipated, ranging from single digits to the majority. Rarely does leadership see that number stated plainly.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">A rollback does not undo what already went out.</span><br><span class=\"d\">Reverting a prompt or model doesn't restore an index already regenerated, teams discovered. The next answer, a rollback fixes. Not the answers already sitting in someone's inbox, or a decision someone already made.</span></span></li></ol>"
  },
  {
   "id": "asteroid-field",
   "kicker": "Asteroid Field",
   "title": "Compliance, legal, and security",
   "takeaway": "Usually isn't the technology that kills an AI use case in this room. An unanswered ownership or consent question that arrives late, that does.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">The compliance, legal, and security questions an AI system raises that most teams can't yet answer, this station was built around. And who is supposed to be the one signing off that it's safe. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Basic legal questions still have no answer.</span><br><span class=\"d\">What data a model was trained on, whether a deletion request actually removes anything from the model, whether a given output is a decision or a recommendation, the scenario anticipated. Simple, these seemed, until asked. Mostly unanswered, they were.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Nobody yet, is the most common answer.</span><br><span class=\"d\">Who signs off that an AI decision or vendor is safe to put in front of a customer, that question, the material anticipated, gets no assigned role most of the time. More work than any technical limitation, the resulting vacuum stalls.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Security review wasn't built for a service that changes itself.</span><br><span class=\"d\">A standard vendor security questionnaire, built for software that ships in versions, the station anticipated, stalling for months against a service whose behavior changes without a release. A new subprocessor with notice that means a page on their own website, a vendor's contract permits.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Already pasting sensitive data in, employees are.</span><br><span class=\"d\">Dozens of AI tools in use against only a few approved, proxy logs turning up, the scenario anticipated. A board deck, a contract, patient information, already pasted into consumer AI tools by people trying to get their work done faster.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Fix one gap, open another.</span><br><span class=\"d\">Audit logging added after the fact to answer what did the system do, the material anticipated, only for the resulting indefinite record of every prompt and output to become its own discoverable liability. Neither problem, scoped against the other.</span></span></li></ol>"
  },

   "title": "What nobody in one room could see",
   "takeaway": "Where AI projects actually get stuck, none of these five rooms disagreed. Not the model. The owner nobody assigned, the number nobody checked, and the change nobody was watching for. Surprised, I am not.",
   "body": "<p class=\"lede\">Nobody has said any of this yet. These are the patterns we expect to connect the five stations, written in advance. The real ones get written on the night, from what the rooms actually say.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Nobody decided, is the default answer.</span><br><span class=\"d\">The same gap kept surfacing across the ice planet, swamp planet, and asteroid field material: no one had ever been assigned to decide a project was finished, own the worst data, or sign off that an AI decision was safe to ship. No formal on call exists for most AI features either, the snow monster cave scenario added. The absence of an owner, more than any technical limit, is what dragged things out. No surprise there.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The number on the page is not the number in production.</span><br><span class=\"d\">A gap between an estimate and reality, every station's material built in: sky city's four to six week sales pitch against nineteen months in production, ice planet's dozens of started projects against a handful shipped, swamp planet's fourteen documented values against sixty real ones. A security questionnaire built for versioned software, asteroid field's, running into a service that changes without ever shipping a version.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Quietly, things change. Downstream, something breaks.</span><br><span class=\"d\">A vendor rolling a model forward and moving processing regions without notice, sky city anticipated. A column rename silently breaking a six-year-old partner integration, swamp planet anticipated. One feature's prompt edit silently breaking a second feature sharing the same prompt, snow monster cave anticipated. A subprocessor change arriving as a webpage notice, asteroid field anticipated. Watching for the change before it landed, none of these scenarios expected anyone to be.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">No alarm sounds for a wrong answer, the way it does for an outage.</span><br><span class=\"d\">Both swamp planet's material and snow monster cave's built toward the same point from different angles: an outage pages somebody immediately, but a confidently wrong answer, a stale contract date, an answer already sent before a rollback, trips no alert. Built for louder failures, no incident process covers it.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Where AI projects actually get stuck, none of these five rooms disagreed. Not the model. The owner nobody assigned, the number nobody checked, and the change nobody was watching for. Surprised, I am not.</div><div class=\"b\">Everything behind this deck, including the station transcripts and the tool that built it, is at <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>. Take it and run this at your own company.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAG    "takeaway": "Every one of these was found by running the thing. Not one was found by reading it.",
   "body": "<p class=\"lede\">This is an AI program too, so it had a bad feeling about itself. Six defects, all of them from rehearsal, none of them from review.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A bug that would have failed live, in this room, tonight</span><br><span class=\"d\">The prompt was passed as a shell argument. Linux caps a single argument at 128KB and five real transcripts come to 285KB, so it worked in every small test and would have died the moment it saw the real thing, with everyone sitting here.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model could quietly promote a failed station to a real one</span><br><span class=\"d\">Which deleted the on-screen warning that exists to prevent precisely that. Not fixed with a better prompt. Fixed by never asking.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A 26-character overrun threw away an entire run</span><br><span class=\"d\">Validation could not tell the difference between output that was wrong and output that was merely too long. Now it can: one rejects, the other gets trimmed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Two models running in parallel were running in sequence</span><br><span class=\"d\">And producing perfect output the whole time. Caught only because a test asserted on elapsed time rather than on the result.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The QR codes rendered as perfectly sized blank squares</span><br><span class=\"d\">Right dimensions, right position, nothing inside. No assertion about the markup would have caught it, so the test now scans the code back with a barcode reader.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">A narrator that changed 9% of the words and passed every check</span><br><span class=\"d\">Correcting one failure produced its exact opposite. The first Elder voice inverted nearly every sentence into something you had to read twice. The fix came back 91% identical to the plain text: it validated perfectly and was pointless on stage. Enforcer landed at 58% of fields rewritten and is now at 100%. Three worked examples per character fixed both, showing one real sentence too weak, right, and too far. The answer to fear is never the obviously wrong one. It is the one that looks exactly right.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Take the whole thing</div><div class=\"b\">The principles above, each with the code that implements it and the defect it caught, plus how to run this format yourself: read RUN-THIS-YOURSELF.md. The runbooks, the tool, the brief and every transcript are public too. Scan any screen, or go to <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHDmT4Bn2uYL2ua1mclrM5O/oW1em5m81jZfMDN5rW1ea5u/YWby    "body": "<p class=\"lede\">Five stations ran in parallel. Nobody was in more than one of them. This deck existed before the last one finished talking.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Every station was recorded to its own meeting, hosted by one person</span><br><span class=\"d\">Not by the pilot running the room. One account owned all five, so no session depended on a presenter remembering to press a button correctly.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Ending the meeting is what starts the transcript</span><br><span class=\"d\">Teams generates a transcript 2.5 to 5 minutes after a meeting is ended, not left. Five staggered endings, then one to three minutes for the model to read every word said in this building and answer. That is the budget you just watched us spend, and every number in it was measured in rehearsal.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model was given the transcripts and a written brief, and asked for data</span><br><span class=\"d\">Not for a deck. It returns structured content, which is checked against a schema before anything is rendered. Wrong shape, wrong station name, too many bullets: rejected, and the previous deck stands.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The slides you are looking at were generated by code, not by the model</span><br><span class=\"d\">Order, branding, navigation, this screen, the QR code: all deterministic. The model only wrote the parts that needed judgment about what was said.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Two models ran at once, and it was not a race</span><br><span class=\"d\">A fast standby answered the same question in parallel. The good model got the whole deadline to itself and the standby was only used if it missed. Measured on the night's transcripts: 81 seconds against 167. A race would have handed you the weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy was built <b>before the stations ran</b>, from the question lists and the answers we expected to hear. It is the floor, not the deck: if every recording in the building had failed, this is what you would be looking at, and it would say so on every screen. Written by the primary model. Generated 2026-09-16 18:16.</div></div>"

   "takeaway": "Give the model the judgment call. Never give it anything you could check by machine instead.",
   "body": "<p class=\"lede\">Nothing here needed a better model. It needed the unglamorous things around the model to be decided in advance, and every one of them is a thing your program can do on Monday.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Deterministic wherever determinism is available</span><br><span class=\"d\">The model wrote the words. Code decided the running order, the branding, which stations are flagged, the navigation, the QR, and this sentence. A model that cannot choose the running order cannot get the running order wrong. Shrink what it is allowed to decide and you shrink what a human has to check at 7:50pm.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Never ask a model a question you can already answer</span><br><span class=\"d\">Which stations produced a real recording is a fact sitting on a disk. The deck reads it from there and throws away whatever the model says about it. That closed a real hole: a model that relabelled a failed station as a real one silently deleted the warning built to catch exactly that.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Constrain the output until it can be validated</span><br><span class=\"d\">It returns JSON against a fixed schema, not slides. Unknown station, missing station, too many bullets: rejected, and the deck already on disk stands untouched. You cannot check free text. You can check a schema.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Write the evals before the night, and test the disasters</span><br><span class=\"d\">137 automated checks across 24 rehearsals of this evening, including no transcript at all, prose instead of JSON, a crashed CLI, a transcript arriving late, and a narrator quietly dropping the numbers. The happy path is the least useful thing you can test.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Score the things you would otherwise argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"

   "takeaway": "The real cost of a third-party AI tool was never in the demo. It was in the contract's fine print and the vendor's next silent change, and you signed before you read either.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is what this station's pilot planned to ask and the answers we expect to hear, written in advance and published so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station existed to find the gap between what the vendor demoed and what you actually shipped, and to find out who answers for it when the vendor changes something without asking. You already know the answer. Nobody does. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">You demoed on their data, not yours</span><br><span class=\"d\">A summarization demo ran on twenty short, single-language, clean-audio calls. A document-extraction demo ran only on the vendor's own samples. Your calls are multilingual, your audio overlaps with hold music, and you have millions of documents no demo ever touched. You saw clean data and called it proof.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The contract read one way. The bill read another.</span><br><span class=\"d\">A seat was defined as any individual whose data is processed, not a person who logs in. You sized for roughly 400 users and got billed against thousands. A rate limit was sold to you as dedicated capacity. It was a shared regional pool that thins out on the first Monday of every month. You read the words you wanted to read.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">You find out last</span><br><span class=\"d\">A model was rolled forward quietly. Your output changed and you did not notice for over a week. A deprecation notice went to a mailbox nobody owned. Processing moved to a new region for latency and broke a data residency commitment you made to Legal. You found it in a changelog. Nobody was watching.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The pitch said weeks. It cost you months.</span><br><span class=\"d\">You were sold four to six weeks. It took four to nineteen months to get anything real running, and the time went to identity and access review and security sign-off, not the model. You believed the slide.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">You didn't price the exit</span><br><span class=\"d\">Getting your own data back out in a usable format cost you near eighty five thousand dollars in services fees. Hundreds of people had already built their habits around the tool. None of it was in the contract you signed, because you never asked what leaving would cost.</span></span></li></ol>"
