<title>The Throne Room, ATP September 17, 2026 (pre-seeded)</title>
<style>
  :root {
    /* Everything sizes off --fs so presentation mode is one number, not a restyle.
       --s is nudged live with + and - because the only way to know what reads from
       the back of a particular room is to stand in it. */
    --base-fs: 15px;
    --s: 1;
    --fs: calc(var(--base-fs) * var(--s));
    --maxw: 940px;
    /* Set per screen from THEMES. The defaults here are the method-screen palette. */
    --brand: #2C6FBF;
    --page: #f5f7f8;
    --warnbg: #fdf6ee;
    --warn: #B4610C;
    --ink: #14181a;
    --ink-2: #4a5257;
    --ink-3: #697276;
    --line: #e3e7e9;
    --fill: #f5f7f8;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page); color: var(--ink);
    transition: background 320ms ease, color 200ms ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: var(--fs); line-height: 1.5;
  }
  /* Presentation mode is one number. Everything sizes off --fs, so doubling --s
     doubles the whole deck rather than restyling it screen by screen. */
  :root.presenting { --s: 2; --maxw: 1760px; }
  :root.presenting .shell { padding: 12px 16px 20px; }
  :root.presenting .stage { padding: 20px 26px 18px; }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.55); }
  :root.presenting .lede { margin-bottom: calc(var(--fs) * 0.7); }
  :root.presenting .rule { margin: 10px 0 16px; }
  :root.presenting .takeaway { margin-top: calc(var(--fs) * 0.7); }
  /* Headline big, detail a step down. On a projector the headline is what carries the
     room and the detail is what the phone is for. */
  /* The projector shows headlines. The phone shows the detail.

     This is not a compromise, it is the measurement: five headlines each followed by
     two lines of detail needs 1458px of a 993px screen at readable type, so something
     has to go, and it should be the thing nobody reads off a wall in a bar. Headlines
     plus the takeaway is a slide. Headlines plus 400 characters of detail is a document
     being projected at people. Press D to reveal the detail on any screen. */
  :root.presenting ol.points .d { display: none; }
  :root.presenting.details ol.points .d { display: block; font-size: calc(var(--fs) * .72); }
  :root.presenting ol.points .t { font-size: calc(var(--fs) * 1.05); }
  :root.presenting ol.points li { margin-bottom: calc(var(--fs) * 0.42); }
  :root.presenting .follow { margin-top: 8px; padding-top: 8px; }
  :root.presenting .follow .t { font-size: calc(var(--fs) * .55); }
  /* Big enough to scan from the back of the room, which is the only size that counts.
     A QR only the front two rows can reach is decoration. */
  :root.presenting .followqr { width: calc(var(--fs) * 4.6); }
  :root.presenting .follow .t { font-size: calc(var(--fs) * .62); }
  .shell { max-width: var(--maxw); margin: 0 auto; padding: 28px 24px 64px; }
  .stage { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 34px 38px 30px;
           box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 14px 44px rgba(0,0,0,.12); }

  .rail { display: flex; gap: 4px; margin-bottom: 22px; }
  .rail span { flex: 1; height: 3px; background: var(--line); cursor: pointer; }
  .rail span.done { background: var(--ink-3); }
  .rail span.now { background: var(--brand); }

  .topline { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .wordmark { color: var(--brand); font-weight: 800; letter-spacing: .18em; font-size: calc(var(--fs) * .8); }
  .divider-v { width: 1px; height: 12px; background: var(--line); }
  .kicker { font-size: calc(var(--fs) * .8); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
  .count { margin-left: auto; font-size: calc(var(--fs) * .8); color: var(--ink-3); font-variant-numeric: tabular-nums; }

  h1 { font-size: calc(var(--fs) * 1.6); line-height: 1.25; margin: 4px 0 0; font-weight: 650; }
  .rule { width: 48px; height: 2px; background: var(--brand); margin: 12px 0 24px; }
  p { margin: 0 0 12px; }
  .lede { font-size: calc(var(--fs) * 1.07); margin-bottom: 20px; }

  ol.points { list-style: none; margin: 0; padding: 0; }
  ol.points li { display: flex; gap: 14px; margin-bottom: 15px; }
  ol.points .n { color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; min-width: calc(var(--fs) * 1.35); }
  ol.points .t { font-weight: 600; }
  ol.points .d { color: var(--ink-2); }

  .pill { display: inline-block; font-size: calc(var(--fs) * .7); letter-spacing: .07em; font-weight: 700;
          color: var(--brand); border: 1px solid var(--brand); border-radius: 3px;
          padding: 1px 6px; vertical-align: 2px; margin-left: 4px; }
  .pill.warn { color: var(--warn); border-color: var(--warn); }

  .flag { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
          color: var(--ink-2); padding: 11px 14px; border-radius: 4px; margin-bottom: 18px; font-size: calc(var(--fs) * .93); }
  .flag b { color: var(--warn); }

  .callout { border: 1px solid var(--line); border-left: 3px solid var(--brand); background: var(--fill);
             padding: 12px 14px; border-radius: 4px; margin-top: 20px; }
  .callout .h { font-weight: 650; margin-bottom: 4px; }
  .callout .b { color: var(--ink-2); }
  .qr { display: block; width: 132px; height: 132px; margin: 12px 0 2px; image-rendering: pixelated; }

  .takeaway { border-left: 3px solid var(--brand); background: var(--fill); padding: 10px 14px; margin-top: 24px; }
  .takeaway .h { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-bottom: 3px; }
  .takeaway .b { font-weight: 600; }

  .nav { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  button { font: inherit; font-size: calc(var(--fs) * .87); padding: 6px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--fill); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  .nav .right { margin-left: auto; font-size: calc(var(--fs) * .8); color: var(--ink-3); }

  .voices { display: flex; align-items: center; gap: 6px; margin-top: 14px;
            padding-top: 14px; border-top: 1px solid var(--line); }
  .voices .lab { font-size: calc(var(--fs) * .77); letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-right: 4px; }
  .voices button { font-size: calc(var(--fs) * .8); padding: 4px 10px; }
  .voices button.on { background: var(--brand); color: var(--bg); border-color: var(--brand); }
  /* Demo builds carry this on every screen, not just the first. A page of invented
     people and invented numbers sitting at a public URL has to say so wherever the
     reader happens to land, including on a deep link straight into station four. */
  /* Selecting a narrator on a screen that never changes voice used to do nothing at
     all, with the only explanation in small grey type at the far edge of the voice
     bar. The deck opens on one of those screens, so the first thing anyone tried
     looked broken. Say it where they are looking. */
  .voicenote { border-left: 3px solid var(--brand); background: var(--fill);
               padding: 9px 13px; border-radius: 4px; margin-bottom: 18px;
               font-size: calc(var(--fs) * .85); color: var(--ink-2); }
  .voicenote b { color: var(--ink); }

  .demobar { border: 1px solid var(--warn); border-left-width: 3px; background: var(--warnbg);
             color: var(--ink-2); padding: 9px 13px; border-radius: 4px;
             margin-bottom: 16px; font-size: calc(var(--fs) * .8); }
  .demobar b { color: var(--warn); }

  .follow { display: flex; align-items: center; gap: 12px; margin-top: 12px;
            padding-top: 12px; border-top: 1px solid var(--line); }
  .followqr { width: 62px; aspect-ratio: 1 / 1; flex: none; display: block;
              background: #fff; padding: 4px; border-radius: 3px; }
  .follow .t { font-size: calc(var(--fs) * .8); color: var(--ink-3); line-height: 1.45; }
  .follow .t b { color: var(--ink-2); }
  .follow .u { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: calc(var(--fs) * .72); color: var(--ink-3); word-break: break-all; }

  .voices .hint { margin-left: auto; font-size: calc(var(--fs) * .77); color: var(--ink-3); }

  #printAll { display: none; }
  @media print {
    body { background: #fff; --page: #fff; }
    .rail, .nav, .stage { display: none !important; }
    .shell { max-width: none; padding: 0; }
    #printAll { display: block; }
    #printAll .page { page-break-after: always; padding: 0 0 24px; }
    #printAll .page:last-child { page-break-after: auto; }
  }
</style>

 "straight": [

   "title": "Five rooms, one picture, ten minutes",
   "takeaway": "The AI did the reading. Everything that had one correct answer was done by code.",
   "body": "<p class=\"lede\">Five stations ran in parallel. Nobody was in more than one of them. This deck existed before the last one finished talking.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Every station was recorded to its own meeting, hosted by one person</span><br><span class=\"d\">Not by the pilot running the room. One account owned all five, so no session depended on a presenter remembering to press a button correctly.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Ending the meeting is what starts the transcript</span><br><span class=\"d\">Teams generates a transcript 2.5 to 5 minutes after a meeting is ended, not left. Five staggered endings, then one to three minutes for the model to read every word said in this building and answer. That is the budget you just watched us spend, and every number in it was measured in rehearsal.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">The model was given the transcripts and a written brief, and asked for data</span><br><span class=\"d\">Not for a deck. It returns structured content, which is checked against a schema before anything is rendered. Wrong shape, wrong station name, too many bullets: rejected, and the previous deck stands.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The slides you are looking at were generated by code, not by the model</span><br><span class=\"d\">Order, branding, navigation, this screen, the QR code: all deterministic. The model only wrote the parts that needed judgment about what was said.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Two models ran at once, and it was not a race</span><br><span class=\"d\">A fast standby answered the same question in parallel. The good model got the whole deadline to itself and the standby was only used if it missed. Measured on the night's transcripts: 81 seconds against 167. A race would have handed you the weaker deck most times it ran.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">There was always a deck</span><br><span class=\"d\">A version of this file was built days ago from the question lists alone. Three rungs down from here, and every one of them presentable: the good model, the standby on the real transcripts, then that. Nothing could leave us with nothing.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Provenance of this copy</div><div class=\"b\">This copy was built <b>before the stations ran</b>, from the question lists and the answers we expected to hear. It is the floor, not the deck: if every recording in the building had failed, this is what you would be looking at, and it would say so on every screen. Written by the primary model. Generated 2026-09-11 15:48.</div></div>"
  },
  {
   "id": "reliability",
   "kicker": "The transferable part",
   "title": "Why this worked when your AI program did not",
   "takeaway": "Give the model the judgment call. Never give it anything you could check by machine instead.",
   "body": "<p class=\"lede\">Nothing here needed a better model. It needed the unglamorous things around the model to be decided in advance, and every one of them is a thing your program can do on Monday.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Deterministic wherever determinism is available</span><br><span class=\"d\">The model wrote the words. Code decided the running order, the branding, which stations are flagged, the navigation, the QR, and this sentence. A model that cannot choose the running order cannot get the running order wrong. Shrink what it is allowed to decide and you shrink what a human has to check at 7:50pm.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Never ask a model a question you can already answer</span><br><span class=\"d\">Which stations produced a real recording is a fact sitting on a disk. The deck reads it from there and throws away whatever the model says about it. That closed a real hole: a model that relabelled a failed station as a real one silently deleted the warning built to catch exactly that.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Constrain the output until it can be validated</span><br><span class=\"d\">It returns JSON against a fixed schema, not slides. Unknown station, missing station, too many bullets: rejected, and the deck already on disk stands untouched. You cannot check free text. You can check a schema.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Write the evals before the night, and test the disasters</span><br><span class=\"d\">137 automated checks across 24 rehearsals of this evening, including no transcript at all, prose instead of JSON, a crashed CLI, a transcript arriving late, and a narrator quietly dropping the numbers. The happy path is the least useful thing you can test.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Score the things you would otherwise argue about</span><br><span class=\"d\">Did the voices keep every figure? Diffed, not eyeballed. Did a voice change anything worth a button? Under 60% of fields rewritten and it is flagged. Too many jokes on one slide? Counted. Each one replaced a judgement call somebody would have had to make under time pressure, badly.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">Measure it, do not estimate it</span><br><span class=\"d\">The run of show budgeted one minute for this synthesis. Measured against real full-length transcripts it is 69 to 167 seconds, and the slowest run was on the smallest input. Every number on the first screen came from a stopwatch.</span></span></li></ol>"
  },
  {
   "id": "sky-city",
   "kicker": "Sky City",
   "title": "Infrastructure and integration with third-party tools",
   "takeaway": "Read the contract as if it were a runbook. Every number in it will be tested by production, and by other customers, at the worst possible time.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was set up to trace the moment a vendor deal negotiated in good faith changed underneath the buyer, and what it cost to find out in production rather than in contract review. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">The demo ran clean; production did not</span><br><span class=\"d\">The agenda started with what the sales demo left out. The likely gap: a clean slice of data, one tenant, no real load, so the first week of real traffic is where the difference shows up.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Contract numbers that mean something else under load</span><br><span class=\"d\">Rate limits, token counts, and per-seat prices were all on the list. The expected surprise is a shared rate limit written as if it were dedicated capacity, fine until other customers have their busy Monday too.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Vendors changing things nobody agreed to</span><br><span class=\"d\">A model or API version swapped in on the vendor's schedule, with no pinning available on the tier actually purchased, and no regression test watching output quality when it moves.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Signing to production: months, not weeks</span><br><span class=\"d\">The station was designed to collect a number of months from everyone in the room. The expected range is six to nine months against a sales pitch measured in weeks, with the time going to integration work nobody scoped.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The clause to refuse next Monday</span><br><span class=\"d\">The closing question asked for one line each. The likely answers: no version pinning, no real exit clause, and no data export in a format the buyer controls.</span></span></li></ol>"

  {
   "id": "swamp-planet",
   "kicker": "Swamp Planet",
   "title": "Technical debt and data quality",
   "takeaway": "Profile the data before promising anything to anyone. An honest audit up front is cheaper than learning the truth in front of a customer.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was built around the data nobody cleaned, the schema nobody updated, the owner who left, and the pilot that became production without ever being rebuilt. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">The schema and the contents diverged years ago</span><br><span class=\"d\">The first question asked what an AI system revealed about data on first contact. The expected answer: the documented schema and the real contents parted ways long ago, and everyone downstream had been quietly working around it.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Most of the AI budget goes to cleanup</span><br><span class=\"d\">The room was asked for a percentage each. Seventy to eighty percent of effort turning into data cleanup is the commonly quoted split, and the seeded expectation is that none of it was in the original budget.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Nobody owns the worst data</span><br><span class=\"d\">The likely location is customer records tangled by a merger or acquisition, owned by nobody since the one person who understood them left the company.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Pilots running production on one laptop</span><br><span class=\"d\">A notebook, a script on one machine, or a prompt in a vendor console running a real business process, held up by the person who wrote it and nothing else.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Silence is the failure mode</span><br><span class=\"d\">When bad data produces a confidently wrong answer, the expectation is that a customer or someone downstream notices before any monitor does. An outage would at least have been loud.</span></span></li></ol>"
  },
  {
   "id": "ice-planet",
   "kicker": "Ice Planet",
   "title": "Use cases, costs, and scope creep",
   "takeaway": "Stalled is a decision, and every month it goes unmade it costs cloud spend, attention, and the credibility of whatever gets proposed next.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was aimed at the use cases stuck at the outpost: not cancelled, not shipped, waiting on a decision nobody has made while the cost meter runs and the scope quietly grows. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Double digits started, single digits live</span><br><span class=\"d\">The opening question asked for two numbers from everyone and a running total. The expected ratio is double-digit starts against low single-digit production, and that ratio is the whole story of the station.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Stalls happen in the handoff</span><br><span class=\"d\">The most common reason on the agenda is no named owner with budget authority once the pilot ends. It stalls between the team that built it and the team that would have to run it.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Scope grows in every direction at once</span><br><span class=\"d\">A single workflow is expected to pick up a compliance review, a second business unit, and an executive's pet feature before anyone goes back and re-scopes the budget.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Production cost is a multiple, and not from tokens</span><br><span class=\"d\">The room was asked for a multiple, not a percentage. The likely surprise lines are the people reviewing output, the seats nobody counted, and usage that grew with success, rather than the token price.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">What it takes to ship next quarter</span><br><span class=\"d\">The closer asked what would have to be true. The expected list is short and not technical: a named production owner, a support model, and one executive willing to accept the risk in writing.</span></span></li></ol>"
  },
  {
   "id": "snow-monster-cave",
   "kicker": "Snow Monster Cave",
   "title": "Dev",
   "takeaway": "The model integration is not what eats the time. The eval set, the on-call plan, and deciding who owns it after the builder moves on are.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was about what happens inside the build: what tested means, who is on call at 2am, where the prompt lives, and which engineer ends up holding all of it when something breaks. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Tested meant a handful of hand-checked examples</span><br><span class=\"d\">The first question invited one phrase each, with vibes as an acceptable answer. The expected reality is a few examples someone said looked right, with the deadline making the call rather than a person.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Passed every test, broke at volume</span><br><span class=\"d\">A prompt or model version bump that looked fine against the eval set and shifted tone or accuracy under real traffic, caught by a user complaint before any dashboard flagged it.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">On call is whoever built it, informally</span><br><span class=\"d\">The room was asked to count formal on-call rotations for AI features. The expected answer is the one or two engineers who built it, carrying it because it never went through the process that assigns a real rotation.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The prompt lives in three places</span><br><span class=\"d\">Source control, a vendor console, and at least one laptop. The cost on the agenda: a change nobody could trace, made by someone who did not know a second feature depended on the same prompt.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Rollback is a partial fix at best</span><br><span class=\"d\">You can pin the model and revert the prompt, but you cannot force the vendor's underlying weights back, so a rollback sometimes only fixes half the problem.</span></span></li></ol>"

  {
   "id": "asteroid-field",
   "kicker": "Asteroid Field",
   "title": "Compliance, legal, and security",
   "takeaway": "The review usually catches a data flow nobody had drawn. Grudging agreement it was cheaper caught there than in an incident, with a minority insisting it only ever slowed things down.",
   "body": "<div class=\"flag\"><b>This session has not happened yet.</b> You are early. What follows is the question list this station's pilot prepared and the answers we expect to hear, published in advance so the link works before anyone needs it. On the night it is replaced by what the room actually said.</div><p class=\"lede\">This station was about the compliance, legal, and security review everyone dreaded and went through anyway: what it caught, what going around it cost, and what employees were doing with AI tools the whole time. <span class=\"pill warn\">PREVIEW</span></p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">The questions Legal asks that nobody can answer</span><br><span class=\"d\">Where the training data came from, and whether the output can be explained to a regulator in plain language, were the expected unanswerable questions on the agenda.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">Nobody wants to sign off</span><br><span class=\"d\">The room was asked to name the role that certifies an AI decision or vendor as safe for customers, and to count how many say nobody yet. The expected finding is that this vacuum stalls more work than any technical limit.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Security review was not built for a moving target</span><br><span class=\"d\">A review process designed for systems with releases meets a system whose behavior changes without one. The expected outcomes are passing something it should not have, or stalling indefinitely.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">More tools than approved, more data than classified</span><br><span class=\"d\">Customer records, contracts, and source code pasted into consumer chat tools before any policy existed. The room was expected to split on blocking versus enabling, with blockers admitting it did not stop.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">Insurers ask first, regulators stay silent</span><br><span class=\"d\">Cyber insurers with a line or two on the questionnaire, auditors starting to ask where AI touches financial reporting, and regulators mostly quiet, which is harder to design for than a strict rule.</span></span></li></ol>"
  },

   "takeaway": "Five stations, five different failures on the agenda, and one missing thing under all of them: a named person who agreed, in writing, to own what happens after the demo.",
   "body": "<p class=\"lede\">Nobody has said any of this yet. These are the patterns we expect to connect the five stations, written in advance. The real ones get written on the night, from what the rooms actually say.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">Nobody owns it after the pilot</span><br><span class=\"d\">Every station's agenda circles the same vacuum. Ice Planet's stalls happen in the handoff to whoever would run it. Snow Monster Cave's on-call falls to whoever built it. Swamp Planet's worst data has no owner. Asteroid Field cannot find anyone to sign off. The missing role, not the missing technology, is the common blocker.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The system changes without a release</span><br><span class=\"d\">Sky City's vendor swaps model versions on its own schedule. Snow Monster Cave cannot roll back the vendor's weights. Asteroid Field's security review was built for software that ships in versions. Three stations independently hit the same problem: the thing under review keeps moving after review ends.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">Silence is the alarm nobody hears</span><br><span class=\"d\">Swamp Planet expects confidently wrong answers to be caught by customers, not monitors. Snow Monster Cave expects user complaints to beat dashboards. Sky City expects output quality to drift with nobody watching. An outage is loud. A wrong answer is quiet, and quiet is what these systems produce when they fail.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">The cost was never in the budget</span><br><span class=\"d\">Sky City's integration months, Swamp Planet's seventy to eighty percent cleanup, Ice Planet's review headcount and uncounted seats, Asteroid Field's audit logs and human review added after the fact. Each station's agenda names a cost that is well known and still treated as a surprise every time.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The fix is a sentence, not a system</span><br><span class=\"d\">Each closing question was expected to land on something short. A contract clause. Profile the data first. A named owner and one executive's signature. An on-call plan. The room was not expected to ask for better models anywhere. It was expected to ask for decisions somebody was willing to write down.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Five stations, five different failures on the agenda, and one missing thing under all of them: a named person who agreed, in writing, to own what happens after the demo.</div><div class=\"b\">Everything behind this deck, including the station transcripts and the tool that built it, is at <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>. Take it and run this at your own company.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0    "body": "<p class=\"lede\">This is an AI program too, so it had a bad feeling about itself. Six defects, all of them from rehearsal, none of them from review.</p><ol class=\"points\"><li><span class=\"n\">01</span><span><span class=\"t\">A bug that would have failed live, in this room, tonight</span><br><span class=\"d\">The prompt was passed as a shell argument. Linux caps a single argument at 128KB and five real transcripts come to 285KB, so it worked in every small test and would have died the moment it saw the real thing, with everyone sitting here.</span></span></li><li><span class=\"n\">02</span><span><span class=\"t\">The model could quietly promote a failed station to a real one</span><br><span class=\"d\">Which deleted the on-screen warning that exists to prevent precisely that. Not fixed with a better prompt. Fixed by never asking.</span></span></li><li><span class=\"n\">03</span><span><span class=\"t\">A 26-character overrun threw away an entire run</span><br><span class=\"d\">Validation could not tell the difference between output that was wrong and output that was merely too long. Now it can: one rejects, the other gets trimmed.</span></span></li><li><span class=\"n\">04</span><span><span class=\"t\">Two models running in parallel were running in sequence</span><br><span class=\"d\">And producing perfect output the whole time. Caught only because a test asserted on elapsed time rather than on the result.</span></span></li><li><span class=\"n\">05</span><span><span class=\"t\">The QR codes rendered as perfectly sized blank squares</span><br><span class=\"d\">Right dimensions, right position, nothing inside. No assertion about the markup would have caught it, so the test now scans the code back with a barcode reader.</span></span></li><li><span class=\"n\">06</span><span><span class=\"t\">A narrator that changed 9% of the words and passed every check</span><br><span class=\"d\">Correcting one failure produced its exact opposite. The first Sage voice inverted nearly every sentence into something you had to read twice. The fix came back 91% identical to the plain text: it validated perfectly and was pointless on stage. The Admiral landed at 58% of fields rewritten and is now at 100%. Three worked examples per character fixed both, showing one real sentence too weak, right, and too far. The answer to fear is never the obviously wrong one. It is the one that looks exactly right.</span></span></li></ol><div class=\"callout\"><div class=\"h\">Take the whole thing</div><div class=\"b\">The principles above, each with the code that implements it and the defect it caught, plus how to run this format yourself: read RUN-THIS-YOURSELF.md. The runbooks, the tool, the brief and every transcript are public too. Scan any screen, or go to <b>https://github.com/atpconnect/atp-ai-bad-feeling</b>.</div><img class=\"qr\" alt=\"QR code to https://github.com/atpconnect/atp-ai-bad-feeling\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAALkCAYAAABHpCBlAAAAAklEQVR4AewaftIAABOQSURBVO3BgQ0cSQ4EsJLg/FOuvxy+DXmwJKf/CQAAcGIDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJz5k79kZgKvtM0XzEy+oG1em5l8Rdv8qpnJa23z2szkK9rmC2Ymr7XNF8xM4JW2eW0DAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABw5k8+pG34t81MflnbvDYzeW1m8stmJl/QNr+qbb5iZvIFbcM7bcO/b2byBRsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzGwAA4MwGAAA4swEAAM5sAACAMxsAAODMBgAAOLMBAADObAAAgDMbAADgzAYAADizAQAAzmwAAIAzf/LjZia/qm1+2czktbb5VW3z2szkb2ib12Ymr81MvmBm8lrbvDYz+Yq24TfNTH5V2/yqDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJk/AZ6ZmbzWNq/NTF6bmbzWNn/DzORXtQ1vtc1rM5PX2ua1mclrbQO/ZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHBmAwAAnNkAAABnNgAAwJkNAABwZgMAAJzZAAAAZzYAAMCZDQAAcGYDAACc2QAAAGc2AADAmQ0AAHDmT4Bn2uYL2ua1mclrM5O/oW1em5m81jZfMDN5rW1ea5u/YW const VOICES = [["straight", "Straight"]];
const UNVOICED = ["method", "reliability", "receipts"];
const THEMES = {"sky-city": {"bg": "radial-gradient(1200px 520px at 12% 8%, #FFE7C7 0%, rgba(255,231,199,0) 62%), radial-gradient(900px 420px at 88% 22%, #FFD1B0 0%, rgba(255,209,176,0) 60%), radial-gradient(1000px 500px at 50% 100%, #F7B98A 0%, rgba(247,185,138,0) 65%), linear-gradient(170deg, #FFF3E2 0%, #FBD9BC 55%, #EFA97A 100%)", "surface": "#FFFBF5", "fill": "#FBF1E4", "line": "#EBDCC8", "ink": "#2A1A0C", "ink2": "#5C4531", "ink3": "#7A6047", "accent": "#9A4F08", "warn": "#8F4B08", "warnbg": "#FDF1E1"}, "swamp-planet": {"bg": "radial-gradient(900px 480px at 20% 10%, #2C4020 0%, rgba(44,64,32,0) 60%), radial-gradient(760px 420px at 82% 78%, #1B3018 0%, rgba(27,48,24,0) 62%), linear-gradient(165deg, #16210F 0%, #1B2A13 50%, #0E170A 100%)", "surface": "#1E2C15", "fill": "#26361B", "line": "#3A4E2C", "ink": "#EDF3E4", "ink2": "#C3D2B2", "ink3": "#9DB088", "accent": "#A8D06A", "warn": "#E8B45C", "warnbg": "#33280F"}, "ice-planet": {"bg": "radial-gradient(1100px 480px at 24% 6%, #FFFFFF 0%, rgba(255,255,255,0) 60%), radial-gradient(900px 500px at 78% 82%, #BFDCEC 0%, rgba(191,220,236,0) 62%), linear-gradient(175deg, #F2F9FD 0%, #DCEBF5 55%, #C2DAEA 100%)", "surface": "#FFFFFF", "fill": "#F0F7FB", "line": "#D6E5EF", "ink": "#0E2430", "ink2": "#3A5665", "ink3": "#5B7787", "accent": "#0F5B78", "warn": "#8F4B08", "warnbg": "#FDF1E1"}, "snow-monster-cave": {"bg": "radial-gradient(820px 420px at 78% 12%, #3A1E1B 0%, rgba(58,30,27,0) 62%), radial-gradient(900px 500px at 14% 88%, #2A1412 0%, rgba(42,20,18,0) 60%), linear-gradient(170deg, #1A1110 0%, #241514 55%, #0F0908 100%)", "surface": "#241615", "fill": "#2E1C1A", "line": "#452926", "ink": "#F6E9E7", "ink2": "#D6B8B4", "ink3": "#B08F8B", "accent": "#F0736B", "warn": "#F0A35C", "warnbg": "#3A2412"}, "asteroid-field": {"bg": "radial-gradient(2px 2px at 18% 22%, #7C8B95 0%, rgba(124,139,149,0) 100%), radial-gradient(3px 3px at 62% 14%, #6B7A85 0%, rgba(107,122,133,0) 100%), radial-gradient(2px 2px at 84% 62%, #7C8B95 0%, rgba(124,139,149,0) 100%), radial-gradient(900px 520px at 70% 20%, #1D242A 0%, rgba(29,36,42,0) 64%), linear-gradient(168deg, #0C0F12 0%, #141A1F 55%, #080A0C 100%)", "surface": "#171B1E", "fill": "#1F262B", "line": "#333D44", "ink": "#E9EDF0", "ink2": "#B8C2C9", "ink3": "#93A0A8", "accent": "#7FB4D4", "warn": "#E8B45C", "warnbg": "#2A2412"}};
const DEFAULT_THEME = {"bg": "#f5f7f8", "surface": "#ffffff", "fill": "#f5f7f8", "line": "#e3e7e9", "ink": "#14181a", "ink2": "#4a5257", "ink3": "#697276", "accent": "#2C6FBF", "warn": "#B4610C", "warnbg": "#fdf6ee"};
const QRS = {"method": "", "reliability": "", "sky-city": "", "swamp-planet": "", "ice-planet": "", "snow-monster-cave": "", "asteroid-field": "", "patterns": "", "receipts": ""};            // screen id -> inline SVG, one per screen, not per voice
const FOLLOW_URL = "https://atpconnect.github.io/atp-ai-bad-feeling/closeout/presentation.html";
const DEMO_NOTICE = "";
let i = 0;
let voice = "straight";
const el = id => document.getElementById(id);
const screens = () => DECKS[voice] || DECKS.straight;

// Themes are applied by setting the CSS variables, so one object drives the whole
// look of a screen and nothing about the layout knows which station it is on.
const VARS = {surface: "--bg", fill: "--fill", line: "--line", ink: "--ink",
              ink2: "--ink-2", ink3: "--ink-3", accent: "--brand", warn: "--warn",
              warnbg: "--warnbg", bg: "--page"};
function themeFor(id) { return THEMES[id] || DEFAULT_THEME; }
function applyTheme(id) {
  const t = themeFor(id), st = document.documentElement.style;
  for (const k in VARS) st.setProperty(VARS[k], t[k]);
}
function themeVars(id) {  // inline form, for the print view where each page differs
  const t = themeFor(id);
  return Object.keys(VARS).map(k => VARS[k] + ":" + t[k]).join(";");
}

const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };

let scale = parseFloat(load("atp-scale", "")) || 0;
let presenting = load("atp-presenting", "0") === "1";

function applyMode() {
  document.documentElement.classList.toggle("presenting", presenting);
  // A saved nudge only means anything for the mode it was set in.
  document.documentElement.style.setProperty("--s", scale || (presenting ? 2 : 1));
  store("atp-presenting", presenting ? "1" : "0");
  autofit();
}

// Shrink until the screen fits the screen. A projector cannot scroll, and the takeaway
// is the last thing on every slide, so anything that overflows takes the line for the
// room with it. Skipped the moment the presenter nudges the size by hand: at that point
// they are standing in the room and know better than this does.
function autofit() {
  if (!presenting || scale) return;
  const root = document.documentElement;
  let s = 2;
  root.style.setProperty("--s", s);
  while (s > 1.15 && root.scrollHeight > window.innerHeight) {
    s = Math.round((s - 0.05) * 100) / 100;
    root.style.setProperty("--s", s);
  }
}
function nudge(delta) {
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--s")) || 1;
  scale = Math.min(5, Math.max(0.6, Math.round((cur + delta) * 20) / 20));
  store("atp-scale", scale);
  applyMode();
}

function setVoice(v) {
  if (!DECKS[v]) return;
  voice = v;
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.classList.toggle("on", b.dataset.voice === v));
  render();
}

function render() {
  const SCREENS = screens();
  const s = SCREENS[i];
  applyTheme(s.id);
  if (DEMO_NOTICE) { el("demobar").hidden = false; el("demobar").innerHTML = DEMO_NOTICE; }
  el("kicker").textContent = s.kicker.toUpperCase();
  el("count").textContent = (i + 1) + " / " + SCREENS.length;
  el("title").textContent = s.title;
  el("body").innerHTML = s.body;
  el("takeaway").textContent = s.takeaway;

  const rail = el("rail");
  rail.innerHTML = "";
  SCREENS.forEach((sc, n) => {
    const seg = document.createElement("span");
    seg.title = (n + 1) + ". " + sc.title;
    seg.className = n === i ? "now" : n < i ? "done" : "";
    seg.onclick = () => { i = n; render(); };
    rail.appendChild(seg);
  });

  if (FOLLOW_URL) {
    el("follow").hidden = false;
    el("followQr").innerHTML = QRS[s.id] || "";
    el("followUrl").textContent = FOLLOW_URL + "#" + s.id;
  }
  // The address bar always points at the screen on show, so the presenter's own URL
  // is shareable mid-talk and a scanned deep link lands on the right slide.
  try { history.replaceState(null, "", "#" + s.id); } catch (e) {}
  autofit();

  el("prev").disabled = i === 0;
  el("next").disabled = i === SCREENS.length - 1;
  const unvoiced = UNVOICED.indexOf(s.id) !== -1;
  const label = (VOICES.find(v => v[0] === voice) || ["", ""])[1];
  el("voiceHint").textContent =
    unvoiced ? "this screen is ours, so it stays straight"
             : "keys 1-" + VOICES.length + ", V to cycle, P to project, D for detail";

  // Say plainly why nothing changed, on the screen where nothing changed.
  const note = el("voicenote");
  if (unvoiced && voice !== "straight") {
    note.hidden = false;
    note.innerHTML = "<b>" + label + " is not narrating this screen.</b> The screens about " +
      "how this was built are ours, not the model's, so they stay in one voice. " +
      "Move to any station screen and " + label + " takes over.";
  } else {
    note.hidden = true;
  }
  // Dim the buttons here too, so the control looks as inert as it is.
  document.querySelectorAll("#voiceButtons button").forEach(b => {
    b.style.opacity = unvoiced && b.dataset.voice !== "straight" ? "0.45" : "";
  });
  window.scrollTo(0, 0);
}
el("prev").onclick = () => { i = Math.max(0, i - 1); render(); };
el("next").onclick = () => { i = Math.min(screens().length - 1, i + 1); render(); };

if (VOICES.length > 1) {
  el("voices").hidden = false;
  el("voiceButtons").innerHTML = VOICES.map(([k, label]) =>
    '<button data-voice="' + k + '">' + label + '</button>').join(" ");
  document.querySelectorAll("#voiceButtons button").forEach(b =>
    b.onclick = () => setVoice(b.dataset.voice));
}

document.onkeydown = ev => {
  if (ev.key.toLowerCase() === "p") { presenting = !presenting; scale = 0; applyMode(); return; }
  if (ev.key.toLowerCase() === "d") {
    document.documentElement.classList.toggle("details");
    scale = 0; applyMode(); return;
  }
  if (ev.key === "+" || ev.key === "=") { nudge(0.1); return; }
  if (ev.key === "-" || ev.key === "_") { nudge(-0.1); return; }
  if (ev.key === "ArrowRight" || ev.key === " " || ev.key === "PageDown") el("next").click();
  if (ev.key === "ArrowLeft" || ev.key === "PageUp") el("prev").click();
  if (ev.key === "Home") { i = 0; render(); }
  if (ev.key === "End") { i = screens().length - 1; render(); }
  // Voice switching is meant to happen live, mid-sentence, without losing your place.
  if (VOICES.length > 1) {
    if (ev.key.toLowerCase() === "v") {
      const n = VOICES.findIndex(v => v[0] === voice);
      setVoice(VOICES[(n + 1) % VOICES.length][0]);
    }
    const d = parseInt(ev.key, 10);
    if (d >= 1 && d <= VOICES.length) setVoice(VOICES[d - 1][0]);
  }
};
function buildPrint() {
  const SCREENS = screens();
  el("printAll").innerHTML = SCREENS.map((s, n) =>
    '<div class="page" style="' + themeVars(s.id) + '">' +
    '<div class="topline"><span class="wordmark">ATP</span>' +
    '<span class="divider-v"></span><span class="kicker">' + s.kicker.toUpperCase() + '</span>' +
    '<span class="count">' + (n + 1) + ' / ' + SCREENS.length + '</span></div>' +
    '<h1>' + s.title + '</h1><div class="rule"></div>' + s.body +
    '<div class="takeaway"><div class="h">THE LINE FOR THE ROOM</div><div class="b">' +
    s.takeaway + '</div></div></div>').join("");
}
window.onbeforeprint = buildPrint;
if (location.hash === "#print") buildPrint();

// Deep link: land on the screen the QR pointed at.
function fromHash() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const n = screens().findIndex(s => s.id === id);
  if (n >= 0) i = n;
}
fromHash();
window.addEventListener("hashchange", () => { fromHash(); render(); });
window.addEventListener("resize", autofit);

applyMode();
render();
</script>
</body>
</html>
